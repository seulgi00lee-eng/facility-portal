<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠퍼스 시설지원 포털</title>
<style>
  :root{--ink:#1d1d1f;--ink2:#1d1d1f;--mute:#86868b;--mute2:#86868b;--line:#e8e8ed;--line2:#f0f0f2;--bg:#f5f5f7;--blue:#0071e3;--bluebg:#eef1f8;--ok:#248a3d;--okbg:#eaf7ee;--okln:#c4e8cf;--warn:#b06f00;--warnbg:#fff6e6;--warnln:#f3e2bd;--dng:#c72c22;--dngbg:#fdeeed;--dngln:#f5cfcb;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-h:0 8px 24px rgba(0,0,0,.10);--r:18px;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;}
  .wrap{max-width:1040px;margin:0 auto;background:var(--bg);min-height:100vh;}
  body.dash-wide .wrap{max-width:none}
  .hd{padding:26px 32px 0;background:#fff;}
  .hd h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.4px;}
  .hd p{font-size:13.5px;color:var(--mute);margin:4px 0 0;}
  .tabs{display:flex;gap:24px;margin-top:20px;background:#fff;}
  .tn{border:none;background:none;padding:0 0 14px;cursor:pointer;font-family:inherit;color:var(--mute);font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;transition:opacity .15s;}
  .tn.on{color:var(--ink);border-bottom-color:var(--ink);}
  .tn:hover{opacity:.55;}
  .hr{height:1px;background:var(--line);}
  .view{padding:28px 32px;min-height:440px;}
  .secttl{font-size:13px;color:var(--mute2);font-weight:600;letter-spacing:-.2px;margin:0 0 14px;}
  .hint{font-size:12px;color:var(--mute2);line-height:1.5;}
  .home-row{border:none;border-radius:var(--r);padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:13px;margin-bottom:10px;max-width:820px;background:#fff;box-shadow:var(--shadow);transition:opacity .15s;}
  .home-row:hover{opacity:.55;}
  .home-row .tt{font-size:14px;font-weight:600;}
  .home-row .ts{font-size:12px;color:var(--mute2);margin-top:2px;}
  .home-row .arr{margin-left:auto;color:#c5c5c8;font-size:16px;}
  .notice{border:none;border-radius:16px;padding:16px 20px;margin-bottom:26px;font-size:13.5px;color:var(--ink);background:#fff;box-shadow:var(--shadow);max-width:820px;display:flex;align-items:center;gap:12px;font-weight:500;}
  .notice::before{content:"";width:8px;height:8px;border-radius:50%;background:#ff3b30;flex:0 0 auto;}
  .gitem{border:2px solid transparent;border-radius:14px;padding:16px 16px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink2);text-align:center;background:#fff;box-shadow:var(--shadow);transition:opacity .15s,border-color .15s;letter-spacing:-.2px;}
  .gitem:hover{opacity:.55;}
  .gitem.on{border-color:var(--blue);color:var(--blue);opacity:1;}
  .grid-g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:720px;}
  .panel{border:none;border-radius:var(--r);margin-top:18px;overflow:hidden;max-width:720px;background:#fff;box-shadow:var(--shadow);}
  .ph{padding:18px 22px;font-size:17px;font-weight:600;border-bottom:1px solid var(--line2);background:#fff;letter-spacing:-.3px;}
  .pb{padding:18px 22px;}
  .step{padding:12px 0;border-bottom:1px solid var(--line2);}
  .step:last-child{border-bottom:none;}
  .lab{font-size:12px;font-weight:600;color:var(--blue);letter-spacing:-.1px;margin-bottom:7px;}
  .stx{font-size:14.5px;line-height:1.6;color:var(--ink2);letter-spacing:-.2px;}
  .vend{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:2px 9px;font-size:12px;color:#5a5a5e;margin-top:7px;}
  .subtab{display:inline-flex;background:#eef0f2;border-radius:11px;padding:3px;margin-bottom:22px;gap:2px;}
  .stb{border:none;background:none;padding:9px 20px;font-size:13.5px;font-weight:500;color:var(--mute);cursor:pointer;font-family:inherit;border-radius:8px;transition:opacity .15s;}
  
  .stb.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .grid-i{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:760px;}
  .item{border:2px solid transparent;border-radius:14px;padding:16px 10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink2);text-align:center;background:#fff;box-shadow:var(--shadow);transition:opacity .15s,border-color .15s;}
  .item:hover{opacity:.55;}
  .item.on{border-color:var(--blue);color:var(--blue);opacity:1;}
  .lbl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .num{display:inline-flex;width:18px;height:18px;border-radius:6px;background:var(--bluebg);color:var(--blue);font-size:10.5px;align-items:center;justify-content:center;font-weight:600;}
  .fb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:500;color:var(--ink2);cursor:pointer;font-family:inherit;transition:opacity .15s;}
  .fb.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .fbtns{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap;}
  input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);box-sizing:border-box;letter-spacing:-.2px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12);}
  .pill{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-size:11.5px;padding:3px 11px;border-radius:5px;font-weight:500;}
  .submit{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .15s;letter-spacing:-.2px;}
  .submit:hover{opacity:.8;}
  .submit:active{opacity:.65;}
  .dd{margin-bottom:13px;}
  .ddh{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:#fff;transition:opacity .15s;}
  .ddh.has{border-color:var(--blue);}
  .ddh .left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-width:0;}
  .cur.sel{color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cur.ph{color:#a5a5a8;}
  .chev{color:#b5b5b8;font-size:12px;}.dd.open .chev{transform:rotate(180deg);}
  .ddbody{display:none;border:1px solid var(--line);border-top:none;border-radius:0 0 6px 6px;margin-top:-1px;padding:8px;flex-wrap:wrap;gap:6px;}
  .dd.open .ddbody{display:flex;}
  .optb{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:opacity .15s;}
  .optb.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .row2{display:flex;gap:12px;}.row2>div{flex:1;}
  .fld{margin-bottom:13px;}
  .statusbox{border:none;border-radius:var(--r);padding:18px 20px;background:#fff;box-shadow:var(--shadow);}
  .sbi{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px;gap:12px;}
  .sbi:last-of-type{border-bottom:none;}
  .sbi .k{color:#7a7a7e;flex:0 0 auto;}
  .v-wait{color:var(--mute2);font-size:12px;}
  .v-set{color:var(--ink);font-size:12px;font-weight:500;text-align:right;}
  .v-done{color:var(--ok);font-size:12px;font-weight:600;}
  .twocol{display:grid;grid-template-columns:1.2fr 1fr;gap:26px;align-items:start;}
  .card{border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;}
  .ch{padding:12px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line2);}
  .ch .title{font-size:15px;font-weight:600;}
  .ch .rid{font-size:12.5px;color:#a5a5a8;margin-top:3px;}
  .badge{font-size:12px;padding:4px 11px;border-radius:6px;font-weight:600;border:1px solid var(--line);}
  .mlhead{transition:background .12s;}.mlhead:hover{background:var(--line2);}
  .mlcard .ch{padding:14px 17px;}
  .b-wait{color:var(--mute);background:#f0f0f2;}.b-prog{color:var(--warn);background:var(--warnbg);border-color:var(--warnln);}.b-done{color:var(--ok);background:var(--okbg);border-color:var(--okln);}
  .ttag{font-size:10.5px;padding:1px 8px;border-radius:4px;font-weight:500;margin-right:7px;border:1px solid var(--line);color:#7a7a7e;background:var(--bg);}
  .cbody{padding:6px 15px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 22px;}
  .filt{display:flex;gap:6px;margin-bottom:16px;}
  .flt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--mute);cursor:pointer;font-family:inherit;}
  .flt.on{background:var(--blue);color:#fff;border-color:var(--blue);}
  .ecode{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:500;color:var(--ink2);cursor:pointer;font-family:inherit;transition:opacity .15s;}
  .ecode:hover{opacity:.6;}.ecode.on{background:var(--blue);color:#fff;border-color:var(--blue);opacity:1;}
  .infogrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  @media(max-width:760px){.wrap{max-width:100%;border:none}.twocol,.infogrid{grid-template-columns:1fr}.grid-g,.grid-i{grid-template-columns:1fr 1fr}.cbody{grid-template-columns:1fr}.view,.hd{padding-left:18px;padding-right:18px}.tn{padding:9px 11px}}

  .ovl{position:fixed;inset:0;background:rgba(20,20,22,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .ovl.show{display:flex;}
  .modal{background:#fff;border:none;border-radius:20px;max-width:440px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.22);}
  .mh{padding:16px 20px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;}
  .mb{padding:16px 20px;}
  .mrow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;}
  .mrow:last-child{border-bottom:none;}
  .mrow .mk{color:#8a8a8e;flex:0 0 38%;}
  .mrow .mv{color:var(--ink);font-weight:500;text-align:right;word-break:break-word;}
  .mq{font-size:14px;font-weight:600;text-align:center;margin:16px 0 4px;}
  .mf{display:flex;gap:10px;padding:14px 20px 18px;}
  .mbtn{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;border:1px solid var(--line);transition:opacity .15s;}
  .mbtn.no{background:#fff;color:var(--ink2);}
  .mbtn.yes{background:var(--blue);color:#fff;border-color:var(--blue);}
  .gate{max-width:360px;}
  .done-ic{width:46px;height:46px;border-radius:50%;background:var(--okbg);border:1px solid var(--okln);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:22px;margin:4px auto 10px;}

  .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:820px;}
  .hcard{border:none;border-radius:var(--r);padding:22px 20px;cursor:pointer;text-align:left;background:#fff;box-shadow:var(--shadow);transition:opacity .15s;display:flex;flex-direction:column;gap:0;font-family:inherit;}
  .hcard:hover{opacity:.55;}
  .hcard:active{opacity:.4;}
  .hcard .hnum{font-size:11px;color:var(--blue);font-weight:600;margin-bottom:12px;letter-spacing:0;}
  .hcard .htt{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:5px;line-height:1.35;letter-spacing:-.3px;}
  .hcard .hts{font-size:13px;color:var(--mute2);line-height:1.5;}
  @media(max-width:760px){.home-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:480px){.home-grid{grid-template-columns:1fr;}}

  /* 로그인 게이트 */
  .gate-ovl{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
  .gate-card{background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.10);width:100%;max-width:400px;padding:36px 32px;}
  .gate-card h2{font-size:22px;font-weight:600;letter-spacing:-.4px;margin:0 0 6px;}
  .gate-card .sub{font-size:13.5px;color:var(--mute);margin:0 0 26px;}
  .gate-seg{display:flex;background:#eef0f2;border-radius:11px;padding:3px;margin-bottom:22px;}
  .gate-seg button{flex:1;border:none;background:none;padding:9px;font-size:13.5px;font-weight:500;color:var(--mute);cursor:pointer;font-family:inherit;border-radius:8px;transition:opacity .15s;}
  .gate-seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .gate-fld{margin-bottom:14px;}
  .gate-fld label{font-size:12.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px;}
  .gate-hint{font-size:12px;color:var(--mute2);line-height:1.5;margin-top:6px;}
  .gate-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;transition:opacity .15s;}
  .gate-btn:hover{opacity:.85;}
  .gate-btn:disabled{opacity:.5;cursor:default;}
  .gate-msg{font-size:12.5px;margin-top:12px;padding:10px 12px;border-radius:9px;line-height:1.5;}
  .gate-msg.err{background:var(--dngbg);color:var(--dng);border:1px solid var(--dngln);}
  .gate-msg.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--okln);}
  .acctbar{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);}
  .acctbar b{color:var(--ink);font-weight:600;}
  .acctbar .logout{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-size:12px;color:var(--ink2);cursor:pointer;font-family:inherit;}
@keyframes facspin{to{transform:rotate(360deg)}}

  /* ===== 업무 대시보드 ===== */
  .dsh-warn{background:var(--warnbg);border:1px solid var(--warnln);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
  .dsh-warn .m{color:var(--mute);font-size:11.5px}
  .dsh-sum{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
  @media(max-width:820px){.dsh-sum{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(max-width:520px){.dsh-sum{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .dsh-sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;text-align:left;font-family:inherit}
  .dsh-sc .n{font-size:21px;font-weight:700;color:var(--ink);line-height:1.2}
  .dsh-sc .k{font-size:11.5px;color:var(--mute)}
  .dsh-sc.alert .n{color:var(--dng)}
  .dsh-sc.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--bluebg)}
  .dsh-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .dsh-chip{display:inline-flex;align-items:center;background:var(--bluebg);color:var(--blue);border-radius:14px;padding:3px 11px;font-size:12px;cursor:pointer;font-weight:600}
  .dsh-cal{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dsh-calh{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .dsh-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .dsh-dow{font-size:11.5px;color:var(--mute);text-align:center;padding:6px 0;border-bottom:1px solid var(--line2)}
  .dsh-day{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;cursor:pointer;overflow:hidden;min-width:0}
  .dsh-day:nth-child(7n){border-right:0}
  .dsh-day.out{background:#fafafa}
  .dsh-day.out .dsh-dn{color:var(--mute)}
  .dsh-day.today .dsh-dn{background:var(--blue);color:#fff;border-radius:10px;padding:0 7px}
  .dsh-day.sel{box-shadow:inset 0 0 0 2px var(--blue)}
  .dsh-dn{font-size:12px;font-weight:600;margin-bottom:3px;display:inline-block}
  .dsh-ev{display:block;font-size:11px;line-height:1.3;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;cursor:pointer;font-weight:600}
  .dsh-ev .ev1,.dsh-ev .ev2{display:block;overflow:hidden;text-overflow:ellipsis}
  .dsh-ev .ev2{font-weight:400;font-size:10.5px;opacity:.85}
  .ev-k{display:inline-block;font-style:normal;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:3px;margin-right:4px;color:#fff;line-height:14px;vertical-align:1px}
  .ev-k.pl{background:#fff;color:#6e6e73;border:1px dashed #a1a1a6;line-height:12px}
  .dsh-ev.plan{background:#fff!important}
  .dsh-ev .ev-nv{opacity:.6;font-weight:400}
  .dsh-ev.plan{border-left-style:dashed;font-weight:400}
  .dsh-more{font-size:11px;color:var(--mute)}
  .dsh-dots{display:none}
  @media(max-width:640px){.dsh-day{min-height:52px;padding:3px}.dsh-ev,.dsh-more{display:none}.dsh-dots{display:flex;gap:2px;flex-wrap:wrap}.dsh-dots i{width:6px;height:6px;border-radius:50%;display:block}}
  .dsh-sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden}
  .dsh-sech{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line2);font-size:13.5px}
  .dsh-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
  .dsh-row:last-child{border-bottom:0}
  .dsh-row:hover{background:var(--bg)}
  .dsh-t{font-size:13px;font-weight:600;margin-top:4px;color:var(--ink)}
  .dsh-meta{color:var(--mute);font-size:11.5px;margin-top:3px;line-height:1.55}
  .dsh-tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px;white-space:nowrap}
  .dsh-late{display:inline-block;font-size:10.5px;font-weight:700;color:#b3261e;background:#fff;border:1px solid #e8c4c0;padding:1px 6px;border-radius:4px;margin-right:4px}
  .dsh-sw{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .dsh-swrow{display:grid;grid-template-columns:118px minmax(0,1fr);border-bottom:1px solid var(--line2)}
  .dsh-swrow:last-child{border-bottom:0}
  .dsh-swh{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 12px;font-size:13px;background:#fafafa;border-right:1px solid var(--line2);color:var(--ink)}
  .dsh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
  .dsh-tag-n{color:#6e6e73;background:#fff;border:1px solid #d2d2d7;font-weight:600}
  .dsh-swh .dsh-late{align-self:flex-start}
  .dsh-lanen{color:var(--mute);font-size:12px}
  .dsh-swb{position:relative;min-width:0}
  .dsh-strip{display:flex;gap:8px;overflow-x:auto;padding:8px 10px;scroll-behavior:smooth;scrollbar-width:thin}
  .dsh-sc2.late{border-color:#e8c4c0}
  .dsh-sc2{flex:0 0 212px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;cursor:pointer;font-size:12px;line-height:1.45;min-width:0}
  .dsh-sc2:hover{box-shadow:var(--shadow-h)}
  .dsh-sc2 .r1{display:flex;align-items:center;gap:2px;min-width:0}
  .dsh-sc2 .no{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsh-sc2 .mv{margin-left:auto;display:flex;gap:3px;flex:0 0 auto}
  .dsh-sc2 .mv button{border:1px solid var(--line);background:#fff;border-radius:5px;width:22px;height:20px;font-size:11px;cursor:pointer;color:var(--ink2);padding:0;font-family:inherit}
  .dsh-sc2 .mv button:hover{border-color:var(--blue);color:var(--blue)}

  return '';
}

function bindBoard(){function tier(w){for(var i=0;i<TIERS.length;i++){if(w<=TIERS[i][0])return TIERS[i];}return null;}function val(id){return document.getElementById(id).value;}function calc(){var w=Number(val('w')),q=Math.max(1,Number(val('q'))||1);var seg=document.getElementById('seg');var s=0;if(w>0){var t=tier(w);if(t){s=t[1]*q;seg.textContent='구간 '+t[2]+' · '+t[1].toLocaleString()+'원/개 × '+q+'개';}else seg.textContent='5400mm 초과 — 별도 견적';}else seg.textContent='';document.getElementById('grand').textContent=Math.round(s*1.1).toLocaleString()+' 원';}['w','q'].forEach(function(id){document.getElementById(id).addEventListener('input',calc);});}

// 지역(캠퍼스) 목록 로드 → campus 드롭다운 옵션 채움
function loadCampuses(cb){
  if(!SB_READY){if(cb)cb([]);return;}
  if(CAMPUS_CACHE){if(cb)cb(CAMPUS_CACHE);return;}
  sb.from('fac_campus_master').select('region').then(function(res){
    var rows=(res&&res.data)||[];
    var set={},list=[];
    rows.forEach(function(r){if(r.region&&!set[r.region]){set[r.region]=1;list.push(r.region);}});
    list.sort();
    CAMPUS_CACHE=list;
    if(cb)cb(list);
  });
}
// 특정 지역의 건물 목록
function loadBuildings(region,cb){
  if(!SB_READY||!region){if(cb)cb([]);return;}
  if(BLD_CACHE[region]){if(cb)cb(BLD_CACHE[region]);return;}
  sb.from('fac_campus_buildings').select('building').eq('region',region).then(function(res){
    var rows=(res&&res.data)||[];
    var set={},list=[];
    rows.forEach(function(r){if(r.building&&!set[r.building]){set[r.building]=1;list.push(r.building);}});
    list.sort();
    BLD_CACHE[region]=list;
    if(cb)cb(list);
  });
}
// 특정 지역+건물의 층 목록
function loadFloors(region,building,cb){
  if(!SB_READY||!region){if(cb)cb([]);return;}
  var key=region+'|'+building;
  if(FLR_CACHE[key]){if(cb)cb(FLR_CACHE[key]);return;}
  var q=sb.from('fac_campus_floors').select('floor').eq('region',region);
  if(building)q=q.eq('building',building);
  q.then(function(res){
    var rows=(res&&res.data)||[];
    var set={},list=[];
    rows.forEach(function(r){if(r.floor&&!set[r.floor]){set[r.floor]=1;list.push(r.floor);}});
    // 층수 정렬: 숫자 기준
    list.sort(function(a,b){return (parseInt(a)||0)-(parseInt(b)||0);});
    FLR_CACHE[key]=list;
    if(cb)cb(list);
  });
}
// 드롭다운 옵션을 동적으로 다시 채우기
function fillDDOptions(k,list){
  var box=document.querySelector('.dd[data-k="'+k+'"]');if(!box)return;
  var body=box.querySelector('.ddbody');
  var m=META[k];
  STATE[k]=m.multi?[]:null;

// 캠퍼스(지역) 선택 시: 건물 로드
// 명함 폼 전용 플래그 — '본사' 사업부 선택 시 브랜드·캠퍼스 자동 본사 처리
var CARD_MODE=false;
function forceDD(k,val){
  var box=document.querySelector('.dd[data-k="'+k+'"]'); if(!box)return;
  STATE[k]=val;
  var arr=Array.isArray(val)?val:(val==null?[]:[val]);
  box.querySelectorAll('.optb').forEach(function(x){x.classList.toggle('on', arr.indexOf(x.dataset.v)>=0);});
  paint(k);
}
function onBizPicked(clicked){
  if(!CARD_MODE) return;                 // 명함 폼에서만 작동
  var v=clicked.dataset.v;
  if(v==='본사'){
    if(clicked.classList.contains('on')){ // 본사 켜짐 → 단독 선택 + 브랜드·캠퍼스 자동 본사
      forceDD('biz',['본사']); forceDD('brand',['본사']); forceDD('campus','본사');
    } else {                              // 본사 꺼짐 → 자동값 해제
      forceDD('brand',[]); forceDD('campus',null);
    }
  } else {                                // 다른 사업부 클릭 → 본사 해제 + 자동값 초기화
    if((STATE.biz||[]).indexOf('본사')>=0){
      STATE.biz=(STATE.biz||[]).filter(function(x){return x!=='본사';});
      var box=document.querySelector('.dd[data-k="biz"]');
      if(box){var hq=[].slice.call(box.querySelectorAll('.optb')).filter(function(x){return x.dataset.v==='본사';})[0]; if(hq)hq.classList.remove('on');}
      forceDD('brand',[]); forceDD('campus',null); paint('biz');
    }
  }
}
function onCampusPicked(region){
  var bb=document.querySelector('.dd[data-k="building"]');if(bb)fillDDOptions('building',[]);
  var fb=document.querySelector('.dd[data-k="floor"]');if(fb)fillDDOptions('floor',[]);
  loadBuildings(region,function(list){fillDDOptions('building',list);});
  if(typeof autoMatchNotifyEmail==='function')autoMatchNotifyEmail(region);
}
// 건물 선택 시: 층 로드
function onBuildingPicked(building){
  var region=STATE.campus;
  loadFloors(region,building,function(list){fillDDOptions('floor',list);});
}

function buildDD(k){var m=META[k],box=document.querySelector('.dd[data-k="'+k+'"]');if(!box)return;STATE[k]=m.multi?[]:null;var opts=m.o.length?m.o.map(function(o){return '<button type="button" class="optb" data-v="'+o+'">'+o+'</button>';}).join(''):'<div class="hint" style="padding:4px 2px">'+(m.dep||'')+'</div>';box.innerHTML='<div class="ddh"><span class="left">'+(m.n?'<span class="num">'+m.n+'</span>':'')+m.t+(m.multi?' <span class="hint" style="font-size:11px">다중</span>':'')+' <span class="cur ph">선택</span></span><span class="chev">⌄</span></div><div class="ddbody">'+opts+'</div>';box.querySelector('.ddh').addEventListener('click',function(){box.classList.toggle('open');});box.querySelectorAll('.optb').forEach(function(b){b.addEventListener('click',function(){if(m.multi){b.classList.toggle('on');STATE[k]=[].slice.call(box.querySelectorAll('.optb.on')).map(function(x){return x.dataset.v;});if(k==='biz'){onBizPicked(b);}}else{box.querySelectorAll('.optb').forEach(function(x){x.classList.remove('on');});b.classList.add('on');STATE[k]=b.dataset.v;box.classList.remove('open');if(k==='campus'){lsSet('fac_campus',b.dataset.v);onCampusPicked(b.dataset.v);}if(k==='building'){lsSet('fac_building',b.dataset.v);onBuildingPicked(b.dataset.v);}}paint(k);});});}
function paint(k){var box=document.querySelector('.dd[data-k="'+k+'"]');if(!box)return;var cur=box.querySelector('.cur'),head=box.querySelector('.ddh'),v=STATE[k],has=META[k].multi?(v&&v.length):!!v;head.classList.toggle('has',!!has);if(!has){cur.className='cur ph';cur.textContent='선택';}else{cur.className='cur sel';cur.textContent=META[k].multi?(v.length<=2?v.join(', '):v[0]+' 외 '+(v.length-1)):v;}}
function refreshFloor(){var box=document.querySelector('.dd[data-k="floor"]');if(!box)return;var body=box.querySelector('.ddbody'),b=STATE.building,list=FLOORS[b];STATE.floor=[];body.innerHTML=(list&&list.length)?list.map(function(f){return '<button type="button" class="optb" data-v="'+f+'">'+f+'</button>';}).join(''):'<div class="hint" style="padding:4px 2px">'+(b||'건물')+' 층 정보는 추후 연동됩니다</div>';body.querySelectorAll('.optb').forEach(function(bt){bt.addEventListener('click',function(){bt.classList.toggle('on');STATE.floor=[].slice.call(body.querySelectorAll('.optb.on')).map(function(x){return x.dataset.v;});paint('floor');});});paint('floor');}

var STAGES={

  pen : ['접수 확인','준비 중','전달 완료','보류'],
  voice:['접수 확인','검토 중','답변 완료','보류'],
  card:['접수 확인','제작 요청','제작 중','전달 완료','보류']
};
var STAGE_DONE={fix:'조치 완료', buy:'완료', rent:'완료', pen:'전달 완료', voice:'답변 완료', card:'전달 완료'};
function stagesOf(t){return STAGES[t]||STAGES.fix;}
// 2026-11 유지보수 단계 재정비 전 기록(업체 배정·현장 점검)은 '방문 예정'으로 인정
var STAGE_ALIAS={fix:{'업체 배정':'방문 예정','현장 점검':'방문 예정'}};
function stageNorm(t,name){var a=STAGE_ALIAS[t];return (a&&a[name])||name;}
function stageDone(t){return STAGE_DONE[t]||'완료';}
function stageStatus(t,name){
  if(name===stageDone(t))return 'done';
  // 명함: 단계 정비 이전에 '조치 완료'로 등록된 기존 건도 완료로 인정
  if(t==='card'&&name==='조치 완료')return 'done';
  return 'prog';
}
// 진행률 (보류는 계산 제외)
function stageProgress(t,name){
  var list=stagesOf(t).filter(function(x){return x!=='보류';});
  var i=list.indexOf(stageNorm(t,name));
  return {i:(i<0?0:i+1), n:list.length};
}
// 다음 단계 기본 선택값
function nextStage(r){
  var log=r.plog||[];
  var list=stagesOf(r.type);
  if(!log.length)return list[0];
  var cur=stageNorm(r.type,log[log.length-1].stage);
  if(cur==='보류')return cur;
  var i=list.indexOf(cur);
  return (i<0||i>=list.length-2)?cur:list[i+1];
}
function plogRows(r){return Array.isArray(r.plog)?r.plog:[];}

var DOCS=[];
var DOC_CATS=["전체","보험증권","교육청 양식","이수증 및 수료증","매뉴얼"];

function docEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function docExt(n){var m=/\.([A-Za-z0-9]{1,8})$/.exec(n||'');return m?m[1].toLowerCase():'bin';}
function docSize(b){b=Number(b||0);if(!b)return '';if(b<1024)return b+'B';if(b<1048576)return (b/1024).toFixed(0)+'KB';return (b/1048576).toFixed(1)+'MB';}
function docById(id){for(var i=0;i<DOCS.length;i++){if(String(DOCS[i].id)===String(id))return DOCS[i];}return null;}
function docIsAdmin(){return !!(CURRENT_USER&&CURRENT_USER.role==='admin');}
// 폴더 정렬 — 최신 년도가 위로 (2026 > 2025), 폴더 없음은 맨 아래
function docFolderSort(a,b){
  if(a===''&&b!=='')return 1; if(b===''&&a!=='')return -1;
  return String(b).localeCompare(String(a),'ko',{numeric:true});
}
// 특정 카테고리에 존재하는 폴더 목록
function docFolders(cat){
  var set={},out=[];
  DOCS.forEach(function(d){
    if(cat!=='전체'&&d.cat!==cat)return;
    var f=d.folder||'';
    if(!(f in set)){set[f]=1;out.push(f);}
  });
  out.sort(docFolderSort);
  return out;
}
function docAllFolders(){
  var set={},out=[];
  DOCS.forEach(function(d){if(d.folder&&!set[d.folder]){set[d.folder]=1;out.push(d.folder);}});
  out.sort(docFolderSort);
  return out;
}

function docMatch(d){

// Blob으로 받아 a.download 로 저장 → 원본 한글 파일명 100% 보존
function docFetchBlob(d){
  return sb.storage.from(DOC_BUCKET).download(d.path).then(function(res){
    if(res.error||!res.data)throw new Error((res.error&&res.error.message)||'파일을 가져오지 못했습니다');
    return res.data;
  });
}
function docSaveBlob(blob,filename){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename||'download'; a.style.display='none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
function docDownload(id){
  var d=docById(id);
  if(!d||!d.path){alert('아직 파일이 등록되지 않은 항목입니다.');return;}
  var btn=document.getElementById('dbtn_'+id);
  if(btn){btn.disabled=true;btn.textContent='받는 중...';}
  docFetchBlob(d).then(function(blob){
    docSaveBlob(blob,d.file||d.name);
    if(btn){btn.disabled=false;btn.textContent='다운로드';}
  }).catch(function(e){
    if(btn){btn.disabled=false;btn.textContent='다운로드';}
    alert('다운로드 실패\n'+(e.message||String(e)));
  });
}
// 일괄 다운로드 — 순차 처리 (동시 요청 시 브라우저가 뒷건을 취소함)
function docDownloadSel(){
  if(DOC_BUSY)return;
  var ids=[];for(var k in DOC_SEL){if(DOC_SEL[k])ids.push(k);}
  var list=ids.map(docById).filter(function(d){return d&&d.path;});
  if(!list.length){alert('다운로드할 자료를 체크해 주세요.');return;}
  DOC_BUSY=true;
  var done=0,fail=0,names=[];
  function tick(){renderDocBar('<b style="color:var(--blue)">받는 중 '+(done+fail)+'/'+list.length+'</b>'+(fail?(' · <b style="color:var(--dng)">실패 '+fail+'</b>'):''));}
  tick();
  var chain=Promise.resolve();
  list.forEach(function(d){
    chain=chain.then(function(){
      return docFetchBlob(d).then(function(blob){
        docSaveBlob(blob,d.file||d.name);done++;tick();
        return new Promise(function(r){setTimeout(r,350);}); // 브라우저 저장 큐 여유
      }).catch(function(e){fail++;names.push(d.name);tick();});
    });
  });
  chain.then(function(){
    DOC_BUSY=false;
    if(fail){renderDocBar('<b style="color:var(--dng)">'+fail+'건 실패</b> — '+docEsc(names.slice(0,3).join(', '))+(names.length>3?' 외':''));}
    else{DOC_SEL={};renderDocs();renderDocBar('<b style="color:var(--ok)">✓ '+done+'건 저장 완료</b>');}
  });
}

  var searching=!!DOC_AQ;   // 검색 중에는 결과를 자동으로 펼침

    h+=docAccRow(ck,docEsc(c),inCat.length,0,searching,catBtn);
    if(!(searching||DOC_OPEN[ck]))return;
    var g={},order=[];
    inCat.forEach(function(d){var f=d.folder||'';if(!(f in g)){g[f]=[];order.push(f);}g[f].push(d);});
    order.sort(docFolderSort);
    var multi=(order.length>1||(order.length===1&&order[0]!==''));
    order.forEach(function(f){
      if(!multi){
        h+='<div style="margin:2px 0 8px"><button class="flt" style="padding:3px 11px;font-size:12px" onclick="docAddOpen(\''+docEsc(c).replace(/'/g,"\\'")+'\',\''+docEsc(f).replace(/'/g,"\\'")+'\')">+ 여기에 자료 추가</button></div>';
        h+=g[f].map(docAdminCard).join('');return;
      }
      var fk='f:'+c+'|'+f;
      var cEsc=docEsc(c).replace(/'/g,"\\'"), fEsc=docEsc(f).replace(/'/g,"\\'");

      fBtn+='<button class="flt" style="padding:3px 11px;font-size:12px;white-space:nowrap" onclick="event.stopPropagation();docAddOpen(\''+cEsc+'\',\''+fEsc+'\')">+ 이 폴더에 추가</button>';
      h+=docAccRow(fk,(f===''?'📁 폴더 없음':'📂 '+docEsc(f)),g[f].length,1,searching,fBtn);
      if(searching||DOC_OPEN[fk])h+='<div style="padding-left:16px">'+g[f].map(docAdminCard).join('')+'</div>';
    });
    // 카테고리 안에 '새 폴더 만들기' — 폴더 없이 열리면 폴더 입력만 채워 추가 모달
    if(multi||order[0]===''){
      h+='<div style="padding-left:16px;margin:4px 0 2px"><button class="flt" style="padding:3px 11px;font-size:12px;border-style:dashed" onclick="docAddOpen(\''+docEsc(c).replace(/'/g,"\\'")+'\',\'\',true)">+ 새 폴더 만들어 추가</button></div>';
    }
  });

}
function docStat(id,html,color){var el=document.getElementById('dstat_'+id);if(el){el.innerHTML=html;el.style.color=color||'';}}

function docUpload(id,inp){
  var f=inp&&inp.files&&inp.files[0];if(!f)return;
  if(!docIsAdmin()){alert('총무기획팀 계정만 업로드할 수 있습니다.');inp.value='';return;}
  if(f.size>DOC_MAXMB*1024*1024){alert(DOC_MAXMB+'MB 이하 파일만 업로드할 수 있습니다. (선택한 파일: '+docSize(f.size)+')');inp.value='';return;}
  var d=docById(id);if(!d){inp.value='';return;}
  var oldPath=d.path;
  var newPath='docs/'+id+'/'+Date.now()+'.'+docExt(f.name);
  var notify=(document.getElementById('dnoti_'+id)||{}).checked;
  inp.disabled=true;
  docStat(id,'업로드 중... ('+docSize(f.size)+')','var(--warn)');
  sb.storage.from(DOC_BUCKET).upload(newPath,f,{upsert:false,contentType:f.type||'application/octet-stream'}).then(function(up){
    if(up.error)throw new Error('업로드 실패: '+up.error.message);
    return sb.from('fac_documents').update({
      file_name:f.name, file_path:newPath, file_size:f.size,
      updated_at:new Date().toISOString(),
      created_by:(CURRENT_USER&&CURRENT_USER.login_id)||null
    }).eq('id',id).select();
  }).then(function(res){
    if(res.error)throw new Error('목록 반영 실패: '+res.error.message);
    if(oldPath&&oldPath!==newPath)sb.storage.from(DOC_BUCKET).remove([oldPath]);
    d.file=f.name;d.path=newPath;d.size=f.size;d.updated=new Date().toISOString().slice(0,10);
    docStat(id,'<b style="color:var(--ok)">✓ 업로드 완료</b> · '+docEsc(f.name)+' ('+docSize(f.size)+')','');
    if(notify){
      n8nNotify({type:'doc_update',doc_id:id,category:d.cat,folder:d.folder||'',name:d.name,file_name:f.name,
        updated_at:d.updated,by:staffLabel()}).then(function(){});
    }
    setTimeout(loadDocs,900);
  }).catch(function(e){
    docStat(id,'<b style="color:var(--dng)">'+docEsc(e.message||String(e))+'</b>','');
    inp.disabled=false;inp.value='';
  });
}

// ===== 카테고리별 파일명 규칙 =====
// 이수증·수료증: 지역_학원명_자료명  (예: 수내_수내캠퍼스_안전교육이수증.pdf)
var DOC_RULE={
  "이수증 및 수료증":{
    guide:'파일명 규칙 — <b>지역_학원명_자료명</b> &nbsp;(예: <code>수내_수내캠퍼스_안전교육이수증.pdf</code>)<br>규칙대로 올리면 자료명이 자동으로 정확히 들어갑니다.',
    test:function(base){
      var p=String(base).split('_');
      if(p.length<3)return '규칙 확인 — 지역_학원명_자료명 형태가 아닙니다';
      if(p.some(function(x){return !x.trim();}))return '규칙 확인 — 비어있는 구간이 있습니다';

    }
  }
};
function docRule(){return DOC_RULE[(document.getElementById('dnew_cat')||{}).value]||null;}

var DNEW_FILES=[];
function docBaseName(n){return String(n||'').replace(/\.[A-Za-z0-9]{1,8}$/,'');}

  DNEW_FILES=[];

    +'<div class="lbl" style="margin-top:13px">파일 <span style="font-weight:400;color:var(--mute)">— 여러 개 한 번에 선택할 수 있습니다</span></div>'
    +'<label class="flt" style="cursor:pointer;display:inline-block">+ 파일 선택 (여러 개 가능)<input type="file" id="dnew_file" multiple style="display:none" onchange="docNewFiles(this)"></label>'
    +'<div id="dnew_files" style="margin-top:9px"></div>'
    +'<div id="dnew_solo" style="margin-top:11px"><div class="lbl">자료명 (파일 없이 항목만 만들 때)</div><input type="text" id="dnew_name" placeholder="예: 2026년 통합 보험증권" style="width:100%"></div>'
    +'<div class="hint" id="dnew_msg" style="margin-top:10px;line-height:1.5">파일을 여러 개 고르면 <b>파일 1개당 자료 1건</b>으로 등록되고, 자료명은 파일명이 자동으로 들어갑니다. 아래에서 개별 수정할 수 있습니다.</div>'
    +'</div><div class="mf"><button class="mbtn no" onclick="closeModal()">취소</button><button class="mbtn yes" id="dnew_ok" onclick="docAddSave()">추가</button></div>');
  docNewRender();
  if(focusFolder){var fe=document.getElementById('dnew_folder');if(fe){fe.focus();fe.placeholder='새 폴더 이름 (예: 2027년)';}}

function docNewFiles(inp){
  var fs=inp.files?Array.prototype.slice.call(inp.files):[];
  fs.forEach(function(f){
    var dup=DNEW_FILES.some(function(x){return x.f.name===f.name&&x.f.size===f.size;});
    if(!dup)DNEW_FILES.push({f:f,name:docBaseName(f.name),err:(f.size>DOC_MAXMB*1024*1024)?('용량 초과 ('+docSize(f.size)+')'):''});
  });
  inp.value='';
  var ok=document.getElementById('dnew_ok');if(ok){delete ok.dataset.warned;ok.textContent='추가';}
  docNewRender();
}
function docNewRemove(i){DNEW_FILES.splice(i,1);docNewRender();}
var __dnT=null;
function docNewName(i,v){if(!DNEW_FILES[i])return;DNEW_FILES[i].name=v;var r=docRule();var st=document.getElementById('dnfs_'+i),row=document.getElementById('dnf_'+i);if(!r||!st||!row)return;var w=DNEW_FILES[i].err?'':r.test(v);DNEW_FILES[i].warn=w;row.style.background=DNEW_FILES[i].err?'var(--dngbg)':(w?'var(--warnbg)':'#fff');st.innerHTML=DNEW_FILES[i].err?('<b style="color:var(--dng)">'+docEsc(DNEW_FILES[i].err)+'</b>'):(w?('<b style="color:var(--warn)">'+docEsc(w)+'</b>'):(docEsc(DNEW_FILES[i].f.name)+' · '+docSize(DNEW_FILES[i].f.size)));}
function docNewRender(){
  var box=document.getElementById('dnew_files');if(!box)return;
  var rule=docRule();
  // 규칙 안내 배너
  var rb=document.getElementById('dnew_rule');
  if(rb)rb.innerHTML=rule?('<div class="hint" style="margin-top:8px;line-height:1.55;border:1px solid var(--bluln,var(--line));background:var(--bluebg);border-radius:7px;padding:9px 11px">'+rule.guide+'</div>'):'';
  // 파일별 규칙 재검사
  DNEW_FILES.forEach(function(x){
    x.err=(x.f.size>DOC_MAXMB*1024*1024)?('용량 초과 ('+docSize(x.f.size)+')'):'';
    x.warn=(!x.err&&rule)?rule.test(x.name):'';
  });
  var solo=document.getElementById('dnew_solo');
  if(solo)solo.style.display=DNEW_FILES.length?'none':'';
  if(!DNEW_FILES.length){box.innerHTML='';return;}
  var bad=DNEW_FILES.filter(function(x){return x.err;}).length;
  var wrn=DNEW_FILES.filter(function(x){return x.warn;}).length;
  var tot=DNEW_FILES.reduce(function(a,x){return a+x.f.size;},0);
  box.innerHTML='<div class="hint" style="margin-bottom:7px">선택 <b>'+DNEW_FILES.length+'건</b> · 합계 '+docSize(tot)
      +(bad?(' · <b style="color:var(--dng)">오류 '+bad+'건</b>'):'')
      +(wrn?(' · <b style="color:var(--warn)">규칙 확인 '+wrn+'건</b>'):'')+'</div>'
    +'<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden">'
    +DNEW_FILES.map(function(x,i){
      var bg=x.err?'var(--dngbg)':(x.warn?'var(--warnbg)':'#fff');
      var right=x.err?('<b style="color:var(--dng)">'+docEsc(x.err)+'</b>')
        :(x.warn?('<b style="color:var(--warn)">'+docEsc(x.warn)+'</b>')
        :(docEsc(x.f.name)+' · '+docSize(x.f.size)));
      return '<div id="dnf_'+i+'" style="display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line2);background:'+bg+'">'
        +'<input type="text" value="'+docEsc(x.name)+'" oninput="docNewName('+i+',this.value)" style="flex:1;min-width:0;font-size:12.5px;padding:5px 8px">'
        +'<span class="hint" id="dnfs_'+i+'" style="font-size:11.5px;white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis">'+right+'</span>'
        +'<button type="button" class="flt" style="padding:2px 8px;font-size:12px;border-color:var(--dngln);color:var(--dng)" onclick="docNewRemove('+i+')">×</button>'
        +'</div>';
    }).join('')+'</div>';
}
function docAddSave(){
  var cat=document.getElementById('dnew_cat').value;
  var folder=(document.getElementById('dnew_folder').value||'').trim();
  var note=(document.getElementById('dnew_note').value||'').trim();
  var msg=document.getElementById('dnew_msg');
  var ok=document.getElementById('dnew_ok');
  if(!docIsAdmin()){msg.innerHTML='<b style="color:var(--dng)">총무기획팀 계정만 등록할 수 있습니다.</b>';return;}

  // 파일 없이 항목만 생성
  if(!DNEW_FILES.length){
    var name=(document.getElementById('dnew_name').value||'').trim();
    if(!name){msg.innerHTML='<b style="color:var(--dng)">파일을 선택하거나 자료명을 입력해 주세요.</b>';return;}
    ok.disabled=true;ok.textContent='저장 중...';
    sb.from('fac_documents').insert({category:cat,folder:folder||null,name:name,note:note,
      created_by:(CURRENT_USER&&CURRENT_USER.login_id)||null}).then(function(res){
      if(res.error){ok.disabled=false;ok.textContent='추가';msg.innerHTML='<b style="color:var(--dng)">등록 실패: '+docEsc(res.error.message)+'</b>';return;}
      closeModal();loadDocs();
    });
    return;
  }

  // 검증
  var bad=DNEW_FILES.filter(function(x){return x.err;});
  if(bad.length){msg.innerHTML='<b style="color:var(--dng)">'+DOC_MAXMB+'MB 초과 파일 '+bad.length+'건을 목록에서 제거해 주세요.</b>';return;}
  var noname=DNEW_FILES.filter(function(x){return !String(x.name||'').trim();});
  if(noname.length){msg.innerHTML='<b style="color:var(--dng)">자료명이 비어있는 항목이 '+noname.length+'건 있습니다.</b>';return;}
  var warns=DNEW_FILES.filter(function(x){return x.warn;});
  if(warns.length&&!ok.dataset.warned){
    ok.dataset.warned='1';ok.textContent='규칙 무시하고 추가';
    msg.innerHTML='<b style="color:var(--warn)">'+warns.length+'건이 파일명 규칙과 다릅니다.</b> 자료명을 고치거나, 그대로 진행하려면 버튼을 한 번 더 누르세요.';
    return;
  }

  ok.disabled=true;
  var total=DNEW_FILES.length,done=0,fail=0;
  function tick(){ok.textContent='업로드 '+(done+fail)+'/'+total;
    msg.innerHTML='업로드 중입니다... <b>'+(done+fail)+'/'+total+'</b>'+(fail?(' · <b style="color:var(--dng)">실패 '+fail+'</b>'):'')+'<br>창을 닫지 마세요.';}
  tick();

  // 순차 업로드 (동시 업로드 시 Storage 레이트리밋 위험 → 1건씩)
  var chain=Promise.resolve();
  DNEW_FILES.forEach(function(x,i){
    chain=chain.then(function(){
      var st=document.getElementById('dnfs_'+i);
      if(st)st.innerHTML='<b style="color:var(--warn)">업로드 중...</b>';
      var newId=null;
      return sb.from('fac_documents').insert({category:cat,folder:folder||null,name:String(x.name).trim(),note:note,
        created_by:(CURRENT_USER&&CURRENT_USER.login_id)||null}).select('id').then(function(res){
        if(res.error)throw new Error('등록 실패: '+res.error.message);
        newId=res.data[0].id;
        var path='docs/'+newId+'/'+Date.now()+'.'+docExt(x.f.name);
        return sb.storage.from(DOC_BUCKET).upload(path,x.f,{upsert:false,contentType:x.f.type||'application/octet-stream'}).then(function(up){
          if(up.error)throw new Error('파일 업로드 실패: '+up.error.message);
          return sb.from('fac_documents').update({file_name:x.f.name,file_path:path,file_size:x.f.size,
            updated_at:new Date().toISOString()}).eq('id',newId);
        });
      }).then(function(){
        done++;if(st)st.innerHTML='<b style="color:var(--ok)">✓ 완료</b>';
        var row=document.getElementById('dnf_'+i);if(row)row.style.background='var(--okbg)';
        tick();
      }).catch(function(e){
        fail++;if(st)st.innerHTML='<b style="color:var(--dng)">'+docEsc(e.message||String(e))+'</b>';
        var row2=document.getElementById('dnf_'+i);if(row2)row2.style.background='var(--dngbg)';
        // 파일은 실패했지만 행이 만들어진 경우 → 빈 항목 정리
        if(newId)sb.from('fac_documents').delete().eq('id',newId);
        tick();
      });
    });
  });
  chain.then(function(){
    if(!fail){closeModal();loadDocs();return;}
    ok.disabled=false;ok.textContent='실패분 재시도';
    // 성공분은 목록에서 제거 → 버튼 다시 누르면 실패분만 재업로드
    DNEW_FILES=DNEW_FILES.filter(function(x,i){
      var st=document.getElementById('dnfs_'+i);
      return !(st&&st.textContent.indexOf('완료')>=0);
    });
    msg.innerHTML='<b style="color:var(--dng)">'+fail+'건 실패</b> · 성공 '+done+'건은 등록되었습니다. 실패한 항목만 남겨두었으니 <b>실패분 재시도</b>를 누르거나 창을 닫으세요.';
    loadDocs();
  });
}

// 폴더명 수정 — 해당 분류·폴더에 속한 자료 전체를 일괄 변경
function docFolderRenameOpen(cat,folder){

  var n=DOCS.filter(function(d){return d.cat===cat&&(d.folder||'')===folder;}).length;
  openModal('<div class="mh">폴더명 수정</div><div class="mb">'
    +'<div class="mrow"><span class="mk">분류</span><span class="mv">'+docEsc(cat)+'</span></div>'
    +'<div class="mrow"><span class="mk">현재 폴더명</span><span class="mv">'+docEsc(folder)+'</span></div>'

function docFolderRenameSave(cat,folder){
  var el=document.getElementById('dfr_name'); if(!el)return;
  var nv=(el.value||'').trim();
  var ok=document.getElementById('dfr_ok'), msg=document.getElementById('dfr_msg');
  if(!nv){msg.innerHTML='<b style="color:var(--dng)">새 폴더명을 입력해 주세요.</b>';return;}
  if(nv===folder){closeModal();return;}
  ok.disabled=true;ok.textContent='저장 중...';
  sb.from('fac_documents').update({folder:nv}).eq('category',cat).eq('folder',folder).then(function(res){
    if(res.error){ok.disabled=false;ok.textContent='수정';msg.innerHTML='<b style="color:var(--dng)">수정 실패: '+docEsc(res.error.message)+'</b>';return;}

    if(DOC_OPEN['f:'+cat+'|'+folder]){DOC_OPEN['f:'+cat+'|'+nv]=true;delete DOC_OPEN['f:'+cat+'|'+folder];}
    closeModal();loadDocs();
  });
}

function docDeleteGo(id){
  var d=docById(id);if(!d){closeModal();return;}
  var p=d.path?sb.storage.from(DOC_BUCKET).remove([d.path]):Promise.resolve({});
  p.then(function(){return sb.from('fac_documents').delete().eq('id',id);}).then(function(res){
    closeModal();
    if(res&&res.error)alert('삭제 실패: '+res.error.message);
    loadDocs();
  });
}

// ===== 타 학원 실명·연상 감지 (총무기획팀이 이 목록에 학원명을 추가·관리) =====
var LMS_ACADEMY=["시대인재","메가스터디","강남대성","대성마이맥","러셀","종로학원","이투스","두각","미래탐구","깊은생각","생각하는황소","황소","CMS","파인만","페르마","플라토","지트","수학의아침","청솔","청담어학원","청담러닝","아발론","폴리어학원","정상어학원","토피아","하이스트","에듀플렉스","조재필수학","이강학원"];

var LMS_MASK='[*＊xXｘ○●◯□ㅁㅇ]';
function lmsEscRe(c){return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
// 학원명 → 원문 + 글자별 마스킹 변형(1글자 마스킹, 4자 이상은 연속 2글자 마스킹 포함) 감지 정규식
function lmsAcadRe(name){
  var ch=name.split(''),alts=[ch.map(lmsEscRe).join('\\s?')];
  for(var i=0;i<ch.length;i++){alts.push(ch.map(function(c,j){return j===i?LMS_MASK:lmsEscRe(c);}).join('\\s?'));}
  if(ch.length>=4){for(var k=0;k<ch.length-1;k++){alts.push(ch.map(function(c,j){return (j===k||j===k+1)?LMS_MASK:lmsEscRe(c);}).join('\\s?'));}}
  return new RegExp('(?:'+alts.join('|')+')','gi');
}

function lmsSample(){

function runLms(){

    msg:"타 학원의 실명 또는 마스킹 표기가 감지되었습니다. 실명·마스킹 여부와 무관하게 특정 학원이 연상되면 공정위 신고(부당 비교·비방 광고) 대상이며, 명예훼손·업무방해에 따른 민사 손해배상 소송으로 이어질 수 있습니다. 발송을 중단하세요.",
    fix:"해당 학원명·연상 표현을 전부 삭제. 비교가 필요하면 「자사 재원생 성과」 등 자사 데이터만 사용",hits:Object.keys(acadHits)});

    while((m=r.re.exec(t))!==null){hits.push(m[0]);ranges.push([m.index,m.index+m[0].length,r.g]);if(m.index===r.re.lastIndex)r.re.lastIndex++;}
    if(hits.length)findings.push({g:r.g,cat:r.cat,law:r.law,msg:r.msg,fix:r.fix,hits:hits});

    if(!/(무료\s*수신\s*거부|수신\s*거부|080[\s\-]?\d{3,4}[\s\-]?\d{4})/.test(t))findings.unshift({g:"danger",cat:"필수 표기 — 무료수신거부 누락",law:"정보통신망법 제50조",msg:"광고 문자에는 수신거부 방법을 무료(080 번호 등)로 안내해야 합니다.",fix:"말미에 「무료수신거부 080-○○○-○○○○」 추가",hits:[]});

    if(/\d[\d,]*\s*원|수강료|교습비|특강비/.test(t))findings.push({g:"warn",cat:"교습비 표시 검증 필요",law:"학원법 제15조 제3항·경기도 조례 시행규칙 제8조의2",msg:"광고에 금액을 표시할 경우 교육지원청에 등록된 교습비와 일치해야 하며, 교습비와 기타경비(모의고사비·재료비·차량비 등)를 구분해 표시해야 합니다. 등록 금액 초과 표시·수납은 행정처분 대상입니다.",fix:"등록 교습비 원장 대조 후 발송, 기타경비는 별도 항목으로 구분 표기",hits:[]});
    var tm=document.getElementById('lms_time').value;
    if(tm){var h=parseInt(tm.split(':')[0],10);if(h>=21||h<8)findings.unshift({g:"danger",cat:"야간 발송 시간",law:"정보통신망법 제50조 제3항",msg:"21시~익일 8시 광고 전송은 수신자의 별도 사전 동의가 필요합니다. 야간 발송은 민원 발생률이 가장 높습니다.",fix:"발송 시각을 08:00~20:59로 조정하거나 야간수신 동의자만 발송",hits:[]});}

  }

      +'<div style="font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:6px">'+f.msg+'</div>'
      +'<div style="font-size:12.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 11px"><b>수정 제안</b> · '+f.fix+'</div></div>';
  });

  out.innerHTML=h;out.scrollIntoView({behavior:'smooth',block:'nearest'});
}

  var body=rows.filter(function(r){return r[1]!==undefined&&r[1]!==null&&r[1]!=='';}).map(function(r){return '<div class="mrow"><span class="mk">'+r[0]+'</span><span class="mv">'+esc(r[1])+'</span></div>';}).join('');
  window.__yes=onYes;
  openModal('<div class="mh">'+title+'</div><div class="mb">'+body+'<div class="mq">위 건으로 접수하시겠습니까?</div></div><div class="mf"><button class="mbtn no" onclick="closeModal()">아니오</button><button class="mbtn yes" onclick="confirmYes()">예</button></div>');
}
// 중복 접수 방지 — '예'를 누르면 즉시 '접수 중' 상태로 전환하고, 저장이 끝날 때까지 재클릭을 차단
var __submitting=false;
function showSubmitting(msg){
  openModal('<div class="mb" style="text-align:center;padding:36px 22px 28px">'
    +'<div style="width:34px;height:34px;margin:0 auto 14px;border:3px solid var(--line2,#e6e6ea);border-top-color:var(--blue,#2f6fed);border-radius:50%;animation:facspin .8s linear infinite"></div>'
    +'<div style="font-size:14px;font-weight:700">'+(msg||'접수 중입니다...')+'</div>'
    +'<div class="hint" style="font-size:12px;margin-top:6px;line-height:1.5">잠시만 기다려 주세요.<br>창을 닫거나 버튼을 다시 누르지 마세요.</div>'
    +'</div>');
}
function confirmYes(){
  if(__submitting)return;                 // 이미 처리 중이면 무시 → 중복 insert 차단
  __submitting=true;
  var fn=window.__yes; window.__yes=null;  // 콜백 1회만 실행되도록 즉시 비움
  showSubmitting();                        // '예' 버튼 사라지고 로딩 표시
  try{ if(fn)fn(); }catch(e){ __submitting=false; submitDone('처리 중 오류가 발생했습니다. 다시 시도해 주세요.'); }
}
function submitDone(msg){
  __submitting=false;   // 처리 종료 → 다음 접수 허용
  var isErr=/오류|실패|연결되어 있지 않|선택해 주세요|입력해 주세요/.test(msg);
  var ic=isErr
    ? '<div class="done-ic" style="background:var(--dngbg);border-color:var(--dngln);color:var(--dng)">!</div><div style="font-size:14px;font-weight:600;margin-bottom:5px">처리하지 못했습니다</div>'
    : '<div class="done-ic">✓</div><div style="font-size:14px;font-weight:600;margin-bottom:5px">접수되었습니다</div>';
  openModal('<div class="mb" style="text-align:center;padding-top:22px">'+ic+'<div class="hint" style="font-size:12.5px;line-height:1.5">'+msg+'</div></div><div class="mf"><button class="mbtn yes" onclick="closeModal()">확인</button></div>');
}

function arrOrNull(v){return (Array.isArray(v)&&v.length)?v:null;}
function saveRequest(type, extra, okMsg){
  if(!SB_READY){submitDone('저장 서버에 연결되어 있지 않습니다. 잠시 후 다시 시도해 주세요.');return;}
  var row=Object.assign({
    type:type,
    biz:arrOrNull(STATE.biz), brand:arrOrNull(STATE.brand),
    campus:STATE.campus||'', building:STATE.building||null,
    floors:arrOrNull(STATE.floor),
    applicant:'', apply_date:null, status:'wait',
    applicant_login:(CURRENT_USER&&CURRENT_USER.login_id)||null
  }, extra);
  if(!row.campus){submitDone('캠퍼스(지역)를 선택해 주세요.');return;}
  if(!row.applicant){submitDone('신청자 이름을 입력해 주세요.');return;}
  sb.from('fac_requests').insert(row).select('id,record_no').then(function(res){
    if(res.error){submitDone('저장 중 오류가 발생했습니다: '+res.error.message);return;}
    var rec=(res.data&&res.data[0])||{};var no=rec.record_no||'';
    if(type==='fix'&&FIX_PHOTOS.length){
      var n=FIX_PHOTOS.length;
      fixPhotoUpload(rec.id).then(function(ok){
        FIX_PHOTOS=[];fixPhotoRender();
        var pmsg=(ok&&ok.length)?('<br><span class="hint">사진 '+ok.length+'장이 함께 접수되었습니다.</span>')
                                :('<br><span style="color:var(--warn)">사진 '+n+'장 업로드에 실패했습니다. 접수는 정상 저장되었습니다.</span>');
        fireReceipt(type,rec.id,okMsg+(no?('<br><br>접수번호: <b>'+no+'</b>'):'')+pmsg,no);
      });
      return;
    }
    fireReceipt(type,rec.id,okMsg+(no?('<br><br>접수번호: <b>'+no+'</b>'):''),no);
  });
}
// 접수 완료 알림(접수자+총무팀) 발송 후 완료 모달
function fireReceipt(kind,id,baseMsg,no){
  var email=(CURRENT_USER&&CURRENT_USER.email)||null;
  var sm=collectSummary(kind,no);
  n8nNotify({type:'received',kind:kind,id:id,record_no:no||'',applicant_email:email,
    applicant_name:(CURRENT_USER&&CURRENT_USER.name)||'',summary:sm}).then(function(r){
    var note;
    if(r&&r.ok)note='<b style="color:var(--ok)">접수 완료 알림을 발송했습니다.</b> (접수자·총무기획팀)';
    else if(r&&r.error==='n8n_url_not_set')note='<span style="color:var(--warn)">알림 채널(n8n) 연결 전이라 메일은 발송되지 않았습니다. 접수는 정상 저장되었습니다.</span>';
    else note='<span style="color:var(--dng)">접수 알림 발송 실패 — 접수는 정상 저장되었습니다.</span>';
    submitDone(baseMsg+'<br><br>'+note);
  });
}
// 접수 요약: 메일 본문에 넣을 핵심 필드 수집
// 접수 유형 라벨 (진행 알림의 typelabel 과 동일 규격)
var RECV_TYPE_LABEL={fix:'유지보수', buy:'구매', rent:'렌탈', pen:'볼펜', voice:'건의', card:'명함'};
function collectSummary(kind, no){
  var s={};
  // ── 기존 필드 (n8n '접수 메일 구성'이 사용 중 — 절대 제거 금지)
  s.campus=STATE.campus||'';
  s.building=STATE.building||'';
  s.floors=(Array.isArray(STATE.floor)?STATE.floor.join(', '):STATE.floor)||'';
  s.reqtype=STATE.reqtype||'';
  if(kind==='fix'){s.detail=fieldVal('detail')||'';s.location=fieldVal('loc')||'';s.applicant=fieldVal('applicant')||'';s.phone=fieldVal('phone')||'';}
  else if(kind==='pen'){s.qty=STATE.penqty?(STATE.penqty+'봉지'):'';s.visit=fieldVal('pvisit')||'';s.applicant=fieldVal('papplicant')||'';}
  else if(kind==='voice'){s.vtype=VOICE_TYPE;s.title=fieldVal('vtitle')||'';s.content=fieldVal('vcontent')||'';s.applicant=fieldVal('vapplicant')||'';}
  else if(kind==='card'){s.applicant=fieldVal('capplicant')||'현장';s.target=fieldVal('ctarget')||'';s.empno=fieldVal('cempno')||'';s.title='명함 대상: '+s.target+(s.empno?(' (사번 '+s.empno+')'):'');s.detail='대상자 '+s.target+' · 사번 '+s.empno;}
  else {s.applicant=fieldVal('applicant')||'현장';}

  // ── 추가 필드 (진행 알림 progressSummary 와 동일한 이름 규격)
  s.record_no = no||'';                                   // DB가 발급한 접수번호
  s.typelabel = RECV_TYPE_LABEL[kind]||kind||'';
  s.subtype   = (kind==='voice') ? (VOICE_TYPE||'') : (STATE.reqtype||'');
  s.status    = '접수 대기';
  s.received  = new Date().toISOString().slice(0,10);
  s.applicant_login = (CURRENT_USER&&CURRENT_USER.login_id)||'';
  s.updated_by = staffLabel();
  s.updated_at = new Date().toISOString().slice(0,16).replace('T',' ');
  s.portal_url = location.origin+location.pathname;
  if(!s.title) s.title = [s.campus, s.building].filter(Boolean).join(' ') + (s.subtype?(' · '+s.subtype):'');
  if(!s.detail) s.detail = (kind==='voice') ? (s.content||'') : (s.qty||s.reqtype||'');
  // Slack Workflow Builder 는 undefined 를 무음 실패시킴 → 전 필드 문자열 보장
  Object.keys(s).forEach(function(k){ if(typeof s[k]!=='string')s[k]=String(s[k]==null?'':s[k]); });
  var head=[s.campus,s.building].filter(Boolean).join(' ');
  s.headline=(s.typelabel+' · '+(head||'-')+' · '+(s.title||s.detail.slice(0,30)||'-')).slice(0,140);
  s.changed='신규 접수 · 신청자 '+(s.applicant||'-');
  return s;
}

var FIX_PHOTOS=[];               // 선택된 사진 목록
var FIX_MAX=3;
function fixPhotoPick(el){
  var fs=[].slice.call(el.files||[]);
  el.value='';                   // 같은 파일 재선택 가능하게
  fs.forEach(function(f){
    if(FIX_PHOTOS.length>=FIX_MAX){return;}
    if(!/^image\//.test(f.type||'')){return;}
    FIX_PHOTOS.push(f);
  });
  if(fs.length && FIX_PHOTOS.length>=FIX_MAX) alert('사진은 최대 '+FIX_MAX+'장까지 첨부할 수 있습니다.');
  fixPhotoRender();
}
function fixPhotoDel(i){FIX_PHOTOS.splice(i,1);fixPhotoRender();}
function fixPhotoRender(){
  var box=document.getElementById('fixPhotoList'); if(!box)return;
  box.innerHTML='';
  FIX_PHOTOS.forEach(function(f,i){
    var d=document.createElement('div');
    d.style.cssText='position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line)';
    var img=document.createElement('img');
    img.style.cssText='width:100%;height:100%;object-fit:cover';
    img.src=URL.createObjectURL(f);
    var b=document.createElement('button');
    b.type='button'; b.textContent='×';
    b.style.cssText='position:absolute;top:2px;right:2px;width:20px;height:20px;line-height:18px;padding:0;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer';
    b.onclick=function(){fixPhotoDel(i);};
    d.appendChild(img); d.appendChild(b); box.appendChild(d);
  });
}
// 휴대폰 사진은 용량이 커서 긴 변 1600px로 축소 후 업로드
function fixPhotoShrink(file){
  return new Promise(function(resolve){
    try{
      var img=new Image();
      img.onload=function(){
        var max=1600, w=img.width, h=img.height;
        if(w<=max&&h<=max){resolve(file);return;}
        if(w>h){h=Math.round(h*max/w);w=max;} else {w=Math.round(w*max/h);h=max;}
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(function(b){resolve(b||file);},'image/jpeg',0.82);
      };
      img.onerror=function(){resolve(file);};
      img.src=URL.createObjectURL(file);
    }catch(e){resolve(file);}
  });
}
// 접수 저장 후 사진 업로드 → fac_requests.photos 에 경로 기록
function fixPhotoUpload(reqId){
  if(!FIX_PHOTOS.length||!reqId)return Promise.resolve([]);
  var y=new Date().getFullYear();
  var jobs=FIX_PHOTOS.map(function(f,i){
    return fixPhotoShrink(f).then(function(blob){
      var ext=((f.name||'').split('.').pop()||'jpg').toLowerCase();
      if(ext.length>5)ext='jpg';
      var path='fix/'+y+'/'+reqId+'_'+(i+1)+'_'+Date.now()+'.'+ext;
      return sb.storage.from(DOC_BUCKET).upload(path,blob,{upsert:false,contentType:blob.type||'image/jpeg'})
        .then(function(up){return up&&up.error?null:path;});
    }).catch(function(){return null;});
  });
  return Promise.all(jobs).then(function(paths){
    var ok=paths.filter(Boolean);
    if(!ok.length)return [];
    return sb.from('fac_requests').update({photos:ok}).eq('id',reqId).then(function(){return ok;});
  });
}

var PENDING_CACHE=[];
function approveAcct(loginId){
  var pw=(document.querySelector('input[data-ap="pw"][data-id="'+loginId+'"]').value||'').trim();
  if(pw.length<6){alert('비밀번호를 6자 이상 입력하세요.');return;}
  if(!SB_READY)return;
  var btnMsg='승인 처리 중...';
  sb.functions.invoke('approve-account',{body:{login_id:loginId,password:pw,approved_by:(CURRENT_USER&&CURRENT_USER.login_id)||'admin'}}).then(function(res){
    if(res.error){alert('오류: '+(res.error.message||res.error));return;}
    var d=res.data;
    if(d&&d.ok){
      var acct=(PENDING_CACHE||[]).filter(function(x){return x.login_id===loginId;})[0]||{};
      // 첫 로그인 시 비밀번호 변경 강제 (모두 같은 최초 비번을 쓰므로 보안상 필수)
      sb.from('fac_accounts').update({must_reset:true}).eq('login_id',loginId).then(function(){}).catch(function(){});
      var base=loginId+' 계정이 승인되었습니다.<br><br>현장에 전달할 정보:<br>아이디 <b>'+loginId+'</b> / 최초 비번 <b>'+pw+'</b><br><span class="hint">첫 로그인 시 본인이 새 비밀번호를 설정하게 됩니다.</span>';
      loadPending();
      if(acct.email){
        submitDone(base+'<br><br><span class="hint">안내메일 발송 중...</span>');
        signupApprovedNotify(loginId,pw,acct).then(function(rr){
          var note=(rr&&rr.ok)
            ? '<br><br><b style="color:var(--ok)">가입완료 안내메일을 '+esc(acct.email)+' 로 발송했습니다.</b>'
            : '<br><br><span style="color:var(--warn)">안내메일 발송에 실패했습니다. 아이디·최초 비번을 직접 전달해 주세요.</span>';
          submitDone(base+note);
        });
      } else {
        submitDone(base+'<br><br><span style="color:var(--warn)">가입 시 이메일이 없어 안내메일은 발송되지 않았습니다. 아이디·비번을 직접 전달해 주세요.</span>');
      }
    }
    else{alert((d&&d.error)||'승인 실패');}
  });
}
// 가입 완료 안내메일 — 신청 이메일로 아이디·최초 비번 발송 (n8n type: signup_approved)
function signupApprovedNotify(loginId, pw, acct){
  var s={
    login_id: String(loginId||''),
    name: String((acct&&acct.name)||''),
    region: String((acct&&acct.region)||''),
    gwan_code: String((acct&&acct.gwan_code)||''),
    email: String((acct&&acct.email)||''),
    password: String(pw||''),
    approved_at: new Date().toISOString().slice(0,16).replace('T',' '),
    portal_url: 'https://seulgi00lee-eng.github.io/facility-portal/'
  };
  s.headline='가입이 완료되었습니다 · '+(s.name||s.login_id);
  return n8nNotify({type:'signup_approved', kind:'signup_approved', login_id:s.login_id, applicant_email:s.email, applicant_name:s.name, summary:s})

// 담당자 계정이 아직 없는 운영 관 (배포 초기 미가입 포함)
function unassignedCampuses(){
  var owned={};
  (ACCOUNTS_CACHE||[]).forEach(function(a){
    String(a.gwan_code||'').split(',').forEach(function(c){c=c.trim();if(c)owned[c]=1;});
  });
  (GRANTS_CACHE||[]).forEach(function(g){owned[g.campus_code]=1;});
  return ORG_CAMPUS.filter(function(c){return !owned[c.campus_code]&&c.campus_code!=='100';});
}

  if(unas.length)warn+='<div class="hint" style="margin-bottom:10px;padding:9px 12px;border:1px solid var(--line);background:var(--soft,#f7f8fa);border-radius:9px">담당자 계정이 없는 관 <b>'+unas.length+'곳</b> — 아직 가입하지 않았을 수 있습니다. 마감 전까지 가입되지 않으면 아래 <b>겸임 관코드</b>로 다른 담당자에게 부여하세요. <span style="color:var(--mute)">'+unas.slice(0,12).map(function(c){return docEsc(c.campus_code);}).join(', ')+(unas.length>12?' 외 '+(unas.length-12)+'곳':'')+'</span></div>';
  var GT='1.1fr 0.62fr 0.45fr 1.35fr 1.1fr 0.62fr 0.55fr 1.45fr';

  var body=rows.map(function(a){
    var role=a.role==='admin'?' <span style="font-size:10px;color:var(--blue);border:1px solid var(--blue);border-radius:4px;padding:0 4px">관리자</span>':'';
    var id=a.login_id;

      +'<input type="email" data-em-id="'+id+'" value="'+(a.email||'')+'" placeholder="이메일 미입력 — 등록" style="flex:1;padding:6px 9px;font-size:12px;border:1px solid '+(a.email?'var(--line)':'var(--warnln)')+';border-radius:8px;background:'+(a.email?'#fff':'var(--warnbg)')+'">'
      +'<button class="flt" data-em-save="'+id+'" style="padding:6px 11px;white-space:nowrap">'+(a.email?'수정':'등록')+'</button></div>';
    return '<div style="display:grid;grid-template-columns:'+GT+';gap:10px;padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line);align-items:center">'
      +'<div style="font-weight:600">'+a.login_id+role+'</div>'
      +'<div>'+(a.name||'')+'</div>'
      +'<div>'+(a.region||'')+'</div>'
      +emCell
      +orgCell(a)
      +'<div style="color:var(--mute)">'+((a.approved_at||'').slice(0,10))+'</div>'
      +'<div><button class="flt" style="padding:6px 10px;white-space:nowrap" onclick="pwResetOpen(\''+String(id).replace(/'/g,"\\'")+'\')">초기화</button></div>'
      +acctMgmtCell(a)
      +'</div>';
  }).join('');
  box.innerHTML=warn+'<div class="acctable" style="border:1px solid var(--line);border-radius:12px;overflow:hidden">'+head+body+'</div>'
    +'<details class="acc-deleted" style="margin-top:12px" ontoggle="if(this.open)loadDeletedAccounts()"><summary class="hint" style="cursor:pointer">삭제된 계정 보기 · 복구</summary><div id="deleted_list" style="margin-top:8px"><div class="hint" style="padding:10px">불러오는 중...</div></div></details>';

  box.querySelectorAll('[data-em-save]').forEach(function(btn){btn.addEventListener('click',function(){saveEmail(btn.dataset.emSave);});});
  box.querySelectorAll('[data-em-id]').forEach(function(inp){inp.addEventListener('keydown',function(e){if(e.key==='Enter')saveEmail(inp.dataset.emId);});});
  box.querySelectorAll('[data-hqteam]').forEach(function(sel){sel.addEventListener('change',function(){saveHqTeam(sel.dataset.hqteam,sel.value);});});
  box.querySelectorAll('[data-grant-add]').forEach(function(btn){btn.addEventListener('click',function(){grantAddOpen(btn.dataset.grantAdd);});});
  box.querySelectorAll('[data-grant-del]').forEach(function(btn){btn.addEventListener('click',function(){grantDel(btn.dataset.grantUid,btn.dataset.grantDel);});});
}

// ===== 계정 관리: 관리자 권한 부여·해제 / 계정 삭제(로그인 차단) =====
function acctFind(id){return (ACCOUNTS_CACHE||[]).filter(function(a){return a.login_id===id;})[0];}
function acctMgmtCell(a){
  var me=CURRENT_USER&&CURRENT_USER.login_id===a.login_id,adm=a.role==='admin';
  var idq=docEsc(a.login_id);
  return '<div style="display:flex;gap:5px;flex-wrap:nowrap">'
    +(me?'<span class="hint" style="font-size:11px">본인</span>'
      :'<button class="flt" data-acc-role="'+idq+'" style="padding:6px 8px;font-size:12px;white-space:nowrap'+(adm?';color:var(--warn);border-color:var(--warnln)':'')+'">'+(adm?'관리자 해제':'관리자 지정')+'</button>'
       +'<button class="flt" data-acc-del="'+idq+'" style="padding:6px 8px;font-size:12px;white-space:nowrap;color:var(--dng);border-color:var(--dngln)"'+(adm?' disabled title="관리자는 먼저 관리자 해제 후 삭제할 수 있습니다" ':'')+'>삭제</button>')
    +'</div>';
}
// 일반 계정의 권한 값 (기존 계정에서 가장 많이 쓰는 값을 따름)
function acctNormalRole(){
  var cnt={};(ACCOUNTS_CACHE||[]).forEach(function(a){if(a.role&&a.role!=='admin')cnt[a.role]=(cnt[a.role]||0)+1;});
  var best=null;Object.keys(cnt).forEach(function(k){if(!best||cnt[k]>cnt[best])best=k;});
  return best||'user';
}
function acctToggleAdmin(id){
  if(!(CURRENT_USER&&CURRENT_USER.role==='admin')){alert('총무기획팀 관리자만 변경할 수 있습니다.');return;}
  var a=acctFind(id);if(!a)return;
  if(a.login_id===CURRENT_USER.login_id){alert('본인의 관리자 권한은 해제할 수 없습니다.');return;}
  var toAdmin=a.role!=='admin';
  if(!toAdmin&&(ACCOUNTS_CACHE||[]).filter(function(x){return x.role==='admin';}).length<=1){alert('관리자가 최소 1명은 있어야 합니다.');return;}
  var msg=toAdmin
    ?'['+a.login_id+' · '+(a.name||'')+'] 계정에 관리자 권한을 부여할까요?\n\n· 총무기획팀 탭(업무 대시보드·접수 처리·자료실·계정 관리·정기점검)에 접근할 수 있게 됩니다.\n· 다른 계정의 권한 변경·삭제도 할 수 있습니다.\n· 본인이 다음에 로그인할 때부터 적용됩니다.'
    :'['+a.login_id+' · '+(a.name||'')+'] 계정의 관리자 권한을 해제할까요?\n\n· 총무기획팀 탭이 사라지고 일반 계정으로 바뀝니다.';
  if(!confirm(msg))return;
  var nr=toAdmin?'admin':acctNormalRole();
  sb.from('fac_accounts').update({role:nr}).eq('login_id',id).select().then(function(r){
    if(r.error){submitDone('권한 변경 실패: '+r.error.message);return;}
    if(!r.data||!r.data.length){submitDone('권한 변경 실패: 변경된 계정이 없습니다. (DB 권한 설정 확인 필요)');return;}
    a.role=nr;renderAccounts(ACCOUNTS_CACHE);
    accToast(toAdmin?(a.login_id+' — 관리자 지정됨'):(a.login_id+' — 관리자 해제됨'));
  });
}
function acctDelete(id){
  if(!(CURRENT_USER&&CURRENT_USER.role==='admin')){alert('총무기획팀 관리자만 삭제할 수 있습니다.');return;}
  var a=acctFind(id);if(!a)return;
  if(a.login_id===CURRENT_USER.login_id){alert('본인 계정은 삭제할 수 없습니다.');return;}
  if(a.role==='admin'){alert('관리자 계정입니다. 먼저 [관리자 해제] 후 삭제하세요.');return;}
  if(!confirm('['+a.login_id+' · '+(a.name||'')+'] 계정을 삭제할까요?\n\n· 즉시 로그인할 수 없게 됩니다.\n· 이 계정에 부여된 겸임 관코드도 해제됩니다.\n· 기존 접수 내역은 그대로 남습니다.\n· 아래 [삭제된 계정 보기]에서 복구할 수 있습니다.'))return;
  var upd=function(st){return sb.from('fac_accounts').update({status:st}).eq('login_id',id).select();};
  upd('deleted').then(function(r){
    // DB에 상태값 제약이 있으면 기존 값(rejected)으로 대신 차단
    if(r.error&&/check|constraint|invalid input/i.test(r.error.message||''))return upd('rejected');
    return r;
  }).then(function(r){
    if(r.error){submitDone('삭제 실패: '+r.error.message);return;}
    if(!r.data||!r.data.length){submitDone('삭제 실패: 변경된 계정이 없습니다. (DB 권한 설정 확인 필요)');return;}
    if(a.auth_uid)sb.from('fac_gift_campus_grants').delete().eq('user_id',a.auth_uid).then(function(){},function(){});
    GRANTS_CACHE=(GRANTS_CACHE||[]).filter(function(g){return g.user_id!==a.auth_uid;});
    ACCOUNTS_CACHE=(ACCOUNTS_CACHE||[]).filter(function(x){return x.login_id!==id;});
    renderAccounts(ACCOUNTS_CACHE);
    accToast(id+' — 삭제됨 (로그인 차단)');
  });
}
function loadDeletedAccounts(){
  var box=document.getElementById('deleted_list');if(!box)return;
  sb.from('fac_accounts').select('*').eq('status','deleted').order('approved_at',{ascending:false}).then(function(r){
    var rows=(r&&r.data)||[];
    if(!rows.length){box.innerHTML='<div class="hint" style="padding:10px;border:1px dashed var(--line);border-radius:10px;text-align:center">삭제된 계정이 없습니다.</div>';return;}
    box.innerHTML=rows.map(function(a){
      return '<div style="display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff;font-size:12.5px">'
        +'<div style="flex:1;min-width:0"><b>'+docEsc(a.login_id)+'</b> <span class="hint">'+docEsc(a.name||'')+' · '+docEsc(a.region||'')+'</span></div>'
        +'<button class="flt" data-acc-restore="'+docEsc(a.login_id)+'" style="padding:6px 10px">복구</button></div>';
    }).join('');
    box.querySelectorAll('[data-acc-restore]').forEach(function(b){b.addEventListener('click',function(){acctRestore(b.dataset.accRestore);});});
  });
}
function acctRestore(id){
  if(!confirm('['+id+'] 계정을 복구할까요? 바로 로그인할 수 있게 됩니다. (겸임 관코드는 다시 부여해야 합니다)'))return;
  sb.from('fac_accounts').update({status:'active'}).eq('login_id',id).select().then(function(r){
    if(r.error||!r.data||!r.data.length){submitDone('복구 실패: '+((r.error&&r.error.message)||'변경된 계정이 없습니다.'));return;}
    accToast(id+' — 복구됨');loadAccounts();
  });
}
function accToast(msg){
  var t=document.getElementById('acc_toast');
  if(!t){t=document.createElement('div');t.id='acc_toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;padding:8px 14px;border-radius:20px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='.92';clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity='0';},1800);
}
// 본사 계정 판별 : 지역='본사' 또는 관코드 100
function isHqAcc(a){
  return (a.region==='본사')||String(a.gwan_code||'').split(',').map(function(s){return s.trim();}).indexOf('100')>=0;
}
// 소속팀 · 겸임 관코드 셀
function orgCell(a){
  var id=String(a.login_id).replace(/'/g,"\\'");
  if(isHqAcc(a)){
    var cur=(a.hq_team||'').trim();
    var opts='<option value="">— 소속팀 선택 —</option>'+HQ_TEAMS.map(function(t){
      return '<option value="'+docEsc(t)+'"'+(t===cur?' selected':'')+'>'+docEsc(t)+'</option>';
    }).join('');
    return '<div><select data-hqteam="'+docEsc(a.login_id)+'" style="width:100%;padding:6px 8px;font-size:12px;border:1px solid '+(cur?'var(--line)':'var(--warnln)')+';border-radius:8px;background:'+(cur?'#fff':'var(--warnbg)')+'">'+opts+'</select></div>';
  }
  var gs=grantsOf(a.auth_uid);

    return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:2px 5px 2px 7px;border:1px solid var(--blue);color:var(--blue);border-radius:6px">'+docEsc(c)
      +'<button data-grant-del="'+docEsc(c)+'" data-grant-uid="'+docEsc(a.auth_uid||'')+'" title="해제" style="border:0;background:none;cursor:pointer;color:var(--blue);font-size:13px;line-height:1;padding:0 1px">&times;</button></span>';

}
// 본사 소속팀 저장
function saveHqTeam(loginId,team){
  var sel=document.querySelector('[data-hqteam="'+loginId+'"]');
  if(!SB_READY){submitDone('서버에 연결되어 있지 않습니다.');return;}
  if(sel)sel.disabled=true;
  sb.from('fac_accounts').update({hq_team:team||null}).eq('login_id',loginId).then(function(res){
    if(sel)sel.disabled=false;
    if(res.error){submitDone('저장 오류: '+res.error.message);return;}
    var hit=(ACCOUNTS_CACHE||[]).filter(function(x){return x.login_id===loginId;})[0];if(hit)hit.hq_team=team||null;
    if(sel){sel.style.borderColor=team?'var(--okln)':'var(--warnln)';sel.style.background=team?'var(--okbg)':'var(--warnbg)';}
  });
}
// 겸임 관코드 부여 (총무기획팀 전용)
function grantAddOpen(loginId){
  if(!(CURRENT_USER&&CURRENT_USER.role==='admin')){alert('총무기획팀 계정만 부여할 수 있습니다.');return;}
  var a=(ACCOUNTS_CACHE||[]).filter(function(x){return x.login_id===loginId;})[0];
  if(!a||!a.auth_uid){submitDone('해당 계정의 인증 정보가 없어 부여할 수 없습니다.');return;}
  var own=String(a.gwan_code||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  var has=grantsOf(a.auth_uid);
  var unas={};unassignedCampuses().forEach(function(c){unas[c.campus_code]=1;});
  var pool=ORG_CAMPUS.filter(function(c){return own.indexOf(c.campus_code)<0&&has.indexOf(c.campus_code)<0;});
  pool.sort(function(x,y){
    var a1=unas[x.campus_code]?0:1,b1=unas[y.campus_code]?0:1;
    if(a1!==b1)return a1-b1;
    return x.campus_code<y.campus_code?-1:1;
  });
  var opts=pool.map(function(c){
    return '<option value="'+docEsc(c.campus_code)+'">'+docEsc(c.campus_code)+' · '+docEsc(c.campus_label||'')+(unas[c.campus_code]?'  ★ 담당자 없음':'')+'</option>';
  }).join('');
  openModal('<div class="mh">겸임 관코드 부여</div><div class="mb">'
    +'<div class="mrow"><span class="mk">아이디</span><span class="mv">'+docEsc(loginId)+'</span></div>'
    +'<div class="mrow"><span class="mk">이름</span><span class="mv">'+docEsc(a.name||'-')+'</span></div>'
    +'<div class="mrow"><span class="mk">본래 관</span><span class="mv">'+docEsc(own.join(', ')||'-')+'</span></div>'
    +'<div class="lbl" style="margin-top:12px">부여할 관코드</div>'
    +'<select id="gr_code" style="width:100%">'+opts+'</select>'
    +'<div class="lbl" style="margin-top:10px">메모 (선택)</div>'
    +'<input type="text" id="gr_memo" placeholder="예) 수지 겸임" style="width:100%">'
    +'<div class="hint" id="gr_msg" style="margin-top:9px;line-height:1.55">부여하면 해당 관의 <b>명절선물 명단을 조회·입력·수정</b>할 수 있습니다. <b>★ 담당자 없음</b> 표시는 아직 계정이 가입되지 않은 관입니다.</div>'
    +'</div><div class="mf"><button class="mbtn no" onclick="closeModal()">취소</button><button class="mbtn yes" id="gr_ok" onclick="grantAddGo(\''+id2js(loginId)+'\')">부여</button></div>');
}
function id2js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function grantAddGo(loginId){
  var a=(ACCOUNTS_CACHE||[]).filter(function(x){return x.login_id===loginId;})[0];
  var sel=document.getElementById('gr_code'), memo=document.getElementById('gr_memo');
  var ok=document.getElementById('gr_ok'), msg=document.getElementById('gr_msg');
  if(!a||!sel||!sel.value){if(msg)msg.innerHTML='<b style="color:var(--dng)">부여할 관코드를 선택하세요.</b>';return;}
  ok.disabled=true;ok.textContent='처리 중...';
  sb.from('fac_gift_campus_grants').insert({user_id:a.auth_uid,campus_code:sel.value,memo:(memo&&memo.value||'').trim()||null}).then(function(res){
    if(res.error){ok.disabled=false;ok.textContent='부여';msg.innerHTML='<b style="color:var(--dng)">부여 실패: '+docEsc(res.error.message)+'</b>';return;}
    GRANTS_CACHE.push({user_id:a.auth_uid,campus_code:sel.value,memo:null});
    closeModal();renderAccounts(ACCOUNTS_CACHE);
  });
}
function grantDel(uid,code){
  if(!(CURRENT_USER&&CURRENT_USER.role==='admin')){alert('총무기획팀 계정만 해제할 수 있습니다.');return;}
  if(!confirm(code+' 관 겸임 권한을 해제할까요?\n해당 관의 명절선물 명단에 접근할 수 없게 됩니다.'))return;
  sb.from('fac_gift_campus_grants').delete().eq('user_id',uid).eq('campus_code',code).then(function(res){
    if(res.error){submitDone('해제 실패: '+res.error.message);return;}
    GRANTS_CACHE=GRANTS_CACHE.filter(function(g){return !(g.user_id===uid&&g.campus_code===code);});
    renderAccounts(ACCOUNTS_CACHE);
  });
}
function saveEmail(loginId){
  var inp=document.querySelector('[data-em-id="'+loginId+'"]');if(!inp)return;
  var email=(inp.value||'').trim();
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){inp.style.borderColor='var(--dng)';inp.focus();return;}
  if(!SB_READY){submitDone('서버에 연결되어 있지 않습니다.');return;}
  var btn=document.querySelector('[data-em-save="'+loginId+'"]');if(btn){btn.textContent='저장중';btn.disabled=true;}
  sb.from('fac_accounts').update({email:email||null}).eq('login_id',loginId).then(function(res){
    if(res.error){if(btn){btn.textContent='재시도';btn.disabled=false;}submitDone('저장 오류: '+res.error.message);return;}
    var hit=ACCOUNTS_CACHE.filter(function(x){return x.login_id===loginId;})[0];if(hit)hit.email=email||null;

function pwGen(){
  var s='abcdefghjkmnpqrstuvwxyz', n='23456789', A='ABCDEFGHJKMNPQRSTUVWXYZ';
  var pool=s+n+A, out='';
  out+=A[Math.floor(Math.random()*A.length)];
  out+=n[Math.floor(Math.random()*n.length)];
  for(var i=0;i<6;i++)out+=pool[Math.floor(Math.random()*pool.length)];
  return out;
}
function pwGenFill(){var el=document.getElementById('pwr_new');if(el){el.value=pwGen();el.focus();el.select();}}
function pwResetOpen(loginId){

    +(self?'<div class="hint" style="margin-top:9px;color:var(--dng)"><b>본인 계정입니다.</b> 초기화하면 다음 로그인부터 임시 비밀번호를 써야 합니다.</div>':'')
    +'<div class="lbl" style="margin-top:12px">임시 비밀번호</div>'

function dashRoot(){return document.getElementById('dash_root');}

function dashAddDays(d,n){var x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);}
function dashWeek(){var t=inspToday(),w=new Date(t+'T00:00:00').getDay();return [dashAddDays(t,-w),dashAddDays(t,6-w)];}

function dashReqItem(r){

    quote:t.quote_amount,final:t.final_amount,assignee:t.assignee||'',stage:t.stage,col:t.stage||'신규 접수',
    log:Array.isArray(t.log)?t.log:[],raw:t};
}
function dashAll(){return DASH.reqs.map(dashReqItem).concat(DASH.tasks.map(dashTaskItem));}
function dashDate(it){return it.visit_date||it.plan_date||'';}
function dashOpen(it){return it.col!=='완료'&&it.col!=='보류';}
// 지연: 방문 예정인데 방문일이 지났거나, 처리예정일이 지났는데 끝나지 않은 건
function dashLate(it){
  if(!dashOpen(it))return false;var t=inspToday();

  today:{t:'오늘 방문',f:function(it){var t=inspToday();return dashOpen(it)&&dashVisits(it).indexOf(t)>=0;}},
  week:{t:'이번 주 방문',f:function(it){var w=dashWeek();return dashOpen(it)&&dashVisits(it).some(function(d){return d>=w[0]&&d<=w[1];});}},
  'new':{t:'신규 접수',f:function(it){return it.col==='신규 접수';}},
  quote:{t:'견적 진행',f:function(it){return it.col==='견적';}},
  doing:{t:'진행중',f:function(it){return it.col==='진행중';}},

};
function dashFiltered(){
  var q=DASH.q.toLowerCase().split(/\s+/).filter(Boolean);

    if(DASH.src!=='all'&&it.src!==DASH.src)return false;
    if(DASH.who!=='all'&&!dashWhoHit(it.assignee,DASH.who==='-'?'':DASH.who))return false;

  return Promise.all([pr,pt,pp,pg,pa]).then(function(){

function dashFind(k){var all=dashAll();for(var i=0;i<all.length;i++)if(all[i].k===k)return all[i];return null;}
function dashOnClick(e){
  if(Date.now()-(DASH_G.dragged||0)<400){e.stopPropagation();return;}
  var el=e.target.closest('[data-a]');if(!el||!dashRoot().contains(el))return;
  var a=el.dataset.a,v=el.dataset.v;
  if(a==='gord'){e.stopPropagation();dashGOrder(el.dataset.k,Number(v));return;}
  if(a.indexOf('as_')===0&&dashAsClick(a,v)){e.stopPropagation();return;}
  if(a.charAt(0)==='g'&&dashGClick(a,v,el)){e.stopPropagation();e.preventDefault();return;}
  if(a==='mv'||a==='open'){e.stopPropagation();var it=dashFind(el.dataset.k);if(it)dashEdit(it,a==='mv'?v:null);return;}
  if(a==='flt'){DASH.flt=(DASH.flt===v)?'':v;if(DASH.flt&&(DASH.view==='cal'||DASH.view==='gantt'))DASH.view='list';dashRender();return;}
  if(a==='view'){DASH.view=v;dashRender();return;}
  if(a==='mon'){if(v==='0'){DASH.ym=inspToday().slice(0,7);DASH.sel=inspToday();}else{var d=new Date(DASH.ym+'-01T00:00:00');d.setMonth(d.getMonth()+Number(v));DASH.ym=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}dashRender();return;}
  if(a==='day'){DASH.sel=v;dashRender();return;}
  if(a==='swl'||a==='swr'){var st=el.parentNode.querySelector('.dsh-strip');if(st)st.scrollBy({left:(a==='swr'?1:-1)*Math.max(220,st.clientWidth-160),behavior:'smooth'});return;}
  if(a==='new'){dashEdit(null,null,v||'');return;}
  if(a==='csv'){dashCSV();return;}
  if(a==='ntf'){dashNtfOpen();return;}
}

function dashSaveReq(it,v,note){
  var r=it.raw,stage=v.stage;

  var visitChanged=(v.visit_date||'')!==(r.visit_date||'')||(v.visit_time||'')!==(r.visit_time||'');
  var addLog=stageChanged||visitChanged||!!note;
  if((stageChanged||visitChanged)&&!note){dashErr('진행 내용을 입력해 주세요. 단계·방문일이 바뀌면 접수자에게 알림이 가므로 한 줄이라도 남겨야 합니다.');return;}
  if(stage==='보류'&&stageChanged&&!note){dashErr('보류 사유를 입력해 주세요.');return;}

  if(addLog){
    var sl=dashSchedLine(v),full=note+((visitChanged||stage==='방문 예정')&&sl&&note.indexOf(sl)<0?'\n'+sl:'');
    var log=(Array.isArray(r.progress_log)?r.progress_log:[]).concat([{n:(Array.isArray(r.progress_log)?r.progress_log.length:0)+1,stage:stage,note:full,by:staffLabel(),at:inspToday()}]);
    var st=stageStatus(r.type,stage);
    patch.progress_log=log;patch.progress=stage+' · '+full.split('\n')[0].slice(0,80);patch.status=st;patch.done_note=(st==='done')?'완료':'진행중';
  }
  sb.from('fac_requests').update(patch).eq('id',r.id).select().then(function(res){
    if(res.error){dashErr('저장 오류: '+res.error.message+(/vendor|visit_|quote_amount|final_amount|assignee/.test(res.error.message)?' (SQL 12 실행 필요)':''));return;}
    var nr=(res.data&&res.data[0])||Object.assign({},r,patch);
    for(var i=0;i<DASH.reqs.length;i++)if(DASH.reqs[i].id===r.id){DASH.reqs[i]=nr;break;}
    dashSyncSample(nr);dashRender();
    if(addLog)notifyApplicant('request',r.id,'<b>'+inspH(stage)+'</b> 단계로 저장했습니다.',mapReq(nr));

  });

  }

  });
