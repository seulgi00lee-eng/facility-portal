function dashDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);}
// D-day: 시작 전 = 시작일까지 D-n, 진행 기간 중 = '진행', 종료일 경과 = D+n(지연) — 기존 엑셀 일정표 기준
function dashDday(it){
  if(it.col==='완료')return '완료';
  if(!dashOpen(it))return '';
  var t=inspToday();
  if(it.start_date&&it.start_date>t){var a=dashDiff(t,it.start_date);return 'D-'+a;}
  if(!it.end_date)return it.start_date?'진행':'';
  var n=dashDiff(t,it.end_date);
  if(n<0)return 'D+'+(-n);
  if(it.start_date||it.col==='진행중')return n===0?'진행 (오늘 마감)':'진행';
  return n===0?'D-day':'D-'+n;
}

// ---------- 열 필터·정렬 (엑셀 자동 필터처럼) ----------
var DASH_BLANK='(비어 있음)';
function dashGFltOn(){return Object.keys(DASH_G.flt).length>0;}
function dashGColDef(k){var c=null;(DASH_G.curCols||dashGCols()).forEach(function(x){if(x.k===k)c=x;});return c;}
// 열 k에서 업무 t가 가진 값(여러 개일 수 있음)
function dashGVals(t,k){
  var r=t.raw||{},one=function(v){v=v==null?'':String(v).trim();return [v||DASH_BLANK];},many=function(v){var a=dashNames(v);return a.length?a:[DASH_BLANK];};
  if(k==='cp')return one(t.campus);if(k==='ct')return one(r.category);if(k==='tt')return one(r.title);
  if(k==='who')return many(t.assignee);if(k==='vd')return many(t.vendor);
  if(k==='s')return one(t.start_date?dashMD(t.start_date):'');if(k==='e')return one(t.end_date?dashMD(t.end_date):'');
  if(k==='st')return one(t.col);if(k==='dd')return one(dashDday(t));
  if(k==='vis'){var v=dashVisits(t);return v.length?v.map(dashMD):[DASH_BLANK];}
  if(k==='memo')return one(r.memo);
  if(k.indexOf('x_')===0){var c=dashGColDef(k);var x=(r.extra||{})[k.slice(2)];
    if(c&&c.kind==='select')return many(x);if(x==null||x==='')return [DASH_BLANK];
    if(c&&c.kind==='number')return [Number(x).toLocaleString('ko-KR')];if(c&&c.kind==='date')return [dashMD(x)];return one(x);}
  return [DASH_BLANK];
}
// 정렬 기준값: 날짜는 원래 형식, 숫자는 숫자
function dashGSortKey(t,k){
  var r=t.raw||{};
  if(k==='s')return t.start_date||'9999';if(k==='e')return t.end_date||'9999';if(k==='vis')return dashVisits(t)[0]||'9999';
  if(k==='st')return ('0'+DASH_COLS.indexOf(t.col)).slice(-2);
  if(k==='dd'){var d=dashDday(t),m=d.match(/^D([+-])(\d+)/);return m?(m[1]==='+'?-Number(m[2]):Number(m[2])):(d==='진행'?0:(d==='완료'?99999:50000));}
  if(k.indexOf('x_')===0){var c=dashGColDef(k),x=(r.extra||{})[k.slice(2)];if(c&&c.kind==='number')return x==null?Infinity:Number(x);return x==null?'':String(x);}
  return dashGVals(t,k)[0].replace(DASH_BLANK,'');
}
function dashGFltApply(ts){
  var f=DASH_G.flt,ks=Object.keys(f);
  if(ks.length)ts=ts.filter(function(t){return ks.every(function(k){var sel=f[k];return dashGVals(t,k).some(function(v){return sel.indexOf(v)>=0;});});});
  if(DASH_G.sort){var k=DASH_G.sort.k,d=DASH_G.sort.dir;ts=ts.slice().sort(function(a,b){var x=dashGSortKey(a,k),y=dashGSortKey(b,k);
    if(typeof x==='number'&&typeof y==='number')return (x-y)*d;return String(x).localeCompare(String(y),'ko',{numeric:true})*d;});}
  return ts;
}
function dashGFltOpen(btn,k){
  var H=inspH,c=dashGColDef(k);if(!c)return;
  // 다른 열 필터는 그대로 두고, 이 열에 나올 수 있는 값 모으기(엑셀과 같음)
  var other={};Object.keys(DASH_G.flt).forEach(function(x){if(x!==k)other[x]=DASH_G.flt[x];});
  var cnt={},order=[];
  DASH.projects.forEach(function(p){dashPjTasks(p.id).forEach(function(t){
    if(!Object.keys(other).every(function(x){return dashGVals(t,x).some(function(v){return other[x].indexOf(v)>=0;});}))return;
    dashGVals(t,k).forEach(function(v){if(!(v in cnt)){cnt[v]=0;order.push([v,dashGSortKey(t,k)]);}cnt[v]++;});});});
  order.sort(function(a,b){if(a[0]===DASH_BLANK)return 1;if(b[0]===DASH_BLANK)return -1;var x=a[1],y=b[1];if(typeof x==='number'&&typeof y==='number')return x-y;return String(x).localeCompare(String(y),'ko',{numeric:true});});
  var vals=order.map(function(o){return o[0];}),sel=DASH_G.flt[k]||vals.slice();
  var srt=DASH_G.sort&&DASH_G.sort.k===k?DASH_G.sort.dir:0;
  var el=dashPopOpen(btn,'<div class="pp-h">'+H(c.t)+' 필터</div>'
    +'<div class="gf-sort"><button data-s="1"'+(srt===1?' class="on"':'')+'>↑ 오름차순</button><button data-s="-1"'+(srt===-1?' class="on"':'')+'>↓ 내림차순</button></div>'
    +'<input type="text" class="gf-q" placeholder="값 검색">'
    +'<label class="pp-ck gf-all"><input type="checkbox"'+(sel.length===vals.length?' checked':'')+'> <b>(전체 선택)</b></label>'
    +'<div class="pp-list gf-list">'+vals.map(function(v){return '<label class="pp-ck" data-v="'+H(v)+'"><input type="checkbox" value="'+H(v)+'"'+(sel.indexOf(v)>=0?' checked':'')+'> <span>'+H(v)+'</span><em>'+cnt[v]+'</em></label>';}).join('')+'</div>'
    +'<div class="pp-f"><button data-x="clear">이 열 필터 해제</button><button data-x="cancel">취소</button><button class="pri" data-x="ok">확인</button></div>',260);
  var list=el.querySelector('.gf-list'),all=el.querySelector('.gf-all input'),q=el.querySelector('.gf-q');
  var boxes=function(vis){return [].slice.call(list.querySelectorAll('label')).filter(function(l){return !vis||l.style.display!=='none';}).map(function(l){return l.querySelector('input');});};
  var sync=function(){var b=boxes(true);all.checked=b.length>0&&b.every(function(x){return x.checked;});};
  all.addEventListener('change',function(){boxes(true).forEach(function(x){x.checked=all.checked;});});
  list.addEventListener('change',sync);
  q.addEventListener('input',function(){var s=q.value.trim().toLowerCase();[].slice.call(list.querySelectorAll('label')).forEach(function(l){var hit=!s||l.dataset.v.toLowerCase().indexOf(s)>=0;l.style.display=hit?'':'none';l.querySelector('input').checked=hit&&(!s||true)&&(s?true:l.querySelector('input').checked);});sync();});
  el.addEventListener('click',function(e){
    var sb2=e.target.closest('[data-s]');if(sb2){var d=Number(sb2.dataset.s);DASH_G.sort=(srt===d)?null:{k:k,dir:d};dashPopClose();dashRender();return;}
    var x=e.target.dataset&&e.target.dataset.x;if(!x)return;
    if(x==='cancel'){dashPopClose();return;}
    if(x==='clear'){delete DASH_G.flt[k];dashPopClose();dashRender();return;}
    var on=boxes(false).filter(function(i){return i.checked&&i.closest('label').style.display!=='none';}).map(function(i){return i.value;});
    if(!on.length){q.focus();q.placeholder='하나 이상 선택하세요';return;}
    if(on.length===vals.length)delete DASH_G.flt[k];else DASH_G.flt[k]=on;
    if(dashGFltOn())DASH.projects.forEach(function(p){DASH_G.fold[p.id]=false;});
    dashPopClose();dashRender();
  });
  q.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();el.querySelector('[data-x=ok]').click();}});
  setTimeout(function(){q.focus();},0);
}

// ---------- 열 구성: 기본 열 + 사용자 열(SQL 16) ----------
var DASH_GCOLS=[{k:'no',t:'No',w:56},{k:'cp',t:'캠퍼스',w:66},{k:'ct',t:'구분',w:76},{k:'tt',t:'세부 업무',w:240},{k:'who',t:'담당자',w:96},
  {k:'vd',t:'업체명',w:104,brief:1},{k:'s',t:'시작일',w:70,brief:1},{k:'e',t:'종료일',w:70,brief:1},{k:'st',t:'상태',w:74},{k:'dd',t:'D-day',w:60},
  {k:'vis',t:'방문예정일',w:110,brief:1},{k:'memo',t:'진행 및 이슈 사항',w:190,brief:1}];
var DASH_XKIND={text:'글자',number:'숫자·금액',date:'날짜',select:'선택(목록)'};
function dashLS(k,v){try{if(v===undefined){var x=localStorage.getItem(k);return x?JSON.parse(x):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function dashGHidden(){if(!DASH_G.hide)DASH_G.hide=dashLS('dash_gt_hide')||{};return DASH_G.hide;}
function dashGCols(){
  var hid=dashGHidden(),B=DASH_G.brief;
  var base=DASH_GCOLS.filter(function(c){return !(B&&c.brief)&&!hid[c.k];});
  var xs=(DASH.gcols||[]).slice().sort(function(a,b){return (a.sort_no||0)-(b.sort_no||0);});
  var out=[];
  var put=function(key){xs.filter(function(x){return x.after_key===key&&!x._put;}).forEach(function(x){x._put=1;var c={k:'x_'+x.id,t:x.name,w:110,custom:1,id:x.id,kind:x.kind||'text'};out.push(c);put(c.k);});};
  base.forEach(function(c){out.push(c);put(c.k);});
  // 기준 열이 숨겨졌거나 없으면, 기본 순서상 가장 가까운 앞 열 뒤에(없으면 맨 끝)
  xs.filter(function(x){return !x._put;}).forEach(function(x){var c={k:'x_'+x.id,t:x.name,w:110,custom:1,id:x.id,kind:x.kind||'text'};out.push(c);});
  xs.forEach(function(x){delete x._put;});
  return out;
}
function dashGW(){
  if(!DASH_G.w){DASH_G.w=dashLS('dash_gt_w')||{};}
  if(!DASH_G.rh){DASH_G.rh=dashLS('dash_gt_rh')||{};}
  DASH_GCOLS.forEach(function(c){if(!DASH_G.w[c.k])DASH_G.w[c.k]=c.w;});
  (DASH.gcols||[]).forEach(function(x){if(!DASH_G.w['x_'+x.id])DASH_G.w['x_'+x.id]=110;});
  if(!DASH_G.w.wd)DASH_G.w.wd=24;
  return DASH_G.w;
}
function dashGVars(cols){
  var W=dashGW(),v=[],l=0;
  DASH_GCOLS.forEach(function(c){v.push('--w-'+c.k+':'+W[c.k]+'px');});
  (cols||DASH_G.curCols||DASH_GCOLS).slice(0,4).forEach(function(c,i){v.push('--l'+i+':'+l+'px');l+=W[c.k];});
  v.push('--wd:'+W.wd+'px');
  return v.join(';');
}
function dashGResizeDown(e,h){
  e.preventDefault();e.stopPropagation();
  var W=dashGW(),tbl=document.getElementById('gt_tbl');
  if(h.dataset.cr){
    var k=h.dataset.cr,x0=e.clientX,w0=W[k],cust=k.indexOf('x_')===0;
    var cells=cust?[].slice.call(tbl.querySelectorAll('.gc-'+k)):[];
    var mv=function(ev){var w=Math.round(w0+(ev.clientX-x0));W[k]=k==='wd'?Math.max(14,Math.min(64,w)):Math.max(36,Math.min(600,w));
      if(cust)cells.forEach(function(c){c.style.width=c.style.minWidth=c.style.maxWidth=W[k]+'px';});
      tbl.setAttribute('style',dashGVars());dashGTip(ev.clientX,ev.clientY,(k==='wd'?'날짜 칸 ':'열 너비 ')+W[k]+'px');};
    var up=function(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dashGTip();dashLS('dash_gt_w',W);DASH_G.dragged=Date.now();};
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);return;
  }
  var key=h.dataset.rh,tr=h.closest('tr'),y0=e.clientY,h0=tr.getBoundingClientRect().height;
  var mv2=function(ev){var hh=Math.max(24,Math.min(240,Math.round(h0+(ev.clientY-y0))));tr.style.height=hh+'px';tr.classList.toggle('gt-tall',hh>32);DASH_G.rh[key]=hh;dashGTip(ev.clientX,ev.clientY,'행 높이 '+hh+'px');};
  var up2=function(){document.removeEventListener('pointermove',mv2);document.removeEventListener('pointerup',up2);dashGTip();
    if(DASH_G.rh[key]&&DASH_G.rh[key]<=29)delete DASH_G.rh[key];dashLS('dash_gt_rh',DASH_G.rh);DASH_G.dragged=Date.now();};
  document.addEventListener('pointermove',mv2);document.addEventListener('pointerup',up2);
}

// ---------- 공용 메뉴 ----------
function dashMenu(anchor,items,at){
  var html='<div class="pp-menu">'+items.map(function(it,i){return it==='-'?'<hr>':'<button data-i="'+i+'"'+(it.danger?' class="dng"':'')+(it.off?' disabled':'')+'>'+it.t+'</button>';}).join('')+'</div>';
  var el=dashPopOpen(anchor,html,190);
  if(at){el._fixedAt=1;el.style.left=Math.min(at[0],window.innerWidth-200)+'px';el.style.top=Math.max(8,Math.min(at[1],window.innerHeight-el.offsetHeight-8))+'px';}
  el.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(!b||b.disabled)return;var it=items[Number(b.dataset.i)];dashPopClose();it.fn();});
}
// 행 메뉴: 위·아래에 행 추가 / 상세 / 삭제
function dashRowMenu(td,tid,at){
  var t=dashRec('t',tid);if(!t)return;
  dashMenu(td,[
    {t:'↑ 위에 행 추가',fn:function(){dashInsertRow(td,tid,'above');}},
    {t:'↓ 아래에 행 추가',fn:function(){dashInsertRow(td,tid,'below');}},
    '-',
    {t:'상세 편집',fn:function(){var it=dashFind('t:'+tid);if(it)dashEdit(it);}},
    {t:'행 삭제',danger:1,fn:function(){
      if(!confirm('['+(t.title||'')+'] 행을 삭제할까요?\n(목록에서 숨김 처리되며 Supabase에는 기록이 남습니다)'))return;
      var pid=t.project_id;DASH.tasks=DASH.tasks.filter(function(x){return x.id!==tid;});dashRender();
      sb.from('fac_team_tasks').update({deleted:true,updated_at:new Date().toISOString()}).eq('id',tid).then(function(r){
        if(r.error){DASH.tasks.push(t);dashRender();inspToast('삭제 실패: '+r.error.message,true);return;}
        dashRenumber(pid);inspToast('행을 삭제했습니다');});}}
  ],at);
}
function dashInsertRow(anchor,tid,pos){
  var t=dashRec('t',tid);if(!t)return;
  var el=dashPopOpen(anchor,'<div class="pp-h">'+(pos==='above'?'위에':'아래에')+' 행 추가 <span>Enter 저장</span></div><input type="text" placeholder="세부 업무명"><div class="pp-f"><button data-x="cancel">취소</button><button class="pri" data-x="ok">추가</button></div>',300);
  var inp=el.querySelector('input');
  var go=function(){
    var title=inp.value.trim();if(!title){inp.focus();return;}dashPopClose();
    var pid=t.project_id,p=dashPjOf(pid)||{},list=dashPjTasks(pid).map(function(x){return x.raw;}),ix=list.indexOf(t);
    var at=pos==='above'?ix:ix+1,prev=list[at-1];
    var st=(prev&&prev.end_date)?dashAddDays(prev.end_date,1):(t.start_date||p.start_date||inspToday());
    var row={project_id:pid,title:title,category:t.category||p.category||null,campus:t.campus||p.campus||null,building:t.building||null,stage:'진행 예정',
      start_date:st,end_date:dashAddDays(st,2),assignee:t.assignee||p.owner||null,sort_no:0,
      log:[{n:1,stage:'진행 예정',note:'업무 등록',by:staffLabel(),at:inspToday()}],created_by:(CURRENT_USER&&CURRENT_USER.login_id)||null};
    sb.from('fac_team_tasks').insert(row).select().then(function(res){
      if(res.error){inspToast('행 추가 실패: '+res.error.message,true);return;}
      var nr=res.data&&res.data[0];if(!nr)return;DASH.tasks.push(nr);
      list.splice(at,0,nr);dashRenumber(pid,list);inspToast('행 추가: '+title);
    });
  };
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go();}});
  el.addEventListener('click',function(e){var x=e.target.dataset&&e.target.dataset.x;if(x==='cancel')dashPopClose();if(x==='ok')go();});
  setTimeout(function(){inp.focus();},0);
}
// 프로젝트 안 순서를 10 단위로 다시 매기고 바뀐 행만 저장
function dashRenumber(pid,list){
  list=list||dashPjTasks(pid).map(function(x){return x.raw;});
  var ups=[];list.forEach(function(x,k){var n=(k+1)*10,patch={};
    if(x.sort_no!==n){x.sort_no=n;patch.sort_no=n;}
    if(x.project_id!==pid){x.project_id=pid;patch.project_id=pid;}
    if(Object.keys(patch).length)ups.push(sb.from('fac_team_tasks').update(patch).eq('id',x.id));});
  dashRender();
  return Promise.all(ups).then(function(rs){var er=rs.filter(function(r){return r&&r.error;});if(er.length)inspToast('순서 저장 실패: '+er[0].error.message,true);});
}

// ---------- 행 끌어서 이동 (프로젝트 사이 이동 포함) ----------
function dashGRowDown(e,grip){
  e.preventDefault();e.stopPropagation();
  var tid=grip.dataset.grip,src=grip.closest('tr'),wrap=document.querySelector('.gt-wrap');
  src.classList.add('gt-moving');
  var g={tid:tid,tgt:null,pos:null,moved:false,y0:e.clientY};
  var clear=function(){if(g.tgt)g.tgt.classList.remove('gt-drop-a','gt-drop-b','gt-drop-in');};
  var mv=function(ev){
    if(Math.abs(ev.clientY-g.y0)>3)g.moved=true;if(!g.moved)return;
    var wr=wrap.getBoundingClientRect();
    if(ev.clientY<wr.top+40)wrap.scrollTop-=12;else if(ev.clientY>wr.bottom-30)wrap.scrollTop+=12;
    var x=wr.left+20,el=document.elementFromPoint(x,ev.clientY),tr=el&&el.closest&&el.closest('tr');
    clear();g.tgt=null;
    if(!tr||!wrap.contains(tr)||tr===src)return;
    var r=tr.getBoundingClientRect();
    if(tr.classList.contains('gt-tk')){g.tgt=tr;g.pos=(ev.clientY<r.top+r.height/2)?'a':'b';tr.classList.add(g.pos==='a'?'gt-drop-a':'gt-drop-b');}
    else if(tr.classList.contains('gt-pj')){g.tgt=tr;g.pos='in';tr.classList.add('gt-drop-in');}
    else if(tr.classList.contains('gt-addrow')){g.tgt=tr;g.pos='end';tr.classList.add('gt-drop-a');}
    dashGTip(ev.clientX,ev.clientY,g.pos==='in'?'이 프로젝트 맨 위로':g.pos==='end'?'이 프로젝트 맨 아래로':'여기에 놓기');
  };
  var up=function(){
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);dashGTip();
    src.classList.remove('gt-moving');clear();DASH_G.dragged=Date.now();
    if(!g.moved||!g.tgt)return;
    var t=dashRec('t',tid),pid=g.tgt.dataset.pj,old=t.project_id;
    var list=dashPjTasks(pid).map(function(x){return x.raw;}).filter(function(x){return x.id!==tid;}),at;
    if(g.pos==='in')at=0;else if(g.pos==='end')at=list.length;
    else{var tt=dashRec('t',g.tgt.dataset.tid);at=list.indexOf(tt)+(g.pos==='b'?1:0);}
    list.splice(at,0,t);
    if(old!==pid){t.project_id=pid;DASH_G.fold[pid]=false;}
    dashRenumber(pid,list).then(function(){if(old&&old!==pid)dashRenumber(old);});
    inspToast(old!==pid?'다른 프로젝트로 옮겼습니다':'행을 옮겼습니다');
  };
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}

// ---------- 열 메뉴: 열 추가(왼쪽·오른쪽) / 이름 변경 / 삭제 / 숨기기 ----------
function dashColMenu(btn,k){
  var cols=DASH_G.curCols||dashGCols(),ix=-1;cols.forEach(function(c,i){if(c.k===k)ix=i;});
  var c=cols[ix];if(!c)return;
  var leftKey=ix>0?cols[ix-1].k:'no';
  var items=[
    {t:'← 왼쪽에 열 추가',off:!DASH.gcolOK||k==='no',fn:function(){dashColAdd(btn,leftKey);}},
    {t:'→ 오른쪽에 열 추가',off:!DASH.gcolOK,fn:function(){dashColAdd(btn,k);}},
    '-'];
  if(c.custom){
    items.push({t:'열 이름·형식 변경',fn:function(){dashColAdd(btn,null,c);}});
    items.push({t:'열 삭제',danger:1,fn:function(){
      if(!confirm('['+c.t+'] 열을 삭제할까요?\n(입력한 값은 Supabase에 남고 화면에서만 사라집니다)'))return;
      DASH.gcols=DASH.gcols.filter(function(x){return x.id!==c.id;});dashRender();
      sb.from('fac_gantt_cols').update({deleted:true}).eq('id',c.id).then(function(r){if(r.error)inspToast('열 삭제 실패: '+r.error.message,true);else inspToast('열을 삭제했습니다');});}});
  }else if(k!=='tt'){
    items.push({t:'이 열 숨기기 (내 화면만)',fn:function(){dashGHidden()[k]=1;dashLS('dash_gt_hide',DASH_G.hide);dashRender();inspToast(c.t+' 열을 숨겼습니다');}});
  }
  if(!DASH.gcolOK)items.push({t:'열 추가는 SQL 16 실행 후 사용',off:1,fn:function(){}});
  dashMenu(btn,items);
}
function dashColAdd(anchor,afterKey,edit){
  var H=inspH;
  var el=dashPopOpen(anchor,'<div class="pp-h">'+(edit?'열 이름·형식 변경':'새 열 추가')+' <span>팀 전체에 보입니다</span></div>'
    +'<input type="text" class="cx-n" placeholder="열 이름 (예: 계약금액, 담당 업체 연락처)" value="'+H(edit?edit.t:'')+'">'
    +'<div class="cx-k">'+Object.keys(DASH_XKIND).map(function(k){return '<label><input type="radio" name="cxk" value="'+k+'"'+((edit?edit.kind:'text')===k?' checked':'')+'> '+DASH_XKIND[k]+'</label>';}).join('')+'</div>'
    +'<div class="pp-f"><button data-x="cancel">취소</button><button class="pri" data-x="ok">'+(edit?'저장':'추가')+'</button></div>',280);
  var inp=el.querySelector('.cx-n');
  var go=function(){
    var name=inp.value.trim();if(!name){inp.focus();return;}
    var kind=(el.querySelector('input[name=cxk]:checked')||{}).value||'text';dashPopClose();
    if(edit){var x=null;DASH.gcols.forEach(function(g){if(g.id===edit.id)x=g;});var old={name:x.name,kind:x.kind};x.name=name;x.kind=kind;dashRender();
      sb.from('fac_gantt_cols').update({name:name,kind:kind}).eq('id',edit.id).then(function(r){if(r.error){x.name=old.name;x.kind=old.kind;dashRender();inspToast('저장 실패: '+r.error.message,true);}else inspToast('열을 바꿨습니다');});return;}
    var sib=DASH.gcols.filter(function(g){return g.after_key===afterKey;});
    var sn=sib.length?Math.min.apply(null,sib.map(function(g){return g.sort_no||0;}))-10:0;
    sb.from('fac_gantt_cols').insert({name:name,kind:kind,after_key:afterKey,sort_no:sn,created_by:(CURRENT_USER&&CURRENT_USER.login_id)||null}).select().then(function(r){
      if(r.error){inspToast('열 추가 실패: '+r.error.message+(/fac_gantt_cols/.test(r.error.message)?' (SQL 16 실행 필요)':''),true);return;}
      DASH.gcols.push(r.data[0]);if(DASH_G.brief&&!dashGCols().some(function(c){return c.k==='x_'+r.data[0].id;}))DASH_G.brief=false;dashRender();inspToast('['+name+'] 열을 추가했습니다');});
  };
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();go();}});
  el.addEventListener('click',function(e){var x=e.target.dataset&&e.target.dataset.x;if(x==='cancel')dashPopClose();if(x==='ok')go();});
  setTimeout(function(){inp.focus();inp.select();},0);
}
// 사용자 열 셀 편집
function dashXEdit(td,kind,id,colId){
  var col=null;(DASH.gcols||[]).forEach(function(g){if(g.id===colId)col=g;});if(!col)return;
  var rec=dashRec(kind,id),cur=(rec.extra||{})[colId],H=inspH;
  var save=function(v){var ex=Object.assign({},rec.extra||{});if(v==null||v==='')delete ex[colId];else ex[colId]=v;dashCellSave(kind,id,{extra:ex});};
  if(col.kind==='date'){
    var st={ym:(cur||inspToday()).slice(0,7)};var el=dashPopOpen(td,'<div class="pp-cal"></div>',268);
    var draw=function(){var y=Number(st.ym.slice(0,4)),m=Number(st.ym.slice(5,7)),first=st.ym+'-01',start=dashAddDays(first,-new Date(first+'T00:00:00').getDay()),t=inspToday(),g='';
      for(var i=0;i<42;i++){var d=dashAddDays(start,i);if(i===35&&d.slice(0,7)!==st.ym)break;var w=new Date(d+'T00:00:00').getDay();
        g+='<button class="pc-d'+(d.slice(0,7)!==st.ym?' out':'')+(d===t?' today':'')+(d===cur?' on':'')+(w===0?' sun':w===6?' sat':'')+'" data-d="'+d+'">'+Number(d.slice(8))+'</button>';}
      el.querySelector('.pp-cal').innerHTML='<div class="pp-h">'+H(col.name)+'</div><div class="pc-h"><button data-m="-1">‹</button><b>'+y+'년 '+m+'월</b><button data-m="1">›</button></div>'
        +'<div class="pc-g">'+'일월화수목금토'.split('').map(function(x,i){return '<span class="pc-w'+(i===0?' sun':i===6?' sat':'')+'">'+x+'</span>';}).join('')+g+'</div>'
        +'<div class="pp-f"><button data-x="clear">비우기</button><button data-x="cancel">취소</button></div>';};
    draw();
    el.addEventListener('click',function(e){var b=e.target.closest('[data-d],[data-m],[data-x]');if(!b)return;
      if(b.dataset.m){var dd=new Date(st.ym+'-01T00:00:00');dd.setMonth(dd.getMonth()+Number(b.dataset.m));st.ym=dd.getFullYear()+'-'+('0'+(dd.getMonth()+1)).slice(-2);draw();return;}
      if(b.dataset.d){dashPopClose();save(b.dataset.d);return;}
      dashPopClose();if(b.dataset.x==='clear')save(null);});
    return;
  }
  if(col.kind==='select'){
    var vals=dashNames(cur),opts={};DASH.tasks.concat(DASH.projects).forEach(function(r){dashNames((r.extra||{})[colId]).forEach(function(v){opts[v]=(opts[v]||0)+1;});});
    var ol=Object.keys(opts).sort(function(a,b){return opts[b]-opts[a];});vals.forEach(function(v){if(ol.indexOf(v)<0)ol.unshift(v);});
    var el2=dashPopOpen(td,'<div class="pp-h">'+H(col.name)+' <span>여러 개 선택 가능</span></div><div class="pp-list">'+(ol.length?ol.map(function(o){return '<label class="pp-ck"><input type="checkbox" value="'+H(o)+'"'+(vals.indexOf(o)>=0?' checked':'')+'> '+H(o)+'</label>';}).join(''):'<div class="pp-none">아래에 입력해 선택지를 만드세요</div>')+'</div>'
      +'<div class="pp-add"><input type="text" placeholder="직접 입력 후 Enter (추가)"></div><div class="pp-f"><button data-x="clear">비우기</button><button data-x="cancel">취소</button><button class="pri" data-x="ok">저장</button></div>',260);
    var list=el2.querySelector('.pp-list'),ai=el2.querySelector('.pp-add input');
    ai.addEventListener('keydown',function(e){if(e.key!=='Enter'||e.isComposing)return;e.preventDefault();var v=ai.value.trim();if(!v)return;var nn=list.querySelector('.pp-none');if(nn)nn.remove();
      var l=document.createElement('label');l.className='pp-ck';l.innerHTML='<input type="checkbox" checked> ';l.firstChild.value=v;l.appendChild(document.createTextNode(v));list.appendChild(l);ai.value='';});
    el2.addEventListener('click',function(e){var x=e.target.dataset&&e.target.dataset.x;if(!x)return;if(x==='cancel'){dashPopClose();return;}
      var v=x==='clear'?[]:[].slice.call(list.querySelectorAll('input:checked')).map(function(i){return i.value;});var pend=ai.value.trim();if(x==='ok'&&pend&&v.indexOf(pend)<0)v.push(pend);
      dashPopClose();save(v.length?v.join(', '):null);});
    setTimeout(function(){ai.focus();},0);return;

function dashPopPlace(el,td){

// 모드: move(가운데) · l(시작일) · r(종료일) · draw(빈 칸에서 새로 그리기, PC만)
function dashGDown(e){
  if(e.button!==undefined&&e.button!==0)return;
  var gp=e.target.closest&&e.target.closest('.gt-grip');if(gp){dashGRowDown(e,gp);return;}
  var hz=e.target.closest&&e.target.closest('.gt-cr,.gt-rh');if(hz){dashGResizeDown(e,hz);return;}
  var td=e.target.closest('td.gt-c');if(!td)return;
  var tr=td.parentNode;if(!tr.classList.contains('gt-tk')&&!tr.classList.contains('gt-pj'))return;
  var gs=tr.dataset.gs,ge=tr.dataset.ge||gs,d=td.dataset.d,onBar=!!e.target.closest('.gb');
  var mode;
  if(onBar&&gs){
    var r=td.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;
    if(d===gs&&d===ge)mode=x<.35?'l':x>.65?'r':'move';
    else mode=d===gs?'l':d===ge?'r':'move';
  }else{
    if(e.pointerType!=='mouse')return;           // 터치는 막대만 끌기(빈 칸은 스크롤)
    if(tr.classList.contains('gt-pj')&&gs)return; // 프로젝트 막대 밖 빈 칸은 무시
    mode='draw';gs=ge=d;
  }
  e.preventDefault();
  var cells=[].slice.call(tr.querySelectorAll('td.gt-c'));
  DASH_G.drag={tr:tr,cells:cells,mode:mode,d0:d,s0:gs,e0:ge,s:gs,e:ge,moved:false};
  dashGPaint();
  document.addEventListener('pointermove',dashGMove);
  document.addEventListener('pointerup',dashGUp);
  document.addEventListener('pointercancel',dashGUp);
}
function dashGDayAt(x){
  var g=DASH_G.drag;
  if(!g.rects)g.rects=g.cells.map(function(c){var r=c.getBoundingClientRect();return [r.left,r.right,c.dataset.d];});
  var best=null,bd=1e9;
  for(var i=0;i<g.rects.length;i++){var r=g.rects[i];if(x>=r[0]&&x<r[1])return r[2];var dd=Math.min(Math.abs(x-r[0]),Math.abs(x-r[1]));if(dd<bd){bd=dd;best=r[2];}}
  return best;
}
function dashGMove(e){
  var g=DASH_G.drag;if(!g)return;
  var d=dashGDayAt(e.clientX),n=dashDiff(g.d0,d);
  if(g.mode==='move'){g.s=dashAddDays(g.s0,n);g.e=dashAddDays(g.e0,n);}
  else if(g.mode==='l'){g.s=d>g.e0?g.e0:d;g.e=g.e0;}
  else if(g.mode==='r'){g.e=d<g.s0?g.s0:d;g.s=g.s0;}
  else{g.s=d<g.d0?d:g.d0;g.e=d<g.d0?g.d0:d;}
  if(g.s!==g.s0||g.e!==g.e0)g.moved=true;
  dashGPaint();dashGTip(e.clientX,e.clientY,dashMD(g.s)+' ~ '+dashMD(g.e)+' · '+(dashDiff(g.s,g.e)+1)+'일');
}
function dashGPaint(){
  var g=DASH_G.drag;
  g.cells.forEach(function(c){
    var d=c.dataset.d,on=d>=g.s&&d<=g.e,pv=c.querySelector('.gb-pv');
    if(on&&!pv){pv=document.createElement('i');pv.className='gb-pv';c.appendChild(pv);}
    if(!on&&pv)pv.remove();
    if(pv){pv.classList.toggle('gb-s',d===g.s);pv.classList.toggle('gb-e',d===g.e);}
  });
  g.tr.classList.add('gt-dragging');
}

// ===== 공용 필터 창 (자산 목록 등) =====
// vals: 값 목록(순서대로), cnt: 값별 건수, sel: 현재 선택(null=전체), sortDir: 1/-1/0
function dashFltPop(btn,title,vals,cnt,sel,sortDir,onApply,onSort){
  var H=inspH;sel=sel||vals.slice();
  var el=dashPopOpen(btn,'<div class="pp-h">'+H(title)+' 필터</div>'
    +'<div class="gf-sort"><button data-s="1"'+(sortDir===1?' class="on"':'')+'>↑ 오름차순</button><button data-s="-1"'+(sortDir===-1?' class="on"':'')+'>↓ 내림차순</button></div>'
    +'<input type="text" class="gf-q" placeholder="값 검색">'
    +'<label class="pp-ck gf-all"><input type="checkbox"'+(sel.length===vals.length?' checked':'')+'> <b>(전체 선택)</b></label>'
    +'<div class="pp-list gf-list">'+(vals.length?vals.map(function(v){return '<label class="pp-ck" data-v="'+H(v)+'"><input type="checkbox" value="'+H(v)+'"'+(sel.indexOf(v)>=0?' checked':'')+'> <span>'+H(v)+'</span><em>'+(cnt[v]||0)+'</em></label>';}).join(''):'<div class="pp-none">값이 없습니다</div>')+'</div>'
    +'<div class="pp-f"><button data-x="clear">이 열 필터 해제</button><button data-x="cancel">취소</button><button class="pri" data-x="ok">확인</button></div>',260);
  var list=el.querySelector('.gf-list'),all=el.querySelector('.gf-all input'),q=el.querySelector('.gf-q');
  var labels=function(){return [].slice.call(list.querySelectorAll('label'));};
  var sync=function(){var v=labels().filter(function(l){return l.style.display!=='none';});all.checked=v.length>0&&v.every(function(l){return l.querySelector('input').checked;});};
  all.addEventListener('change',function(){labels().forEach(function(l){if(l.style.display!=='none')l.querySelector('input').checked=all.checked;});});
  list.addEventListener('change',sync);
  q.addEventListener('input',function(){var s=q.value.trim().toLowerCase();labels().forEach(function(l){var hit=!s||l.dataset.v.toLowerCase().indexOf(s)>=0;l.style.display=hit?'':'none';if(s)l.querySelector('input').checked=hit;});sync();});
  q.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();el.querySelector('[data-x=ok]').click();}});
  el.addEventListener('click',function(e){
    var s2=e.target.closest('[data-s]');if(s2){var d=Number(s2.dataset.s);dashPopClose();onSort(sortDir===d?0:d);return;}
    var x=e.target.dataset&&e.target.dataset.x;if(!x)return;
    if(x==='cancel'){dashPopClose();return;}
    if(x==='clear'){dashPopClose();onApply(null);return;}
    var on=labels().filter(function(l){return l.style.display!=='none'&&l.querySelector('input').checked;}).map(function(l){return l.dataset.v;});
    if(!on.length){q.focus();q.placeholder='하나 이상 선택하세요';return;}
    dashPopClose();onApply(on.length===vals.length?null:on);
  });
  setTimeout(function(){q.focus();},0);
}

    p.updated_at=new Date().toISOString();if(DASH.asNmOK!==false)p.updated_name=dashMe();

function inspFetchAll(build){
  var out=[],step=1000;
  function page(from){
    return build().range(from,from+step-1).then(function(r){
      if(r.error)throw r.error;
      var d=r.data||[];out=out.concat(d);
      return d.length===step?page(from+step):out;
    });
  }
  return page(0);
}

function inspFloorNum(f){var t=String(f||'');var m=t.match(/(B|b|지하)\s*(\d+)/);if(m)return -Number(m[2]);m=t.match(/(\d+)/);return m?Number(m[1]):999;}
function inspBuildLocs(floors){
  var byCode={};INSP.campuses.forEach(function(c){byCode[c.campus_code]=c;});
  var map={},covered={};
  floors.forEach(function(f){
    var code=String(f.gwan_code||'').trim(),c=byCode[code];if(!c||!f.building||!f.floor)return;
    var b=String(f.building).trim(),fl=String(f.floor).trim(),key='B:'+b+'|'+fl;
    var L=map[key]||(map[key]={key:key,building:b,floor:fl,region:f.region||c.region||'',codes:[],camps:[]});
    if(L.codes.indexOf(code)<0){L.codes.push(code);L.camps.push(c);}
    covered[code]=1;
  });
  var locs=Object.keys(map).map(function(k){return map[k];});
  // 건물·층 정보가 없는 관은 관 단위로 남김
  INSP.campuses.forEach(function(c){if(covered[c.campus_code])return;
    locs.push({key:c.campus_code,building:'건물·층 미등록',floor:c.campus_label||c.campus_code,region:c.region||'',codes:[c.campus_code],camps:[c],legacy:true});});
  locs.forEach(function(L){

    var seen={};L.campText=L.camps.map(function(c){var t=[c.brand,c.region].filter(Boolean).join(' ')||c.campus_label;if(seen[t])return null;seen[t]=1;return t;}).filter(Boolean).join(' · ');
    L.brands=L.camps.map(function(c){return c.brand;}).filter(Boolean);
  });
  locs.sort(function(a,b){return (a.legacy?1:0)-(b.legacy?1:0)||String(a.region).localeCompare(String(b.region),'ko')||a.building.localeCompare(b.building,'ko')||inspFloorNum(a.floor)-inspFloorNum(b.floor);});

}

// ---------- 점검 시작 / 열기 ----------
function inspStart(code){
  var ex=INSP.list.filter(function(x){return x.campus_code===code;})[0];
  if(ex){inspOpen(ex.id);return;}
  var L=INSP.locByKey[code]||{title:code,campText:'',region:'',brands:[]};
  if(!confirm('['+INSP.round+']\n'+L.title+(L.campText?'\n('+L.campText+')':'')+'\n점검을 시작할까요?'))return;
  var br={};(L.brands||[]).forEach(function(b){br[b]=1;});
  sb.from('fac_inspections').insert({
    round_name:INSP.round,campus_code:code,campus_label:L.title||null,region:L.region||null,brand:Object.keys(br).join(', ')||null,
    inspector_login:(CURRENT_USER&&CURRENT_USER.login_id)||null,inspector_name:(CURRENT_USER&&CURRENT_USER.name)||null,
    inspected_at:inspToday()
  }).select().then(function(r){
    if(r.error){
      // 다른 팀원이 먼저 시작한 경우 → 그 회차를 연다
      sb.from('fac_inspections').select('*').eq('round_name',INSP.round).eq('campus_code',code).limit(1).then(function(r2){
        var row=r2&&r2.data&&r2.data[0];
        if(row){INSP.list.push(row);inspOpen(row.id);}else alert('시작하지 못했습니다: '+r.error.message);
      });
      return;
    }
    var row=r.data[0];INSP.list.push(row);inspOpen(row.id);
  });
}
function inspOpen(id){
  var root=inspRoot();if(root)root.innerHTML='<div class="hint" style="padding:20px">점검표를 불러오는 중...</div>';
  sb.from('fac_inspections').select('*').eq('id',id).limit(1).then(function(r){
    var cur=r&&r.data&&r.data[0];if(!cur){alert('점검 정보를 찾을 수 없습니다.');inspLoadRound();return;}
    INSP.cur=cur;INSP.res={};INSP.prev={};INSP.spaces=[];INSP.sinfo={};
    return Promise.all([
      inspFetchAll(function(){return sb.from('fac_inspection_results').select('*').eq('inspection_id',id);}),
      sb.from('fac_inspection_spaces').select('*').eq('inspection_id',id).then(function(r){return r;},function(){return {};}),
      sb.from('fac_inspections').select('id,round_name,inspected_at').eq('campus_code',cur.campus_code).neq('id',id).eq('status','완료').order('inspected_at',{ascending:false}).limit(1)
    ]).then(function(rs){
      var sseen={};
      rs[0].forEach(function(x){
        INSP.res[inspKey(x.item_id,x.space_name)]=x;
        if(x.space_name&&x.space_name.charAt(0)!=='@'&&!sseen[x.space_name]){sseen[x.space_name]=1;INSP.spaces.push({name:x.space_name,zone:x.space_zone||''});}
      });
      ((rs[1]&&rs[1].data)||[]).forEach(function(r){INSP.sinfo[r.space_name]=r;
        if(r.space_name.charAt(0)!=='@'&&!sseen[r.space_name]){sseen[r.space_name]=1;INSP.spaces.push({name:r.space_name,zone:r.zone||''});}});
      INSP.spaces.sort(function(a,b){return INSP_SPACE_ZONES.indexOf(a.zone)-INSP_SPACE_ZONES.indexOf(b.zone)||a.name.localeCompare(b.name,'ko',{numeric:true});});
      var prev=rs[2]&&rs[2].data&&rs[2].data[0];
      if(!prev){INSP.view='run';inspRenderRun();return;}
      INSP.prevRound=prev.round_name+' ('+prev.inspected_at+')';
      return sb.from('fac_inspection_results').select('item_id,space_name,result').eq('inspection_id',prev.id).in('result',['미흡','불량']).then(function(p){
        ((p&&p.data)||[]).forEach(function(x){INSP.prev[inspKey(x.item_id,x.space_name)]=x.result;});
        INSP.view='run';inspRenderRun();
      });
    });
  }).catch(function(e){alert('불러오기 실패: '+(e&&e.message||e));});
}

function inspUpdateProg(){
  var p=inspProgress(),el=document.getElementById('insp_prog'),ap=document.getElementById('insp_actprog');
  if(ap)ap.innerHTML='<b>'+p.pct+'%</b><span>'+p.done+'/'+p.total+(p.bad||p.weak?' · <em style="color:var(--dng);font-style:normal">미흡·불량 '+(p.bad+p.weak)+'</em>':'')+'</span>';
  if(el)el.innerHTML='<div class="insp-pbar"><i style="width:'+p.pct+'%"></i></div>'
    +'<div class="hint" style="margin-top:4px">'+p.done+' / '+p.total+' 항목 ('+p.pct+'%) · <span style="color:var(--warn)">미흡 '+p.weak+'</span> · <span style="color:var(--dng)">불량 '+p.bad+'</span></div>';
  var groups={};
  INSP.ck.forEach(function(it){var k=inspKey(it.id,'');if(inspHidden(k))return;var z=INSP_ZONES.indexOf(it.zone)>=0?it.zone:'전 구역';var g=groups[z]||(groups[z]={t:0,d:0});g.t++;var x=INSP.res[k];if(x&&x.result)g.d++;});
  INSP_EQ_ZONES.forEach(function(z){(INSP.zi||[]).forEach(function(it){var k=inspKey(it.id,'@'+z);if(inspHidden(k))return;var g=groups[z]||(groups[z]={t:0,d:0});g.t++;var x=INSP.res[k];if(x&&x.result)g.d++;});});
  INSP.spaces.forEach(function(s){inspSpFor(s.zone).forEach(function(it){var k=inspKey(it.id,s.name);if(inspHidden(k))return;var g=groups[s.zone]||(groups[s.zone]={t:0,d:0});g.t++;var x=INSP.res[k];if(x&&x.result)g.d++;});});
  document.querySelectorAll('#insp_root .insp-zc').forEach(function(sp){
    var g=groups[sp.dataset.zc];if(!g){sp.textContent='';return;}sp.textContent=g.d+'/'+g.t;sp.style.color=g.d===g.t?'var(--ok)':'';
    var btn=sp.closest('.insp-zbtn');if(btn)btn.classList.toggle('done',g.t>0&&g.d===g.t);
  });
}
function inspRefreshItem(k){
  var el=document.querySelector('#insp_root .insp-it[data-k="'+CSS.escape(k)+'"]');
  if(!el)return;
  var parts=k.split('|'),it=INSP.itemById[parts[0]];if(!it)return;
  var tmp=document.createElement('div');tmp.innerHTML=inspItemHTML(it,parts.slice(1).join('|'),el.dataset.zone);
  el.parentNode.replaceChild(tmp.firstChild,el);
  inspUpdateProg();

// ---------- 저장 ----------
function inspSave(k,patch){
  var parts=k.split('|'),itemId=Number(parts[0]),space=parts.slice(1).join('|');
  var base=INSP.res[k]||{};
  var sp=INSP.spaces.filter(function(s){return s.name===space;})[0];
  var row={
    inspection_id:INSP.cur.id,item_id:itemId,space_name:space,space_zone:space?(space.charAt(0)==='@'?space.slice(1):((sp&&sp.zone)||base.space_zone||null)):null,
    result:base.result||null,action_type:base.action_type||null,note:base.note||null,photo_paths:base.photo_paths||[],
    updated_by:(CURRENT_USER&&CURRENT_USER.login_id)||null,updated_at:new Date().toISOString()
  };
  Object.keys(patch).forEach(function(f){row[f]=patch[f];});
  INSP.res[k]=Object.assign({},base,row);
  return sb.from('fac_inspection_results').upsert(row,{onConflict:'inspection_id,item_id,space_name'}).select().then(function(r){
    if(r.error){inspToast('저장 실패: '+r.error.message,true);return false;}
    if(r.data&&r.data[0])INSP.res[k]=r.data[0];
    inspToast('저장됨');return true;
  });
}
function inspSaveMany(rows){
  if(!rows.length)return Promise.resolve(true);
  return sb.from('fac_inspection_results').upsert(rows,{onConflict:'inspection_id,item_id,space_name'}).select().then(function(r){
    if(r.error){inspToast('저장 실패: '+r.error.message,true);return false;}
    (r.data||[]).forEach(function(x){INSP.res[inspKey(x.item_id,x.space_name)]=x;});
    inspToast('저장됨');return true;
  });
}
function inspAddSpace(zi){
  var zone=INSP_ZONES[Number(zi)]||'강의실',n=document.getElementById('insp_sp_'+zi);
  var raw=(n&&n.value||'').trim();
  if(!raw){alert('공간명을 입력하세요. (예: 301호)');if(n)n.focus();return;}
  var names=(zone==='강의실'?raw.split(/[,，\/]+/):[raw]).map(function(x){
    x=x.trim();if(zone==='강의실'&&/^\d+$/.test(x))x+='호';return x;}).filter(Boolean);
  var dup=[],add=[];
  names.forEach(function(nm){if(INSP.spaces.some(function(s){return s.name===nm;})||add.indexOf(nm)>=0)dup.push(nm);else add.push(nm);});
  if(!add.length){alert('이미 추가된 공간입니다: '+dup.join(', '));return;}
  var items=inspSpFor(zone),rows=[];
  add.forEach(function(nm){
    INSP.spaces.push({name:nm,zone:zone});
    // 공간 목록이 새로고침 후에도 남도록 빈 결과 행을 미리 저장
    items.forEach(function(it){rows.push({inspection_id:INSP.cur.id,item_id:it.id,space_name:nm,space_zone:zone,updated_by:(CURRENT_USER&&CURRENT_USER.login_id)||null});});
  });
  INSP.spaces.sort(function(a,b){return INSP_SPACE_ZONES.indexOf(a.zone)-INSP_SPACE_ZONES.indexOf(b.zone)||a.name.localeCompare(b.name,'ko',{numeric:true});});
  inspSaveMany(rows).then(function(){inspRenderRun();
    if(dup.length)inspToast('이미 있는 공간 제외: '+dup.join(', '));
    inspScrollToSpace(add[0]);});
}
// 새로 추가한 공간이 화면 맨 위(고정 머리글 바로 아래)에 오도록
function inspScrollToSpace(name){
  var el=document.querySelector('#insp_root details[data-sp="'+CSS.escape(name)+'"]');if(!el)return;
  el.open=true;
  var st=document.querySelector('#insp_root .insp-sticky'),h=st?st.offsetHeight:0;
  window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h-8,behavior:'smooth'});
}
// ---------- 삭제 / 복원 ----------
function inspDelMenu(k){
  var parts=k.split('|'),it=INSP.itemById[parts[0]]||{},space=parts.slice(1).join('|');
  var label=(it.title||'')+(space?' ('+space+')':'');
  INSP.delKey=k;

    +'<div class="hint" style="margin-bottom:14px">'+inspH(label)+'</div>'
    +'<button class="submit" style="width:100%;margin-bottom:8px" onclick="closeModal();inspHide(INSP.delKey)">이번 점검에서만 삭제</button>'
    +'<button class="submit" style="width:100%;margin-bottom:6px;background:var(--dng)" onclick="closeModal();inspDeactivate(INSP.delKey)">점검표에서 삭제 (모든 캠퍼스·다음 회차부터 제외)</button>'
    +'<div class="hint" style="line-height:1.5">삭제한 항목은 화면 아래 <b>삭제한 항목</b>에서 언제든 복원할 수 있습니다.</div></div>'

function inspKeepScroll(fn){var y=window.scrollY;return Promise.resolve(fn()).then(function(){inspRenderRun();window.scrollTo({top:y});});}
function inspHide(k){
  inspKeepScroll(function(){return inspSave(k,{hidden:true,result:null,action_type:null});});
}
function inspUnhide(k){
  inspKeepScroll(function(){return inspSave(k,{hidden:false});});
}
function inspDeactivate(k){
  var it=INSP.itemById[k.split('|')[0]];if(!it)return;
  if(!confirm('「'+it.title+'」을(를) 점검표에서 삭제할까요?\n모든 캠퍼스 점검에서 빠집니다. (복원 가능, 입력된 기록은 보존)'))return;
  inspKeepScroll(function(){
    return sb.from('fac_inspection_items').update({active:false}).eq('id',it.id).then(function(r){
      if(r.error){inspToast('삭제 실패: '+r.error.message,true);return;}
      it.active=false;inspSplitItems();inspToast('점검표에서 삭제됨');
    });
  });
}
function inspReactivate(id){
  var it=INSP.itemById[id];if(!it)return;
  inspKeepScroll(function(){
    return sb.from('fac_inspection_items').update({active:true}).eq('id',it.id).then(function(r){
      if(r.error){inspToast('복원 실패: '+r.error.message,true);return;}
      it.active=true;inspSplitItems();inspToast('복원됨');
    });
  });
}
function inspDelSpace(name){
  var n=Object.keys(INSP.res).filter(function(k){var x=INSP.res[k];return x.space_name===name&&x.result;}).length;
  if(!confirm('「'+name+'」 공간을 삭제할까요?'+(n?'\n입력한 '+n+'개 항목 결과도 함께 삭제됩니다.':'')))return;
  inspKeepScroll(function(){
    return sb.from('fac_inspection_results').delete().eq('inspection_id',INSP.cur.id).eq('space_name',name).then(function(r){
      if(r.error){inspToast('삭제 실패: '+r.error.message,true);return;}
      Object.keys(INSP.res).forEach(function(k){if(INSP.res[k].space_name===name)delete INSP.res[k];});
      sb.from('fac_inspection_spaces').delete().eq('inspection_id',INSP.cur.id).eq('space_name',name).then(function(){},function(){});delete INSP.sinfo[name];
      INSP.spaces=INSP.spaces.filter(function(s){return s.name!==name;});
      inspToast('공간 삭제됨');
    });
  });
}
function inspAllOk(space){
  var rows=[],sp=INSP.spaces.filter(function(x){return x.name===space;})[0]||{};
  inspSpFor(sp.zone).forEach(function(it){
    var k=inspKey(it.id,space),x=INSP.res[k]||{};
    if(x.result||x.hidden)return;
    rows.push({inspection_id:INSP.cur.id,item_id:it.id,space_name:space,space_zone:x.space_zone||null,result:'양호',
      action_type:null,note:null,photo_paths:x.photo_paths||[],updated_by:(CURRENT_USER&&CURRENT_USER.login_id)||null,updated_at:new Date().toISOString()});
  });
  if(!rows.length){inspToast('남은 항목이 없습니다.');return;}
  var y=window.scrollY;inspSaveMany(rows).then(function(){inspRenderRun();window.scrollTo({top:y});});
}
function inspFormVals(){
  var cf=(document.getElementById('insp_confirmer')||{}).value||'',memo=(document.getElementById('insp_memo')||{}).value||'';
  return {campus_confirmer:cf.trim()||null,memo:memo.trim()||null};
}
// 임시저장: 항목 결과는 이미 자동 저장됨 → 확인자·메모만 저장하고 '진행중' 유지

function inspPickPhoto(k){INSP.photoKey={t:'res',k:k};inspOpenPicker();}
function inspPickSpacePhoto(name,zone){INSP.photoKey={t:'sp',n:name,z:zone};inspOpenPicker();}
function inspOpenPicker(){

function inspPhotoChosen(e){
  var files=[].slice.call(e.target.files||[]);var tg=INSP.photoKey;if(!files.length||!tg)return;
  var pre=tg.t==='res'?tg.k.split('|')[0]:'s';
  inspToast('사진 올리는 중... ('+files.length+'장)');
  var jobs=files.map(function(f,i){
    return fixPhotoShrink(f).then(function(blob){
      var path='insp/'+INSP.cur.id+'/'+pre+'_'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,6)+'.jpg';
      return sb.storage.from(DOC_BUCKET).upload(path,blob,{upsert:false,contentType:'image/jpeg'}).then(function(up){return up&&up.error?null:path;});
    }).catch(function(){return null;});
  });
  Promise.all(jobs).then(function(paths){
    var ok=paths.filter(Boolean);
    if(!ok.length){inspToast('사진 업로드 실패',true);return;}
    var fail=function(){if(ok.length<files.length)inspToast((files.length-ok.length)+'장 업로드 실패',true);};
    if(tg.t==='res'){
      var cur=(INSP.res[tg.k]&&INSP.res[tg.k].photo_paths)||[];
      inspSave(tg.k,{photo_paths:cur.concat(ok)}).then(function(){inspRefreshItem(tg.k);fail();});
    }else{
      var cs=(INSP.sinfo[tg.n]&&INSP.sinfo[tg.n].photo_paths)||[];
      inspSaveSpace(tg.n,tg.z,{photo_paths:cs.concat(ok)}).then(function(){inspRefreshInfo(tg.n);fail();});
    }
  });
}

function inspSetCost(id,fld,val){
  var x=(INSP.issues||[]).filter(function(r){return r.id===id;})[0];if(!x)return;
  var it=x._item||{},patch={};
  if(fld==='qty'||fld==='unit_price'){
    patch[fld]=inspNum(val);
    var q=fld==='qty'?patch.qty:x.qty,u=fld==='unit_price'?patch.unit_price:x.unit_price;
    if(u==null&&it.unit_price!=null&&q!=null){u=it.unit_price;patch.unit_price=u;}   // 단가표 기본 단가 자동 적용
    patch.est_cost=(q!=null&&u!=null)?Math.round(q*u):null;
  }else if(fld==='est_cost'){patch.est_cost=inspNum(val);}
  else{patch[fld]=String(val||'').trim()||null;}
  sb.from('fac_inspection_results').update(patch).eq('id',id).then(function(r){
    if(r.error){inspToast('저장 실패: '+r.error.message+(/action_plan|vendor|qty|unit_price|est_cost/.test(r.error.message)?' (SQL 10 실행 필요)':''),true);return;}
    Object.keys(patch).forEach(function(k){x[k]=patch[k];});

    if(box){
      if(patch.unit_price!==undefined){var ui=box.querySelector('[data-f="unit_price"]');if(ui&&document.activeElement!==ui)ui.value=x.unit_price==null?'':x.unit_price;}
      var ei=box.querySelector('[data-f="est_cost"]');if(ei&&document.activeElement!==ei){var c=inspCost(x);ei.value=c==null?'':c;}
      if(fld==='action_type'){var vi=box.querySelector('[data-f="vendor"]');if(vi)vi.placeholder=x.action_type==='외주·업체'?'업체명':'업체명 (외부 업체일 때)';}
    }
    var st=document.getElementById('insp_istat');if(st)st.innerHTML=inspIssueStatsHTML(INSP.issues);
    inspToast('저장됨');
  });
}

  var blds=[];INSP.list.forEach(function(x){var b=inspBldOf(x);if(blds.indexOf(b)<0)blds.push(b);});
  blds.sort(function(a,b){return a.localeCompare(b,'ko');});
  openModal('<div class="mb" style="padding-top:18px"><div style="font-size:14px;font-weight:600;margin-bottom:4px">점검 결과 보고서</div>'
    +'<div class="hint" style="margin-bottom:12px">'+inspH(INSP.round)+' · 점검 '+INSP.list.length+'곳</div>'
    +'<div class="lbl">범위</div><select id="rp_scope" style="width:100%;margin-bottom:10px"><option value="">전체 건물 ('+blds.length+'개)</option>'
    +blds.map(function(b){return '<option>'+inspH(b)+'</option>';}).join('')+'</select>'
    +'<div class="lbl">포함할 우선순위</div><select id="rp_pri" style="width:100%;margin-bottom:10px"><option value="5">1~5위 전체</option><option value="3">1~3위 (조기 보수까지)</option><option value="2">1~2위 (즉시·긴급만)</option></select>'
    +'<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="rp_photo" checked style="width:auto"> 현장 사진 포함 (항목당 최대 2장)</label>'
    +'<div class="hint" style="margin-top:10px;line-height:1.6">새 창에서 보고서가 열리면 <b>[PDF로 저장]</b>을 누르세요. 인쇄 창의 대상에서 <b>PDF로 저장</b>을 고르면 파일로 내려받아집니다.</div>'
    +'</div><div class="mf"><button class="mbtn" onclick="closeModal()">취소</button><button class="mbtn yes" onclick="inspReportGo()">보고서 열기</button></div>');
}
function inspReportGo(){
  var scope=(document.getElementById('rp_scope')||{}).value||'';
  var maxPri=Number((document.getElementById('rp_pri')||{}).value||5);
  var withPhoto=!!(document.getElementById('rp_photo')||{}).checked;
  closeModal();
  var w=window.open('','_blank');
  if(!w){alert('팝업이 차단되었습니다. 브라우저 주소창 옆 팝업 허용 후 다시 눌러 주세요.');return;}
  w.document.write('<meta charset="utf-8"><title>보고서 생성 중</title><p style="font-family:sans-serif;padding:40px;color:#666">보고서를 만드는 중입니다...</p>');
  var insps=INSP.list.filter(function(x){return !scope||inspBldOf(x)===scope;});
  var ids=insps.map(function(x){return x.id;});
  inspFetchAll(function(){return sb.from('fac_inspection_results').select('*').in('inspection_id',ids).in('result',['미흡','불량']);}).then(function(rows){
    var byId={};insps.forEach(function(x){byId[x.id]=x;});
    rows=rows.filter(function(x){return !x.hidden;});
    rows.forEach(function(x){x._insp=byId[x.inspection_id]||{};x._item=INSP.itemById[x.item_id]||{};x._pri=inspPri(x,x._item);});
    inspSortIssues(rows);
    var paths=[];
    if(withPhoto)rows.forEach(function(x){if(x._pri<=maxPri)(x.photo_paths||[]).slice(0,2).forEach(function(p){paths.push(p);});});
    // 설비 현황용: 개수·냉난방기 상세가 있는 결과
    var eqP=inspFetchAll(function(){return sb.from('fac_inspection_results').select('inspection_id,item_id,space_name,space_zone,cnt,detail,result').in('inspection_id',ids).not('cnt','is',null);}).catch(function(){return [];});
    // 현장 특이사항: 구역·공간별 기타 사항과 사진
    var spP=inspFetchAll(function(){return sb.from('fac_inspection_spaces').select('*').in('inspection_id',ids);}).catch(function(){return [];});
    return Promise.all([eqP,spP]).then(function(rs){
      var sps=(rs[1]||[]).filter(function(r){return (r.memo&&r.memo.trim())||(r.photo_paths||[]).length;});
      if(withPhoto)sps.forEach(function(r){(r.photo_paths||[]).slice(0,3).forEach(function(p){paths.push(p);});});
      return (paths.length?inspSignAll(paths):Promise.resolve({})).then(function(urls){
        w.document.open();w.document.write(inspReportHTML(insps,rows,scope,maxPri,urls,rs[0],sps,withPhoto));w.document.close();});
    });
  }).catch(function(e){w.document.body.innerHTML='<p style="font-family:sans-serif;padding:40px;color:#c72c22">보고서 생성 실패: '+inspH(e&&e.message||e)+'</p>';});
}
function inspSignAll(paths){
  var out={},chunks=[];for(var i=0;i<paths.length;i+=100)chunks.push(paths.slice(i,i+100));
  return Promise.all(chunks.map(function(c){
    return sb.storage.from(DOC_BUCKET).createSignedUrls(c,3600).then(function(r){((r&&r.data)||[]).forEach(function(d){if(d&&d.signedUrl)out[d.path]=d.signedUrl;});},function(){});
  })).then(function(){return out;});
}
function inspEqSummary(eq,insps){
  // 건물·층별: 소화기·피난안내도·비상용 랜턴·멀티탭·냉난방기 개수, 냉난방기 제조사·모델별 대수
  var byIns={},models={};insps.forEach(function(x){byIns[x.id]={fire:0,map:0,lamp:0,tap:0,ac:0};});
  (eq||[]).forEach(function(r){var it=INSP.itemById[r.item_id]||{},b=byIns[r.inspection_id];if(!b||r.hidden)return;var n=Number(r.cnt)||0;
    if(it.item_type==='zone'&&it.no===1)b.fire+=n;else if(it.item_type==='zone'&&it.no===2)b.map+=n;else if(it.item_type==='zone'&&it.no===3)b.lamp+=n;
    else if(it.input_kind==='ac'){b.ac+=n;(Array.isArray(r.detail)?r.detail:[]).forEach(function(a){var key=(a.maker||'제조사 미상')+'|'+(a.model||'모델 미상');models[r.inspection_id+'#'+key]=(models[r.inspection_id+'#'+key]||0)+(Number(a.count)||0);});}
    else if(it.has_count)b.tap+=n;});
  return {byIns:byIns,models:models};
}

// ---------- CSV ----------
function inspCsv(){
  var ids=INSP.list.map(function(x){return x.id;});
  if(!ids.length){alert('이 회차에 점검 기록이 없습니다.');return;}
  inspToast('CSV 만드는 중...');
  inspFetchAll(function(){return sb.from('fac_inspection_results').select('*').in('inspection_id',ids);}).then(function(rows){
    var byId={};INSP.list.forEach(function(x){byId[x.id]=x;});
    var head=['회차','건물·층','브랜드','지역','점검일','점검자','상태','유형','No','구분','구역','등급','점검항목','공간명','결과','개수','냉난방기(제조사/모델/대수)','우선순위','처리주체','업체','조치방안','수량','단위','단가','예상비용','문제내용','사진수','유지보수 접수번호'];
    var q=function(v){v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    var lines=[head.join(',')];
    rows.forEach(function(x){var ins=byId[x.inspection_id]||{},it=INSP.itemById[x.item_id]||{};
      lines.push([ins.round_name,ins.campus_label,ins.brand,ins.region,ins.inspected_at,ins.inspector_name,ins.status,
        it.item_type==='space'?'공간별':it.item_type==='zone'?'구역 설비':'점검표',it.no,it.category,x.space_zone||it.zone,it.grade,it.title,inspSpaceLabel(x.space_name),x.result,x.cnt,
        inspAcList(x).map(function(a){return [a.maker,a.model,(a.count||0)+'대'].filter(Boolean).join(' ');}).join(' / '),(x.result==='미흡'||x.result==='불량')?inspPri(x,it):'',inspActLabel(x.action_type),x.vendor,x.action_plan,x.qty,it.unit,x.unit_price,inspCost(x),x.note,(x.photo_paths||[]).length,x.request_no].map(q).join(','));});
    var blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='정기점검_'+INSP.round.replace(/\s+/g,'_')+'.csv';
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  }).catch(function(e){alert('CSV 생성 실패: '+(e&&e.message||e));});
}

function inspOnClick(e){
  var b=e.target.closest('[data-act]');if(!b||!inspRoot().contains(b))return;
  var act=b.dataset.act,v=b.dataset.v,k=b.dataset.k;
  if(b.tagName==='SELECT'||b.tagName==='TEXTAREA')return;
  if(act==='res'){
    var x=INSP.res[k]||{};var nv=(x.result===v)?null:v;   // 같은 버튼 다시 누르면 해제
    var patch={result:nv};
    if(nv!=='미흡'&&nv!=='불량'){patch.action_type=null;}
    var pr=inspSave(k,patch);   // inspSave가 화면 상태를 먼저 갱신(낙관적 반영)
    inspRefreshItem(k);
    pr.then(function(ok){if(!ok){INSP.res[k]=x;}inspRefreshItem(k);});
  }
  else if(act==='photo')inspPickPhoto(k);
  else if(act==='photodel')inspPhotoDel(k);
  else if(act==='sphoto')inspPickSpacePhoto(v,b.dataset.z);
  else if(act==='sphotodel')inspSpacePhotoDel(v);
  else if(act==='acadd'){var xa=INSP.res[k]||{},la=inspAcList(xa).slice();la.push({maker:'',model:'',count:1});INSP.res[k]=Object.assign({},xa,{detail:la});inspRefreshItem(k);var rr=document.querySelectorAll('[data-act="ac"][data-f="maker"][data-k="'+CSS.escape(k)+'"]');if(rr.length)rr[rr.length-1].focus();}
  else if(act==='acdel'){var xd=INSP.res[k]||{},ld=inspAcList(xd).slice();ld.splice(Number(b.dataset.i),1);INSP.res[k]=Object.assign({},xd,{detail:ld});inspAcSave(k).then(function(){inspRefreshItem(k);});}
  else if(act==='navtog'){var g=document.getElementById('insp_zgrid');if(g){g.hidden=!g.hidden;b.classList.toggle('open',!g.hidden);}}
  else if(act==='addspace')inspAddSpace(v);
  else if(act==='del')inspDelMenu(k);
  else if(act==='unhide')inspUnhide(k);
  else if(act==='reactivate')inspReactivate(v);
  else if(act==='delspace'){e.preventDefault();inspDelSpace(v);}
  else if(act==='allok'){e.preventDefault();inspAllOk(v);}
  else if(act==='complete')inspComplete();
  else if(act==='tempsave')inspTempSave();
  else if(act==='jump'){var zg=document.getElementById('insp_zgrid');if(zg)zg.hidden=true;var nt=document.querySelector('.insp-navtog');if(nt)nt.classList.remove('open');
    var t=document.getElementById(v);if(t){var st=document.querySelector('#insp_root .insp-sticky');var y=t.getBoundingClientRect().top+window.scrollY-(st?st.offsetHeight:0)-8;window.scrollTo({top:y,behavior:'smooth'});}}
  else if(act==='home'){inspLoadRound();window.scrollTo({top:0});}
  else if(act==='start')inspStart(v);
  else if(act==='edit')inspEdit(v);
  else if(act==='open')inspOpen(v);
  else if(act==='hist')inspLoadHist(v);
  else if(act==='issues')inspLoadIssues();
  else if(act==='toreq')inspToRequest(v);
  else if(act==='csv')inspCsv();
  else if(act==='report')inspReportOpen();
  else if(act==='pricebook')inspPriceBook();
  else if(act==='newround')inspNewRound();
  else if(act==='brand'){INSP.brand=v;inspRenderHome();}
}
function inspOnChange(e){
  var t=e.target;
  if(t.id==='insp_round'){INSP.round=t.value;inspLoadRound();return;}
  var act=t.dataset&&t.dataset.act,k=t.dataset&&t.dataset.k;
  if(act==='pri'){inspSetPri(t.dataset.v,t.value?Number(t.value):null);return;}
  if(act==='cost'){inspSetCost(t.dataset.v,t.dataset.f,t.value);return;}
  if(act==='action')inspSave(k,{action_type:t.value||null});
  else if(act==='note')inspSave(k,{note:t.value.trim()||null});
  else if(act==='cnt'){var n=String(t.value).replace(/[^\d]/g,'');inspSave(k,{cnt:n===''?null:Number(n)});}
  else if(act==='ac'){var x=INSP.res[k]||{},l=inspAcList(x).slice(),i=Number(t.dataset.i);l[i]=Object.assign({},l[i]);
    if(t.dataset.f==='count'){var c=String(t.value).replace(/[^\d]/g,'');l[i].count=c===''?null:Number(c);}else l[i][t.dataset.f]=t.value.trim();
    INSP.res[k]=Object.assign({},x,{detail:l});inspAcSave(k);}
  else if(act==='smemo'){inspSaveSpace(t.dataset.v,t.dataset.z,{memo:t.value.trim()||null});}
}

// ===== 진행/답변 알림 페이로드 =====
// Slack Workflow Builder 요구사항: 평면 구조 + 모든 값 문자열(undefined 금지)
function statusLabel(rec){
  var v=rec.st;
  if(rec.type==='voice')return v==='done'?'답변 완료':v==='prog'?'확인 중':'접수 대기';
  return v==='done'?'완료':v==='prog'?'진행중':'접수 대기';
}
function clean(v){var x=(v==null||v==='-')?'':String(v);return x.trim();}
// 진행상황 요약 — 메일 본문 + 슬랙 메시지 공용
function progressSummary(rec){
  var isVoice=(rec.type==='voice');
  var s={
    record_no  : clean(rec.rid),
    typelabel  : clean(rec.tt)||(isVoice?'건의':'접수'),
    subtype    : clean(rec.vtype)||clean(rec.req),
    title      : clean(rec.title),
    campus     : clean(rec.campus),
    building   : clean(rec.building),
    applicant  : clean(rec.applicant),
    received   : clean(rec.when),
    detail     : isVoice?clean(rec.content):clean(rec.detail),
    location   : isVoice?'':clean(rec.location),
    status     : statusLabel(rec),
    progress   : isVoice?'':clean(rec.prog),
    stage      : (function(){var l=plogRows(rec);return l.length?clean(l[l.length-1].stage):'';})(),
    stage_note : (function(){var l=plogRows(rec);return l.length?clean(l[l.length-1].note):'';})(),
    stage_step : (function(){var l=plogRows(rec);if(!l.length||isVoice)return '';var p=stageProgress(rec.type,l[l.length-1].stage);return p.i+'/'+p.n;})(),
    history    : (function(){var l=plogRows(rec);return l.map(function(e){return (e.stage||'')+' ('+(e.at||'')+'): '+(e.note||'').replace(/\n/g,' ');}).join('\n');})(),
    plan_date  : isVoice?'':clean(rec.plan),
    reply      : isVoice?clean(rec.reply):'',
    updated_by : clean(staffLabel()),
    updated_at : new Date().toISOString().slice(0,16).replace('T',' '),
    portal_url : location.origin+location.pathname
  };
  // 슬랙 변수는 빈 문자열도 허용하지만 undefined는 무음 실패 → 전 필드 문자열 보장
  Object.keys(s).forEach(function(k){ if(typeof s[k]!=='string')s[k]=String(s[k]==null?'':s[k]); });
  // 슬랙 한 줄 요약 (워크플로에서 변수 하나만 써도 되도록)
  var head=[s.campus,s.building].filter(Boolean).join(' ');
  s.headline=(s.typelabel+' · '+(head||'-')+' · '+(s.title||s.detail.slice(0,30)||'-')).slice(0,140);
  s.changed=isVoice?('답변 등록: '+(s.reply||'(내용 없음)'))
    :(s.stage?(s.stage+(s.stage_step?(' ('+s.stage_step+')'):'')+': '+(s.stage_note||'-').split('\n')[0]+(s.plan_date?(' / 처리예정 '+s.plan_date):''))
             :('진행사항: '+(s.progress||'(미입력)')));
  return s;
}
function notifyApplicant(kind,id,baseMsg,rec){
  var sm=rec?progressSummary(rec):{};
  n8nNotify({type:'progress',kind:kind,id:id,summary:sm,
    applicant_name:sm.applicant||'',record_no:sm.record_no||''}).then(function(d){
    var note=(d&&d.ok)?'<b style="color:var(--ok)">접수자'+(d.to?('('+maskEmail(d.to)+')'):'')+'에게 진행상황 알림을 발송했습니다.</b>'
      :(d&&d.error==='no_email')?'<span style="color:var(--warn)">접수자 이메일이 미등록이라 알림은 발송되지 않았습니다. (승인된 계정 목록에서 확인)</span>'
      :(d&&d.error==='n8n_url_not_set')?'<span style="color:var(--warn)">알림 채널(n8n) 연결 전이라 메일은 발송되지 않았습니다. 저장은 완료되었습니다.</span>'
      :'<span style="color:var(--dng)">알림 발송 실패'+(d&&d.error?(': '+d.error):'')+' — 저장은 완료되었습니다.</span>';
    submitDone(baseMsg+'<br><br>'+note);
  });
}
function saveVoice(i){
  var rep=document.querySelector('textarea[data-i="'+i+'"][data-f="reply"]').value;
  var rec=SAMPLE[i];
  if(SB_READY&&rec&&rec.id){
    sb.from('fac_voices').update({reply:rep||null,status:rep?'done':'prog'}).eq('id',rec.id).then(function(res){
      if(res.error){submitDone('저장 오류: '+res.error.message);return;}
      rec.reply=rep||'-';rec.st=rep?'done':'prog';
      notifyApplicant('voice',rec.id,'답변이 등록되었습니다.',rec);
    });
  } else { rec.reply=rep||'-';rec.st=rep?'done':'prog';submitDone('답변이 반영되었습니다.'); }
}
function saveAdmin(i){
  var rec=SAMPLE[i]; if(!rec)return;
  var planEl=document.querySelector('input[data-i="'+i+'"][data-f="plan"]');
  var stEl=document.querySelector('select[data-i="'+i+'"][data-f="stage"]');
  var noteEl=document.querySelector('textarea[data-i="'+i+'"][data-f="note"]');
  var plan=planEl?planEl.value:'';
  var stage=stEl?stEl.value:stagesOf(rec.type)[0];
  var note=noteEl?(noteEl.value||'').trim():'';
  if(!note){submitDone('진행 내용을 입력해 주세요. 무엇이 진행됐는지 한 줄이라도 남겨야 접수자가 알 수 있습니다.');return;}
  var log=plogRows(rec).concat([{
    n:plogRows(rec).length+1, stage:stage, note:note,
    by:staffLabel(), at:new Date().toISOString().slice(0,10)
  }]);
  var st=stageStatus(rec.type,stage);
  var progText=stage+' · '+note.split('\n')[0].slice(0,80);
  var doneNote=(st==='done')?'완료':'진행중';
  if(SB_READY&&rec.id){
    sb.from('fac_requests').update({plan_date:plan||null,progress:progText,progress_log:log,status:st,done_note:doneNote}).eq('id',rec.id).then(function(res){
      if(res.error){submitDone('저장 오류: '+res.error.message);return;}
      rec.plan=plan||'-';rec.prog=progText;rec.plog=log;rec.done=doneNote;rec.st=st;
      notifyApplicant('request',rec.id,'<b>'+esc(stage)+'</b> 단계가 추가되었습니다.',rec);
      if(document.getElementById('adm_rows')){var el=document.getElementById('view');el.innerHTML=adminHTML();bindAdmin();}
    });
  } else {
    rec.plan=plan||'-';rec.prog=progText;rec.plog=log;rec.done=doneNote;rec.st=st;
    submitDone('진행이 추가되었습니다.');
  }
}

var __delIdx=null;
function askDelete(i){
  var r=SAMPLE[i];if(!r)return;__delIdx=i;
  var label=(r.type==='voice')?'건의':(r.tt||'접수');
  openModal('<div class="mh" style="color:var(--dng)">접수 내역 삭제</div><div class="mb">'
    +'<div class="mrow"><span class="mk">구분</span><span class="mv">'+esc(label)+'</span></div>'
    +'<div class="mrow"><span class="mk">접수번호</span><span class="mv">'+esc(r.rid||'')+'</span></div>'
    +'<div class="mrow"><span class="mk">제목</span><span class="mv">'+esc(r.title||'')+'</span></div>'

    +'</div><div class="mf"><button class="mbtn no" onclick="closeModal()">취소</button><button class="mbtn yes" style="background:var(--dng);border-color:var(--dng)" onclick="doDelete()">삭제</button></div>');
}
function doDelete(){
  var i=__delIdx;if(i==null){closeModal();return;}
  var r=SAMPLE[i];if(!r){closeModal();return;}
  if(!(SB_READY&&r.id)){SAMPLE.splice(i,1);closeModal();render('admin');return;}
  var table=(r.type==='voice')?'fac_voices':'fac_requests';
  sb.from(table).delete().eq('id',r.id).then(function(res){
    if(res.error){submitDone('삭제 오류: '+res.error.message);return;}
    closeModal();
    // 관리자 화면 데이터 재로드
    if(CURRENT_USER&&CURRENT_USER.role==='admin'&&SB_READY){
      Promise.all([sb.from('fac_requests').select('*').order('created_at',{ascending:false}).limit(200),sb.from('fac_voices').select('*').order('created_at',{ascending:false}).limit(200)]).then(function(rs){var reqs=(rs[0]&&rs[0].data)||[];var voices=(rs[1]&&rs[1].data)||[];SAMPLE=reqs.map(mapReq).concat(voices.map(mapVoice));var el=document.getElementById('view');el.innerHTML=adminHTML();bindAdmin();submitDone('삭제되었습니다.');});
    } else { render('admin'); }
  });
}

/* ===================== 명절선물 명단 취합 ===================== */
var GIFT={ev:null,evs:[],opts:[],rows:[],teams:[],meta:null,q:'',flt:'',busy:false,loaded:false};

function giftMyCampus(){ return (GIFT.meta&&GIFT.meta.campus)||''; }
// 본인 관 + 겸임 관 전체 — 건물·층 검증에 사용 (여러 관 인원을 한 번에 취합해 올리기 위함)
function giftMyCampusAll(){
  var a=(GIFT.meta&&GIFT.meta.all)||[];
  var c=giftMyCampus(), out=[];
  (Array.isArray(a)?a:[]).forEach(function(x){if(x&&out.indexOf(x)<0)out.push(String(x));});
  if(c&&out.indexOf(c)<0)out.push(String(c));
  return out.length?out:[c];
}
function giftIsHQ(){ return !!(GIFT.meta&&GIFT.meta.team_required); }
function giftMyTeam(){ return (GIFT.meta&&GIFT.meta.hq_team)||''; }
function giftLocked(){
  if(!GIFT.ev)return true;
  if(CURRENT_USER&&CURRENT_USER.role==='admin')return false;
  if(GIFT.ev.status!=='open')return true;
  return new Date(GIFT.ev.deadline).getTime() < Date.now();
}
function giftDday(){
  if(!GIFT.ev)return '';
  var d=Math.ceil((new Date(GIFT.ev.deadline).getTime()-Date.now())/86400000);
  return d>0?('D-'+d):(d===0?'오늘 마감':'마감됨');
}
function giftPhoneFmt(v){
  var n=String(v||'').replace(/\D/g,'').slice(0,11);
  if(n.length<4)return n;
  if(n.length<8)return n.slice(0,3)+'-'+n.slice(3);
  return n.slice(0,3)+'-'+n.slice(3,n.length-4)+'-'+n.slice(n.length-4);
}
function giftOptName(c){
  var o=GIFT.opts.filter(function(x){return x.code===c;})[0];
  return o?(o.code+' · '+o.name):(c||'');
}
function giftRowIncomplete(r){
  if(r.dup_of)return !r.building_name||!r.floor_no||!r.person_name||!r.address||!/^01[0-9]-[0-9]{3,4}-[0-9]{4}$/.test(r.phone||'');
  return !r.building_name||!r.floor_no||!r.person_name||!r.address||!r.option_code
      || !/^01[0-9]-[0-9]{3,4}-[0-9]{4}$/.test(r.phone||'');
}

function giftHTML(){
  return '<div class="secttl">명절선물 명단</div>'
    +'<div id="gift_head"></div>'
    +'<div id="gift_body"><div class="hint" style="padding:30px;text-align:center">불러오는 중...</div></div>';
}

function bindGift(){
  if(!SB_READY){document.getElementById('gift_body').innerHTML='<div class="hint" style="padding:14px">서버 연결 없음</div>';return;}
  GIFT.loaded=false;
  Promise.all([
    sb.from('fac_gift_events').select('*').order('year',{ascending:false}).order('season',{ascending:false}),
    sb.rpc('fac_my_campuses'),
    sb.rpc('fac_my_hq_team')
  ]).then(function(r){
    GIFT.evs=((r[0]&&r[0].data)||[]);
    var mine=((r[1]&&r[1].data)||[]);
    var team=(r[2]&&r[2].data)||'';
    if(!giftIsAdmin())GIFT.evs=GIFT.evs.filter(function(e){return e.status!=='draft';});
    var open=GIFT.evs.filter(function(e){return e.status==='open';})[0]
           ||GIFT.evs.filter(function(e){return e.status==='closed';})[0]
           ||GIFT.evs[0]||null;
    GIFT.ev=open;
    GIFT.meta={campus:mine[0]||'',all:mine,hq_team:team,team_required:false};
    if(!giftIsAdmin()&&(!GIFT.ev||GIFT.ev.status==='draft')){giftNotReady();return;}
    if(!GIFT.meta.campus){
      if(CURRENT_USER&&CURRENT_USER.role==='admin'){GIFT.mode='admin';GIFT.meta.noCampus=true;gadmLoad();return;}
      giftNoCampus();return;}
    return sb.from('fac_org_view').select('*').eq('campus_code',GIFT.meta.campus).limit(1).then(function(o){
      var u=((o.data)||[])[0]||{};
      GIFT.meta.team_required=!!u.team_required;
      GIFT.meta.region=u.region;GIFT.meta.label=u.campus_label;GIFT.meta.division=u.division;
      if(giftIsHQ()&&!team){
        if(CURRENT_USER&&CURRENT_USER.role==='admin'){GIFT.mode='admin';GIFT.meta.noTeam=true;gadmLoad();return;}
        giftNoTeam();return;}
      return giftLoadRows();
    });
  }).catch(function(e){
    document.getElementById('gift_body').innerHTML='<div class="hint" style="padding:14px;color:var(--dng)">불러오기 오류: '+docEsc(String(e&&e.message||e))+'</div>';
  });
}
function giftNotReady(){
  var h=document.getElementById('gift_head'), b=document.getElementById('gift_body');
  if(h)h.innerHTML='';
  if(!b)return;
  var ev=GIFT.ev;
  b.innerHTML='<div style="border:1px solid var(--line);border-radius:14px;padding:38px 24px;text-align:center">'
    +'<div style="font-size:32px;margin-bottom:10px">🎁</div>'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:7px">명절선물 명단 접수 준비 중입니다</div>'
    +'<div class="hint" style="line-height:1.75;font-size:12.5px">'
    +(ev?('<b>'+docEsc(ev.title)+'</b><br>'):'')
    +'상품 구성이 확정되면 접수를 시작합니다.<br>접수가 열리면 별도로 안내드립니다.</div>'
    +'</div>';
}
function giftNoCampus(){
  document.getElementById('gift_head').innerHTML='';
  document.getElementById('gift_body').innerHTML='<div class="hint" style="padding:18px;border:1px solid var(--warnln);background:var(--warnbg);border-radius:10px;color:var(--warn)">'
    +'<b>담당 관이 지정되지 않았습니다.</b><br>계정에 관코드가 없어 명단을 입력할 수 없습니다. 총무기획팀에 문의해 주세요.</div>';
}
function giftNoTeam(){
  document.getElementById('gift_head').innerHTML='';
  document.getElementById('gift_body').innerHTML='<div class="hint" style="padding:18px;border:1px solid var(--warnln);background:var(--warnbg);border-radius:10px;color:var(--warn)">'
    +'<b>소속팀이 지정되지 않았습니다.</b><br>본사 계정은 소속팀이 지정되어야 명단을 입력할 수 있습니다. 총무기획팀에 문의해 주세요.</div>';
}

function giftLoadRows(){
  if(!GIFT.ev){document.getElementById('gift_body').innerHTML='<div class="hint" style="padding:18px">진행 중인 회차가 없습니다.</div>';return;}
  var q=sb.from('fac_gift_entries').select('*').eq('event_id',GIFT.ev.id).eq('campus_code',giftMyCampus());
  if(giftIsHQ())q=q.eq('team_name',giftMyTeam());
  return Promise.all([
    q.order('created_at',{ascending:true}),
    sb.from('fac_gift_options').select('*').eq('event_id',GIFT.ev.id).order('sort_no',{ascending:true}),
    sb.from('fac_campus_buildings').select('building').in('gwan_code',giftMyCampusAll()),
    sb.from('fac_campus_floors').select('building,floor').in('gwan_code',giftMyCampusAll())
  ]).then(function(r){
    GIFT.rows=((r[0]&&r[0].data)||[]);
    GIFT.optsAll=((r[1]&&r[1].data)||[]);
    GIFT.opts=GIFT.optsAll.filter(function(o){return !o.sold_out;});
    var _bs={}; GIFT.blds=[];
    ((r[2]&&r[2].data)||[]).forEach(function(x){if(x.building&&!_bs[x.building]){_bs[x.building]=1;GIFT.blds.push(x.building);}});
    GIFT.blds.sort();
    GIFT.flrs=((r[3]&&r[3].data)||[]);
    GIFT.loaded=true;
    giftRender();
  });
}

function giftRender(){
  if(giftIsAdmin()&&GIFT.mode==='admin'){gadmLoad();return;}
  giftRenderHead();
  var box=document.getElementById('gift_body');if(!box)return;
  if(!GIFT.rows.length){
    box.innerHTML=giftModeBar()+giftOptCards()+giftToolbar()
      +'<div class="hint" style="padding:26px;border:1px dashed var(--line);border-radius:10px;text-align:center;margin-top:10px">'
      +'아직 등록된 명단이 없습니다.<br><span style="font-size:12px">아래 <b>행 추가</b> 또는 <b>엑셀 업로드</b>로 시작하세요.</span></div>'
      +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
      +'<button class="flt" onclick="giftAddRow()"'+(giftLocked()?' disabled':'')+'>+ 행 추가</button></div>';
    giftBind();return;
  }
  var rows=giftFiltered();
  var dup=GIFT.rows.filter(function(r){return r.dup_of;}).length;
  var inc=GIFT.rows.filter(giftRowIncomplete).length;
  var sub=GIFT.rows.filter(function(r){return r.submit_status==='submitted';}).length;
  var stat='<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0">'
    +giftStat('전체',GIFT.rows.length,'')
    +giftStat('제출완료',sub,'ok')
    +giftStat('중복',dup,dup?'warn':'')
    +giftStat('미완성',inc,inc?'dng':'')
    +'</div>';
  var fname=GIFT.flt==='dup'?'중복만':(GIFT.flt==='inc'?'미완성만':'');
  var fq=(GIFT.q||'').trim();
  var tags=[];
  if(fname)tags.push('<b>'+fname+'</b>');
  if(fq)tags.push('검색 <b>'+docEsc(fq)+'</b>');
  var note=(rows.length!==GIFT.rows.length||tags.length)
    ?'<div class="hint" style="margin-bottom:8px">'+(tags.length?(tags.join(' · ')+' · '):'')
      +GIFT.rows.length+'명 중 <b>'+rows.length+'명</b> 표시 중'
      +' <button class="flt" style="padding:2px 8px;font-size:11px" onclick="giftClearFilter()">전체 보기</button></div>':'';
  var empty=(!rows.length)?giftEmptyResult():'';
  box.innerHTML=giftModeBar()+giftOptCards()+giftToolbar()+stat+note+(empty||('<div style="border:1px solid var(--line);border-radius:12px;overflow:hidden">'
    +giftHead()+rows.map(giftRowHTML).join('')+'</div>'))
    +'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
    +'<button class="flt" onclick="giftAddRow()"'+(giftLocked()?' disabled':'')+'>+ 행 추가</button>'
    +'<div style="flex:1"></div>'
    +'<button class="mbtn yes" onclick="giftSubmitAll()"'+(giftLocked()?' disabled':'')+' style="padding:9px 20px">명단 제출</button></div>';
  giftBind();
}
function giftStat(t,n,tone){
  var c=tone==='ok'?'var(--ok,#0a7)':tone==='warn'?'var(--warn)':tone==='dng'?'var(--dng)':'var(--ink,#111)';
  return '<div style="border:1px solid var(--line);border-radius:10px;padding:9px 12px">'
    +'<div style="font-size:11px;color:var(--mute)">'+t+'</div>'
    +'<div style="font-size:19px;font-weight:600;color:'+c+'">'+n+'</div></div>';
}
function giftRenderHead(){
  var h=document.getElementById('gift_head');if(!h)return;
  if(!GIFT.ev){h.innerHTML='';return;}
  var lock=giftLocked();
  var sel=GIFT.evs.length>1?('<select id="gift_ev" style="padding:6px 9px;font-size:12px;border:1px solid var(--line);border-radius:8px">'
    +GIFT.evs.map(function(e){return '<option value="'+e.id+'"'+(e.id===GIFT.ev.id?' selected':'')+'>'+docEsc(e.title)+'</option>';}).join('')+'</select>'):('<b>'+docEsc(GIFT.ev.title)+'</b>');
  h.innerHTML='<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px">'
    +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+sel
    +'<span style="font-size:11px;padding:2px 8px;border-radius:6px;background:'+(lock?'var(--warnbg)':'var(--okbg,#eaf7f0)')+';color:'+(lock?'var(--warn)':'var(--ok,#0a7)')+'">'+(lock?'마감':'접수중')+'</span>'
    +'<span style="font-size:12px;color:var(--mute)">마감 '+String(GIFT.ev.deadline).slice(0,10)+' · '+giftDday()+'</span></div>'
    +'<div style="font-size:12.5px;color:var(--mute);margin-top:6px">'
    +docEsc(giftMyCampus())+' · '+docEsc(giftIsHQ()?giftMyTeam():(GIFT.meta.label||''))
    +(GIFT.ev.notice?(' · '+docEsc(GIFT.ev.notice)):'')+'</div>'
    +(lock?'<div class="hint" style="margin-top:8px;color:var(--warn)">마감되어 수정할 수 없습니다.</div>':'')

}
function giftToolbar(){

    +'<input id="gift_q" value="'+docEsc(GIFT.q)+'" placeholder="이름 또는 연락처 뒷자리 검색" style="flex:1;min-width:200px;padding:7px 11px;font-size:12.5px;border:1px solid var(--line);border-radius:9px">'
    +'<button class="flt'+(GIFT.flt==='dup'?' on':'')+'" onclick="giftSetFilter(\'dup\')" style="padding:6px 11px;font-size:12px">중복만</button>'
    +'<button class="flt'+(GIFT.flt==='inc'?' on':'')+'" onclick="giftSetFilter(\'inc\')" style="padding:6px 11px;font-size:12px">미완성만</button>'
    +'<button class="flt" onclick="giftUploadOpen()" style="padding:6px 11px;font-size:12px"'+(lock?' disabled':'')+'>엑셀 업로드</button>'

}
// 총무기획팀(관리자)만 수량 직접 입력 가능 — 관계사 발주 등 1개 외 수량 대응

  : '0.8fr 0.5fr 0.75fr 0.6fr 1.5fr 0.85fr 0.9fr 0.55fr 0.5fr';}
function giftHead(){
  return '<div style="display:grid;grid-template-columns:'+giftCols()+';gap:8px;padding:8px 11px;font-size:11.5px;font-weight:600;color:var(--mute);border-bottom:1px solid var(--line)">'
    +'<div>건물명</div><div>층수</div><div>성함</div><div>직책</div><div>배송주소</div><div>연락처</div><div>옵션</div><div>수령</div>'
    +(giftQtyOn()?'<div>수량</div>':'')+'<div></div></div>';
}
function giftRowHTML(r){
  var lock=giftLocked(), i=r.id;
  var dup=!!r.dup_of, bad=giftRowIncomplete(r);
  var bg=dup?'var(--warnbg)':(bad?'#fff7f7':'#fff');
  var d=function(f,v,ph,w){
    return '<input data-g="'+f+'" data-id="'+i+'" value="'+docEsc(v||'')+'" placeholder="'+ph+'"'+(lock?' disabled':'')
      +' style="width:100%;padding:5px 7px;font-size:12px;border:1px solid var(--line);border-radius:7px;background:transparent">';
  };
  var bldOpts='<option value="">선택</option>'+(GIFT.blds||[]).map(function(b){
    return '<option value="'+docEsc(b)+'"'+(b===r.building_name?' selected':'')+'>'+docEsc(b)+'</option>';}).join('');
  var flOpts='<option value="">선택</option>'+(GIFT.flrs||[]).filter(function(f){return f.building===r.building_name;}).map(function(f){
    return '<option value="'+docEsc(f.floor)+'"'+(f.floor===r.floor_no?' selected':'')+'>'+docEsc(f.floor)+'</option>';}).join('');
  var optSel=dup
    ? '<div style="font-size:11px;color:var(--mute);padding:5px 2px">중복 · 수량 0</div>'
    : '<select data-g="option_code" data-id="'+i+'"'+(lock?' disabled':'')+' style="width:100%;padding:5px 6px;font-size:11.5px;border:1px solid var(--line);border-radius:7px"><option value="">선택</option>'
      +GIFT.opts.map(function(o){return '<option value="'+docEsc(o.code)+'"'+(o.code===r.option_code?' selected':'')+'>'+docEsc(o.code+' · '+o.name)+'</option>';}).join('')+'</select>';
  var pick='<select data-g="pickup_type" data-id="'+i+'"'+(lock?' disabled':'')+' style="width:100%;padding:5px 6px;font-size:11.5px;border:1px solid var(--line);border-radius:7px">'
    +'<option value="home"'+(r.pickup_type==='home'?' selected':'')+'>자택</option>'
    +'<option value="campus"'+(r.pickup_type==='campus'?' selected':'')+'>학원</option></select>';
  var badge=dup?'<span style="font-size:10px;padding:1px 5px;border-radius:5px;background:var(--warn);color:#fff;margin-left:4px">중복</span>':'';
  var act=dup?'<button class="flt" style="padding:3px 7px;font-size:10.5px" onclick="giftDupOpen(\''+i+'\')">상세</button>'
             :'<button class="flt" style="padding:3px 7px;font-size:10.5px" onclick="giftDelRow(\''+i+'\')"'+(lock?' disabled':'')+'>삭제</button>';
  var qtyCell=dup
    ? '<div style="font-size:11px;color:var(--mute);text-align:center">0</div>'
    : '<input type="number" min="0" step="1" data-g="qty" data-id="'+i+'" value="'+(r.qty==null?1:r.qty)+'"'+(lock?' disabled':'')
      +' style="width:100%;padding:5px 4px;font-size:12px;text-align:center;border:1px solid var(--line);border-radius:7px;background:transparent">';
  return '<div data-grow="'+i+'" style="display:grid;grid-template-columns:'+giftCols()+';gap:8px;padding:7px 11px;font-size:12px;border-bottom:1px solid var(--line);align-items:center;background:'+bg+'">'
    +'<div><select data-g="building_name" data-id="'+i+'"'+(lock?' disabled':'')+' style="width:100%;padding:5px 6px;font-size:11.5px;border:1px solid var(--line);border-radius:7px">'+bldOpts+'</select></div>'
    +'<div><select data-g="floor_no" data-id="'+i+'"'+(lock?' disabled':'')+' style="width:100%;padding:5px 6px;font-size:11.5px;border:1px solid var(--line);border-radius:7px">'+flOpts+'</select></div>'
