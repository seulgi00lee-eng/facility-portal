    +'<div>'+d('phone',r.phone,'010-0000-0000')+'</div>'
    +'<div>'+optSel+'</div>'
    +'<div>'+pick+'</div>'
    +(giftQtyOn()?('<div>'+qtyCell+'</div>'):'')
    +'<div>'+act+'</div></div>';
}
function giftEmptyResult(){
  var q=(GIFT.q||'').trim();
  if(!q){
    var fn=GIFT.flt==='dup'?'중복으로 판정된 행':(GIFT.flt==='inc'?'미완성 행':'해당하는 행');
    return '<div class="hint" style="padding:22px;border:1px dashed var(--line);border-radius:10px;text-align:center;line-height:1.7">'
      +fn+'이 없습니다.'+(GIFT.flt?'<br><button class="flt" style="margin-top:8px;padding:4px 12px;font-size:11.5px" onclick="giftClearFilter()">필터 해제</button>':'')+'</div>';
  }
  var isName=!/\d/.test(q);
  return '<div class="hint" style="padding:22px;border:1px dashed var(--line);border-radius:10px;text-align:center;line-height:1.7">'
    +'<b>'+docEsc(q)+'</b> 검색 결과가 없습니다.<br>'
    +(isName&&!giftLocked()?'<button class="flt" style="margin-top:8px" onclick="giftAddRow(\''+docEsc(q).replace(/'/g,"")+'\')">이 이름으로 행 추가</button>':'')
    +'</div>';
}
function giftFiltered(){
  var q=(GIFT.q||'').trim();
  var nk=q.replace(/\s/g,'').toLowerCase(), pk=q.replace(/\D/g,'');
  return GIFT.rows.filter(function(r){
    if(GIFT.flt==='dup'&&!r.dup_of)return false;
    if(GIFT.flt==='inc'&&!giftRowIncomplete(r))return false;
    if(!q)return true;
    if(pk&&String(r.phone||'').replace(/\D/g,'').indexOf(pk)>=0)return true;
    if(nk&&String(r.person_name||'').replace(/\s/g,'').toLowerCase().indexOf(nk)>=0)return true;
    return false;
  });
}
function giftSetFilter(f){GIFT.flt=(GIFT.flt===f)?'':f;giftRender();}
function giftClearFilter(){GIFT.q='';GIFT.flt='';giftRender();}

function giftBind(){
  var q=document.getElementById('gift_q');
  if(q){
    q.addEventListener('input',function(){
      clearTimeout(GIFT._t);GIFT._t=setTimeout(function(){GIFT.q=q.value;giftRender();
        var n=document.getElementById('gift_q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}},260);
    });
  }
  var ev=document.getElementById('gift_ev');
  if(ev)ev.addEventListener('change',function(){
    GIFT.ev=GIFT.evs.filter(function(e){return e.id===ev.value;})[0];GIFT.q='';GIFT.flt='';giftLoadRows();});
  document.querySelectorAll('[data-g]').forEach(function(el){
    var ev2=(el.tagName==='SELECT')?'change':'blur';
    el.addEventListener(ev2,function(){giftSave(el.dataset.id,el.dataset.g,el.value,el);});
    if(el.dataset.g==='phone')el.addEventListener('input',function(){el.value=giftPhoneFmt(el.value);});
  });
}
function giftSave(id,field,val,el){
  var r=GIFT.rows.filter(function(x){return x.id===id;})[0];if(!r)return;
  if(field==='phone')val=giftPhoneFmt(val);
  if(field==='qty'){                       // 수량은 숫자 컬럼 — 정수로 변환 후 저장
    var q=parseInt(val,10);
    if(isNaN(q)||q<0)q=1;
    if(q>999)q=999;
    if(el&&String(el.value)!==String(q))el.value=q;
    if(Number(r.qty)===q)return;
    var patchQ={qty:q};
    if(el)el.style.borderColor='var(--blue)';
    sb.from('fac_gift_entries').update(patchQ).eq('id',id).select().then(function(res){
      if(res.error){if(el)el.style.borderColor='var(--dng)';submitDone('저장 오류: '+res.error.message);return;}
      var nr2=(res.data||[])[0];
      if(nr2){var ix=GIFT.rows.map(function(x){return x.id;}).indexOf(id);if(ix>=0)GIFT.rows[ix]=nr2;}
      if(el)el.style.borderColor='var(--okln)';
      giftRender();                        // 합계 즉시 반영
    });
    return;
  }
  if(String(r[field]||'')===String(val||''))return;
  var patch={};patch[field]=val||null;
  if(field==='building_name')patch.floor_no=null;
  if(el){el.style.borderColor='var(--blue)';}
  sb.from('fac_gift_entries').update(patch).eq('id',id).select().then(function(res){
    if(res.error){if(el){el.style.borderColor='var(--dng)';}submitDone('저장 오류: '+res.error.message);return;}
    var nr=(res.data||[])[0];
    if(nr){var idx=GIFT.rows.map(function(x){return x.id;}).indexOf(id);if(idx>=0)GIFT.rows[idx]=nr;}
    var wasDup=r.dup_of, isDup=nr&&nr.dup_of;
    if(el&&!(field==='building_name')){el.style.borderColor='var(--okln)';}
    if((!wasDup&&isDup)||(wasDup&&!isDup)||field==='building_name'){giftRender();if(isDup&&!wasDup)giftDupOpen(id);}
  });
}

function giftSubmitGo(){
  var ok=document.getElementById('gs_ok');if(!ok||GIFT.busy)return;
  GIFT.busy=true;ok.disabled=true;
  var ids=GIFT.rows.map(function(r){return r.id;});
  var total=ids.length, SIZE=5, done=0, failed=null;

  // 한 번에 전부 업데이트하면 중복검사 트리거 때문에 DB 제한시간(timeout)을 넘김
  // → 10건씩 나눠 순차 처리 (간헐적 제출 오류의 원인 해결)
  function step(i){
    if(failed||i>=total){ finish(); return; }
    var part=ids.slice(i,i+SIZE);
    ok.textContent='제출 중... '+Math.min(i+SIZE,total)+'/'+total;
    sb.from('fac_gift_entries').update({submit_status:'submitted'}).in('id',part).then(function(res){
      if(res.error){ failed=res.error; finish(); return; }
      done+=part.length;
      setTimeout(function(){step(i+SIZE);},120);   // DB 부하 완화
    }).catch(function(e){ failed=e; finish(); });
  }
  function finish(){
    GIFT.busy=false;
    if(failed){
      ok.disabled=false;ok.textContent='제출';
      var m=(failed.message||String(failed));
      var friendly=/timeout/i.test(m)
        ? '서버 응답이 지연되어 제출이 중단되었습니다.<br><span class="hint">'+done+'/'+total+'명까지는 저장되었습니다. 잠시 후 <b>다시 제출</b>을 눌러주세요. (이미 저장된 인원은 중복되지 않습니다)</span>'
        : '제출 오류: '+docEsc(m);
      submitDone(friendly);
      giftLoadRows();
      return;
    }
    closeModal();
    var qty=GIFT.rows.filter(function(r){return !r.dup_of;}).length;
    giftSubmitNotify(qty);
    submitDone('<b>제출 완료</b><br>'+docEsc(giftMyCampus())+' · '+GIFT.rows.length+'명 (발주 '+qty+'개)<br><span class="hint">마감 전까지 수정할 수 있습니다.</span>');
    giftLoadRows();
  }
  step(0);
}

      total:s.total,submitted:s.submitted,draft:s.draft,dup:s.dup_rows,qty:s.order_qty,at:s.last_submitted_at};

  var units=Object.keys(byKey).map(function(k){return byKey[k];});

function gadmDupRescanBtn(){

    +'<span class="hint">이름·연락처를 나중에 수정한 경우 중복이 자동 표시되지 않을 수 있습니다.</span>'
    +'<button class="flt" style="padding:6px 12px;white-space:nowrap" onclick="gadmDupRescan()">중복 재검사</button></div>';
}
function gadmDupRescan(){
  if(!giftIsAdmin())return;
  var eid=GIFT.ev&&GIFT.ev.id; if(!eid)return;
  openModal('<div class="mh">중복 재검사</div><div class="mb"><div class="hint" style="padding:14px;text-align:center">명단 전체를 다시 검사하는 중...</div></div>');
  sb.from('fac_gift_entries').select('id,person_name,phone,dup_ignore,dup_of,created_at')
    .eq('event_id',eid).then(function(res){
    var box=document.querySelector('.mb');
    if(res.error){if(box)box.innerHTML='<div class="hint" style="color:var(--dng)">조회 실패: '+docEsc(res.error.message)+'</div>';return;}
    var rows=(res.data||[]).filter(function(r){return !r.dup_ignore;});
    var norm=function(v){return String(v||'').toLowerCase().replace(/\s/g,'');};
    var dig =function(v){return String(v||'').replace(/\D/g,'');};
    rows.sort(function(a,b){return String(a.created_at||'').localeCompare(String(b.created_at||''));});
    var first={}, todo=[];
    rows.forEach(function(r){
      var nk=norm(r.person_name), pk=dig(r.phone);
      if(!nk||pk.length<10)return;
      var key=nk+'|'+pk;
      if(!first[key]){first[key]=r.id;return;}
      if(r.dup_of!==first[key])todo.push({id:r.id,org:first[key]});
    });
    if(!todo.length){
      closeModal();
      submitDone('중복 재검사 완료.<br><span class="hint">새로 발견된 중복이 없습니다.</span>');
      return;
    }
    var i=0, okN=0, err=null;
    function step(){
      if(err||i>=todo.length){done();return;}
      var t=todo[i];
      var b=document.querySelector('.mb');
      if(b)b.innerHTML='<div class="hint" style="padding:14px;text-align:center">중복 표시 중... '+(i+1)+'/'+todo.length+'</div>';
      sb.from('fac_gift_entries').update({dup_of:t.org,qty:0,option_code:null}).eq('id',t.id).then(function(r2){
        if(r2.error){err=r2.error;done();return;}
        okN++;i++;setTimeout(step,120);
      }).catch(function(e){err=e;done();});
    }
    function done(){

function gadmDownload(kind){

      ['배송주소','address'],['연락처','phone'],['옵션','option_code'],['상품명','option_name'],
      ['수량','qty'],['수령방법','pickup_type'],['비고','note']];
    else if(kind==='plan')map=[['유형','ship_type'],['배송처','ship_to'],['주소','address'],
      ['옵션','option_code'],['상품명','option_name'],['수량','qty'],['대상자','members']];
    else map=[['관코드','campus_code'],['사업부','division'],['지역','region'],['소속','team_name'],
      ['인원','total'],['제출','submitted'],['작성중','draft'],['중복','dup_rows'],
      ['발주수량','order_qty'],['최종제출','last_submitted_at']];
    giftCsv(rows,map,title+'_'+({order:'발주명단',plan:'배송계획',status:'제출현황'}[kind]));
  }).catch(function(e){GADM.busy=false;submitDone('오류: '+String(e&&e.message||e));});
}
function giftCsv(rows,map,fname){
  var esc=function(v){
    if(v==null)v='';
    v=String(v);
    if(v==='home')v='자택';else if(v==='campus')v='학원';
    return '"'+v.replace(/"/g,'""')+'"';
  };
  var csv=map.map(function(m){return esc(m[0]);}).join(',')+'\r\n'
    +rows.map(function(r){return map.map(function(m){return esc(r[m[1]]);}).join(',');}).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=fname+'.csv';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},600);
}

function gupRead(file){
  if(!file)return;
  var prev=document.getElementById('gup_prev');
  prev.innerHTML='<div class="hint">읽는 중...</div>';
  gupLib(function(){
    var fr=new FileReader();
    fr.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
        gupParse(aoa);
      }catch(err){prev.innerHTML='<div class="hint" style="color:var(--dng)">파일을 읽을 수 없습니다: '+docEsc(String(err&&err.message||err))+'</div>';}
    };
    fr.readAsArrayBuffer(file);
  });
}
function gupParse(aoa){
  var prev=document.getElementById('gup_prev'), ok=document.getElementById('gup_ok');
  GUP.rows=[];GUP.errs=[];
  if(!aoa||aoa.length<2){prev.innerHTML='<div class="hint" style="color:var(--dng)">데이터가 없습니다.</div>';ok.disabled=true;return;}
  // 헤더 매핑 (이름 기준, * 및 공백 제거)
  var head=(aoa[0]||[]).map(function(h){return String(h||'').replace(/\*/g,'').replace(/\s/g,'');});
  var idx={};
  GUP_COLS.forEach(function(c){idx[c[1]]=head.indexOf(c[0].replace(/\s/g,''));});
  var miss=GUP_COLS.filter(function(c){return c[2]&&idx[c[1]]<0;}).map(function(c){return c[0];});
  if(miss.length){
    prev.innerHTML='<div class="hint" style="color:var(--dng);line-height:1.7"><b>헤더를 찾을 수 없습니다:</b> '+docEsc(miss.join(', '))
      +'<br>양식을 내려받아 헤더 그대로 사용해 주세요.</div>';ok.disabled=true;return;}
  var optCodes=GIFT.opts.map(function(o){return o.code;});
  var blds=GIFT.blds||[], flrs=GIFT.flrs||[];
  for(var i=1;i<aoa.length;i++){
    var r=aoa[i]||[];
    var get=function(k){var j=idx[k];return j>=0?String(r[j]||'').trim():'';};
    if(!get('person_name')&&!get('phone')&&!get('address'))continue; // 빈 행
    var e=[], o={};
    o.building_name=get('building_name');
    o.floor_no=get('floor_no');
    o.person_name=get('person_name');
    o.job_title=get('job_title')||null;
    o.address=get('address');
    o.phone=giftPhoneFmt(get('phone'));
    o.option_code=get('option_code').toUpperCase();
    o.note=get('note')||null;
    var pk=get('pickup_type');
    o.pickup_type=(pk==='학원'||pk==='campus')?'campus':'home';

    if(!o.person_name)e.push('성함 누락');
    if(!o.building_name)e.push('건물명 누락');
    else if(blds.indexOf(o.building_name)<0)e.push('등록되지 않은 건물: '+o.building_name);
    if(!o.floor_no)e.push('층수 누락');
    else if(o.building_name&&blds.indexOf(o.building_name)>=0
       &&!flrs.filter(function(f){return f.building===o.building_name&&f.floor===o.floor_no;}).length)
      e.push('해당 건물에 없는 층: '+o.floor_no);
    if(!o.address)e.push('배송주소 누락');
    if(!/^01[0-9]-[0-9]{3,4}-[0-9]{4}$/.test(o.phone))e.push('연락처 형식 오류: '+(get('phone')||'공란'));
    if(!o.option_code)e.push('옵션 누락');
    else if(optCodes.indexOf(o.option_code)<0)e.push('선택 불가 옵션: '+o.option_code);

    if(e.length)GUP.errs.push({line:i+1,name:o.person_name||'(성함없음)',msg:e.join(' · ')});
    else GUP.rows.push(o);
  }
  gupPreview();
}

function gupGo(){
  if(GUP.busy||!GUP.rows.length)return;
  var ok=document.getElementById('gup_ok');
  GUP.busy=true;ok.disabled=true;ok.textContent='등록 중...';
  var label=(typeof staffLabel==='function'?staffLabel():((CURRENT_USER&&CURRENT_USER.name)||''));
  var payload=GUP.rows.map(function(o){
    var x={event_id:GIFT.ev.id,campus_code:giftMyCampus(),qty:1,submit_status:'draft',created_by_label:label};
    for(var k in o)x[k]=o[k];
    if(giftIsHQ())x.team_name=giftMyTeam();
    return x;
  });
  // 한 번에 전부 넣으면 중복검사 트리거 때문에 DB 제한시간을 넘김 → 10건씩 순차 등록
  var CH=5, res_rows=[], inserted=0, failed=null, i0=0;
  function step(){
    if(failed||i0>=payload.length){finish();return;}
    var part=payload.slice(i0,i0+CH);
    ok.textContent='등록 중... '+Math.min(i0+CH,payload.length)+'/'+payload.length;
    sb.from('fac_gift_entries').insert(part).then(function(res){
      if(res.error){failed=res.error;finish();return;}
      inserted+=part.length;            // .select() 제거 — 응답 지연 방지
      i0+=CH;
      setTimeout(step,150);
    }).catch(function(e){failed=e;finish();});
  }
  function finish(){
    GUP.busy=false;
    if(failed){
      ok.disabled=false;ok.textContent='등록';
      var m=(failed.message||String(failed));
      var extra=/timeout/i.test(m)
        ? '<b>등록 지연:</b> 서버 응답이 늦어 중단되었습니다. '+inserted+'명까지는 등록되었습니다. 잠시 후 나머지를 다시 올려주세요.'
        : '<b>등록 실패:</b> '+docEsc(m);
      var pv=document.getElementById('gup_prev');
      if(pv)pv.innerHTML+='<div class="hint" style="margin-top:8px;color:var(--dng)">'+extra+'</div>';
      giftLoadRows();
      return;
    }
    var n=inserted;
    closeModal();
    // .select()를 뺐으므로 중복 수는 새로고침된 명단에서 집계
    giftLoadRows();
    setTimeout(function(){
      var dup=(GIFT.rows||[]).filter(function(r){return r.dup_of;}).length;
      submitDone('<b>'+n+'명</b> 등록되었습니다.'
        +(dup?('<br><span style="color:var(--warn)">현재 명단에 중복 '+dup+'명</span> — 수량 0으로 처리되어 발주에서 제외됩니다.'):'')
        +(GUP.errs.length?('<br><span class="hint">오류 '+GUP.errs.length+'행은 등록되지 않았습니다.</span>'):'')
        +'<br><span class="hint">확인 후 <b>명단 제출</b>을 눌러주세요.</span>');
    },900);
  }
  step();
}

function gadmOptImg(id){
  var o=(GADM.optAll||[]).filter(function(x){return x.id===id;})[0];if(!o)return;
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    if(f.size>5*1024*1024){submitDone('이미지는 5MB 이하만 업로드할 수 있습니다.');return;}
    giftImgCompress(f,900,function(blob){
      var ext='jpg';
      var path='gift/'+GIFT.ev.id+'/'+o.code+'_'+Date.now()+'.'+ext;
      sb.storage.from(GIMG_BUCKET).upload(path,blob,{contentType:'image/jpeg',upsert:true}).then(function(res){
        if(res.error){submitDone('업로드 오류: '+res.error.message+'\n\ngift-images 버킷이 생성되어 있는지 확인해 주세요.');return;}
        var old=o.image_path;
        sb.from('fac_gift_options').update({image_path:path}).eq('id',id).then(function(r2){
          if(r2.error){submitDone('저장 오류: '+r2.error.message);return;}
          if(old)sb.storage.from(GIMG_BUCKET).remove([old]).then(function(){},function(){});
          gadmLoad();
        });
      });
    });
  };
  inp.click();
}
function gadmOptImgDel(id){
  var o=(GADM.optAll||[]).filter(function(x){return x.id===id;})[0];if(!o||!o.image_path)return;
  if(!confirm('이미지를 삭제할까요?'))return;
  var p=o.image_path;
  sb.from('fac_gift_options').update({image_path:null}).eq('id',id).then(function(res){
    if(res.error){submitDone('삭제 오류: '+res.error.message);return;}
    sb.storage.from(GIMG_BUCKET).remove([p]).then(function(){},function(){});
    gadmLoad();
  });
}
// 이미지 압축 (긴 변 기준)
function giftImgCompress(file,max,cb){
  var img=new Image(), url=URL.createObjectURL(file);
  img.onload=function(){
    var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(function(b){URL.revokeObjectURL(url);cb(b||file);},'image/jpeg',0.86);
  };
  img.onerror=function(){URL.revokeObjectURL(url);cb(file);};
  img.src=url;
}

// login_id → Auth 이메일 (한글 등 비ASCII를 hex로 안전 변환; 영문/숫자/._-는 유지)
function toAuthEmail(loginId){
  var local=String(loginId||'').split('').map(function(ch){
    if(/[A-Za-z0-9._\-]/.test(ch))return ch;
    // 비ASCII → 유니코드 코드포인트 hex (x붙여 구분)
    return 'x'+ch.charCodeAt(0).toString(16);
  }).join('');
  return local+DOMAIN;
}

function doSignup(){
  var id=(document.getElementById('su_id').value||'').trim();
  var email=(document.getElementById('su_email')?document.getElementById('su_email').value:'').trim();
  if(!id){gateMsg('아이디를 입력하세요.','err');return;}
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){gateMsg('이메일 형식을 확인하세요.','err');return;}
  if(!SB_READY){gateMsg('서버에 연결되어 있지 않습니다.','err');return;}
  sb.rpc('fac_signup',{p_login_id:id}).then(function(res){
    if(res.error){gateMsg('오류: '+res.error.message,'err');return;}
    var r=res.data;
    if(!(r&&r.ok)){gateMsg((r&&r.error)||'신청에 실패했습니다.','err');return;}
    gateMsg('가입 신청이 접수되었습니다. ('+r.region+' · '+r.name+')<br>총무기획팀 승인 후 로그인할 수 있습니다.','ok');
    // 이메일 저장(컬럼 있으면 반영, 없으면 무시)
    var save = email ? sb.from('fac_accounts').update({email:email}).eq('login_id',id).then(function(){}).catch(function(){}) : Promise.resolve();
    // 총무기획팀 슬랙 알림 (실패해도 가입 신청 자체엔 영향 없음)
    save.then(function(){ return signupNotify(id, r, email); }).catch(function(){});
  });
}
// 가입 신청 알림 — Slack Workflow Builder 규격(평면·전 필드 문자열)
function signupNotify(id, r, email){
  var s={
    login_id : String(id||''),
    name     : String((r&&r.name)||''),
    region   : String((r&&r.region)||''),
    gwan_code: String((r&&r.gwan_code)||(String(id).split('_')[0])||''),
    email    : String(email||''),
    requested_at: new Date().toISOString().slice(0,16).replace('T',' ')
  };
  s.headline = ('가입 신청 · '+(s.region||'-')+' · '+(s.name||s.login_id)).slice(0,140);
  s.warn = s.email ? '' : '⚠️ 이메일 미입력 — 승인 시 등록 필요 (미등록 계정은 진행 알림이 발송되지 않습니다)';
  return n8nNotify({type:'signup', kind:'signup', login_id:s.login_id, summary:s})
    .then(function(){}).catch(function(){});
}
function doLogin(){
  var id=(document.getElementById('li_id').value||'').trim();
  var pw=document.getElementById('li_pw').value||'';
  if(!id||!pw){gateMsg('아이디와 비밀번호를 입력하세요.','err');return;}
  if(!SB_READY){gateMsg('서버에 연결되어 있지 않습니다.','err');return;}
  sb.auth.signInWithPassword({email:toAuthEmail(id),password:pw}).then(function(res){
    if(res.error){gateMsg('로그인 실패: 아이디·비밀번호를 확인하세요. (승인 전이면 로그인할 수 없습니다)','err');return;}
    afterLogin(id);
  });
}
function afterLogin(knownLoginId){
  if(!SB_READY){enterApp();return;}
  sb.auth.getUser().then(function(u){
    var email=(u&&u.data&&u.data.user&&u.data.user.email)||'';
    // 로그인 직후엔 입력 아이디를, 세션복구 시엔 auth_uid로 계정을 찾는다
    var authUid=(u&&u.data&&u.data.user&&u.data.user.id)||'';
    var q=knownLoginId?sb.from('fac_accounts').select('*').eq('login_id',knownLoginId).limit(1):sb.from('fac_accounts').select('*').eq('auth_uid',authUid).limit(1);
    q.then(function(res){
      var acc=(res.data&&res.data[0])||null;
      if(!acc){gateMsg('계정 정보를 찾을 수 없습니다.','err');return;}
      if(acc.status!=='active'){gateMsg(acc.status==='deleted'?'삭제된 계정입니다. 총무기획팀에 문의하세요.':'아직 승인되지 않은 계정입니다.','err');sb.auth.signOut();return;}
      CURRENT_USER={login_id:acc.login_id,role:acc.role,region:acc.region,name:acc.name,gwan_code:acc.gwan_code,email:acc.email||null};
      if(acc.must_reset){showForceReset();return;}
      enterApp();
    });
  });
}
function showForceReset(){
  document.getElementById('app').style.display='none';
  var gate=document.getElementById('gate');gate.style.display='flex';
  var body=document.getElementById('gate-body');
  document.querySelector('.gate-seg').style.display='none';
  var h2=document.querySelector('.gate-card h2');if(h2)h2.textContent='비밀번호 설정';
  var sub=document.querySelector('.gate-card .sub');if(sub)sub.textContent='최초 로그인 — 새 비밀번호를 설정하세요';
  body.innerHTML='<div class="gate-hint" style="margin-bottom:16px;line-height:1.5">보안을 위해 관리자가 부여한 초기 비밀번호를 <b>본인만 아는 비밀번호</b>로 변경해야 합니다.</div>'
    +'<div class="gate-fld"><label>새 비밀번호</label><input id="fr_pw" type="password" placeholder="6자 이상"></div>'
    +'<div class="gate-fld"><label>새 비밀번호 확인</label><input id="fr_pw2" type="password" placeholder="다시 입력"></div>'
    +'<button class="gate-btn" onclick="doForceReset()">비밀번호 설정하고 시작하기</button><div id="gate-msg"></div>';
}
function doForceReset(){
  var n1=document.getElementById('fr_pw').value||'';
  var n2=document.getElementById('fr_pw2').value||'';
  if(n1.length<6){gateMsg('비밀번호는 6자 이상이어야 합니다.','err');return;}
  if(n1!==n2){gateMsg('두 비밀번호가 일치하지 않습니다.','err');return;}
  if(!SB_READY){gateMsg('서버에 연결되어 있지 않습니다.','err');return;}
  sb.auth.updateUser({password:n1}).then(function(res){
    if(res.error){gateMsg('설정 실패: '+res.error.message,'err');return;}
    sb.from('fac_accounts').update({must_reset:false}).eq('login_id',CURRENT_USER.login_id).then(function(){
      document.querySelector('.gate-seg').style.display='';
      var h2=document.querySelector('.gate-card h2');if(h2)h2.textContent='캠퍼스 시설지원 포털';
      var sub=document.querySelector('.gate-card .sub');if(sub)sub.textContent='플로우교육 총무기획팀';
      enterApp();
    });
  });
}
function enterApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  buildTabs();
  render('home');
}
function openPwChange(){
  openModal('<div class="mb" style="padding:22px 22px 8px">'
    +'<div style="font-size:16px;font-weight:600;margin-bottom:4px">비밀번호 변경</div>'
    +'<div class="hint" style="margin-bottom:16px">새 비밀번호를 입력하세요. 변경 후 다음 로그인부터 적용됩니다.</div>'
    +'<div class="gate-fld"><label>새 비밀번호</label><input id="pw_new" type="password" placeholder="6자 이상"></div>'
    +'<div class="gate-fld"><label>새 비밀번호 확인</label><input id="pw_new2" type="password" placeholder="다시 입력"></div>'
    +'<div id="pw_msg"></div>'
    +'</div><div class="mf"><button class="mbtn no" onclick="closeModal()">취소</button><button class="mbtn yes" onclick="doPwChange()">변경</button></div>');
}
function doPwChange(){
  var n1=document.getElementById('pw_new').value||'';
  var n2=document.getElementById('pw_new2').value||'';
  var m=document.getElementById('pw_msg');
  function err(t){if(m)m.innerHTML='<div class="gate-msg err" style="margin-top:0">'+t+'</div>';}
  if(n1.length<6){err('비밀번호는 6자 이상이어야 합니다.');return;}
  if(n1!==n2){err('두 비밀번호가 일치하지 않습니다.');return;}
  if(!SB_READY){err('서버에 연결되어 있지 않습니다.');return;}
  sb.auth.updateUser({password:n1}).then(function(res){
    if(res.error){err('변경 실패: '+res.error.message);return;}
    closeModal();
    submitDone('비밀번호가 변경되었습니다. 다음 로그인부터 새 비밀번호를 사용하세요.');
  });
}
function doLogout(){
  if(SB_READY)sb.auth.signOut();
  CURRENT_USER=null;
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='flex';
  var seg=document.querySelector('.gate-seg');if(seg)seg.style.display='';
  var h2=document.querySelector('.gate-card h2');if(h2)h2.textContent='캠퍼스 시설지원 포털';
  var sub=document.querySelector('.gate-card .sub');if(sub)sub.textContent='플로우교육 총무기획팀';
  gateMode('login');
}
function buildTabs(){
  var tabs=document.getElementById('tabs');tabs.innerHTML='';
  var list=TABS.filter(function(t){return t[0]!=='admin'||(CURRENT_USER&&CURRENT_USER.role==='admin');});
  list.forEach(function(t){var b=document.createElement('button');b.className='tn';b.dataset.v=t[0];b.textContent=t[1];b.onclick=function(){render(t[0]);};tabs.appendChild(b);});
  // 계정 바(로그아웃)
  var hd=document.querySelector('.hd');
  if(hd&&!document.getElementById('acctbar')){
    var bar=document.createElement('div');bar.id='acctbar';bar.className='acctbar';bar.style.cssText='position:absolute;top:26px;right:32px';
    hd.style.position='relative';
    hd.appendChild(bar);
  }
  var bar=document.getElementById('acctbar');
  if(bar&&CURRENT_USER){bar.innerHTML='<span><b>'+(CURRENT_USER.name||CURRENT_USER.login_id)+'</b>'+(CURRENT_USER.region?(' · '+CURRENT_USER.region):'')+(CURRENT_USER.role==='admin'?' · 관리자':'')+'</span><button class="logout" onclick="openPwChange()">비밀번호 변경</button><button class="logout" onclick="doLogout()">로그아웃</button>';}
}
// 부팅: 기존 세션 있으면 바로 입장, 없으면 게이트
gateMode('login');
if(SB_READY){
  sb.auth.getSession().then(function(res){
    if(res&&res.data&&res.data.session){afterLogin();}
  });
}
</script>
